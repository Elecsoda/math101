                        <rect x="0" y="0" width="150" height="200" fill={C.a} opacity=".35" />
                        <rect x="0" y="0" width="200" height="100" fill={C.b} opacity=".3" />
                        <rect x="0" y="0" width="150" height="100" fill={C.both} opacity=".6" />
                        {[50, 100, 150].map(x => <line key={x} x1={x} y1="0" x2={x} y2="200" stroke={C.line} strokeWidth="1.5" />)}
                        <line x1="0" y1="100" x2="200" y2="100" stroke={C.line} strokeWidth="1.5" />
                    </svg>
                ),
                options: ['3/8', '3/4', '1/2', '5/4'], answer: 0,
                why: '整张纸被切成 4×2 = 8 个小格，深色有 3×1 = 3 格，所以是 3/8。算式：3/4 × 1/2 = 3/8。'
            },
            {
                type: '不算就判断', tone: 'violet',
                q: '不用计算，判断 20 × 4/5 的积与 20 相比：',
                options: ['比 20 小', '比 20 大', '等于 20', '无法判断'], answer: 0,
                why: '乘数 4/5 小于 1，取的是 20 的一部分，所以积比 20 小。（实际 = 16）'
            },
            {
                type: '不算就判断', tone: 'violet',
                q: '不用计算，判断 6 ÷ 2/3 的商与 6 相比：',
                options: ['比 6 大', '比 6 小', '等于 6', '无法判断'], answer: 0,
                why: '除数 2/3 小于 1，问的是"6 里面有几个 2/3"，每份小，份数就多，所以商比 6 大。（实际 = 9）'
            },
            {
                type: '选算式', tone: 'sky',
                q: '一根绳子长 3/4 米，平均剪成 5 段，每段长多少米？',
                options: ['3/4 ÷ 5', '3/4 × 5', '5 ÷ 3/4', '5 × 4/3'], answer: 0,
                why: '把 3/4 米平均分成 5 份，求每份 —— 这是平均分（等分除），用 3/4 ÷ 5 = 3/20 米。'
            },
            {
                type: '选算式', tone: 'sky',
                q: '一根绳子长 3/4 米，每 1/5 米剪一段，能剪几段？',
                options: ['3/4 ÷ 1/5', '3/4 × 1/5', '1/5 ÷ 3/4', '3/4 - 1/5'], answer: 0,
                why: '问"3/4 里面有几个 1/5" —— 这是包含除，用 3/4 ÷ 1/5 = 15/4 = 3¾ 段。注意和上一题的区别：这里除数是"每段的长度"。'
            },
            {
                type: '选算式', tone: 'sky',
                q: '水果店有苹果 24 千克，梨的质量是苹果的 5/6。梨有多少千克？',
                options: ['24 × 5/6', '24 ÷ 5/6', '24 × 6/5', '24 + 5/6'], answer: 0,
                why: '求"24 的 5/6 是多少"，用乘法：24 × 5/6 = 20 千克。关键词是"是……的几分之几"。'
            },
            {
                type: '选算式', tone: 'rose',
                q: '梨有 20 千克，梨的质量是苹果的 5/6。苹果有多少千克？',
                options: ['20 ÷ 5/6', '20 × 5/6', '20 ÷ 6/5', '20 - 5/6'], answer: 0,
                why: '这次已知的是"5/6 对应的量"，要反过来求单位 1（苹果），用除法：20 ÷ 5/6 = 24 千克。⚠️ 求"谁的几分之几"用乘，已知几分之几求整体用除。'
            },
            {
                type: '算一算', tone: 'emerald',
                q: '计算：5/8 × 4/15（要求先约分）',
                options: ['1/6', '20/120', '3/8', '2/3'], answer: 0,
                why: '5 与 15 约去 5，4 与 8 约去 4 → (1×1)/(2×3) = 1/6。先约分比先乘再约简单得多。'
            },
            {
                type: '算一算', tone: 'emerald',
                q: '计算：7/9 ÷ 14/27',
                options: ['3/2', '2/3', '98/243', '1/2'], answer: 0,
                why: '7/9 ÷ 14/27 = 7/9 × 27/14，7 与 14 约去 7，27 与 9 约去 9 → (1×3)/(1×2) = 3/2 = 1½。'
            },
            {
                type: '算一算', tone: 'emerald',
                q: '计算：2⅔ × ¾',
                options: ['2', '2⅓', '6/12', '1½'], answer: 0,
                why: '先化假分数：2⅔ = 8/3。8/3 × 3/4，3 与 3 约、8 与 4 约 → 2×1/1×1 = 2。'
            }
        ];

        // Tailwind CDN 无法识别拼接出来的类名，题型标签的配色写成静态映射
        const TONE_CHIP = {
            amber: 'bg-amber-100 text-amber-700',
            violet: 'bg-violet-100 text-violet-700',
            sky: 'bg-sky-100 text-sky-700',
            rose: 'bg-rose-100 text-rose-700',
            emerald: 'bg-emerald-100 text-emerald-700'
        };

        // 题库里正确答案都写在第 0 位，显示前打乱，避免学生靠位置猜答案
        const shuffleOptions = (q) => {
            const idx = q.options.map((_, i) => i);
            for (let i = idx.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [idx[i], idx[j]] = [idx[j], idx[i]];
            }
            return { options: idx.map(i => q.options[i]), answer: idx.indexOf(q.answer) };
        };

        const Practice = () => {
            const [i, setI] = useState(0);
            const [picked, setPicked] = useState(null);
            const [score, setScore] = useState(0);
            const [done, setDone] = useState([]);

            const [round, setRound] = useState(0);   // 重新开始时 +1，触发重新打乱

            const base = QUESTIONS[i];
            // 每进入一道题（或重新开始）打乱一次，答题过程中保持不变
            const shuffled = useMemo(() => shuffleOptions(base), [i, round]);
            const q = { ...base, options: shuffled.options, answer: shuffled.answer };
            const answered = picked !== null;
            const correct = picked === q.answer;

            const choose = (idx) => {
                if (answered) return;
                setPicked(idx);
                if (idx === q.answer && !done.includes(i)) { setScore(score + 1); setDone([...done, i]); }
                else if (!done.includes(i)) setDone([...done, i]);
            };
            const next = () => { setPicked(null); setI((i + 1) % QUESTIONS.length); };
            const restart = () => { setPicked(null); setI(0); setScore(0); setDone([]); setRound(round + 1); };

            return (
                <section className="fade-in">
                    <Card className="mb-5">
                        <div className="flex items-center justify-between flex-wrap gap-3">
                            <div>
                                <span className="text-sm text-slate-400">第 {i + 1} / {QUESTIONS.length} 题</span>
                                <span className={`ml-3 px-2.5 py-1 rounded-lg text-xs font-semibold ${TONE_CHIP[q.tone]}`}>{q.type}</span>
                            </div>
                            <div className="text-sm text-slate-500">已答 <b className="text-slate-700">{done.length}</b> 题 · 答对 <b className="text-emerald-600">{score}</b> 题</div>
                        </div>
                        <div className="w-full h-1.5 bg-slate-100 rounded-full mt-3 overflow-hidden">
                            <div className="h-full bg-emerald-400 smooth" style={{ width: `${done.length / QUESTIONS.length * 100}%` }}></div>
                        </div>
                    </Card>

                    <Card>
                        <p className="text-xl text-slate-800 leading-relaxed mt-0">{q.q}</p>
                        {q.render && <div className="my-4">{q.render()}</div>}

                        <div className="grid sm:grid-cols-2 gap-3 mt-4">
                            {q.options.map((o, idx) => {
                                const isAns = idx === q.answer;
                                let cls = 'bg-white border-slate-200 text-slate-700 hover:border-slate-400';
                                if (answered && isAns) cls = 'bg-emerald-500 text-white border-transparent shadow';
                                else if (answered && idx === picked) cls = 'bg-rose-100 border-rose-300 text-rose-700';
                                else if (answered) cls = 'bg-white border-slate-100 text-slate-400';
                                return <button key={idx} onClick={() => choose(idx)} disabled={answered}
                                    className={`p-4 rounded-xl border-2 text-lg font-semibold smooth ${cls}`}>
                                    {answered && isAns && '✓ '}{answered && idx === picked && !isAns && '✗ '}{o}
                                </button>;
                            })}
                        </div>

                        {answered && <div className="mt-5 fade-in">
                            <Note tone={correct ? 'emerald' : 'rose'}>
                                <p className="m-0 font-semibold">{correct ? '✅ 答对了！' : '❌ 再想想这道题的道理：'}</p>
                                <p className="mt-2 mb-0">{q.why}</p>
                            </Note>
                            <div className="flex justify-center gap-3 mt-4">
                                <button onClick={next} className="px-6 py-2.5 rounded-xl bg-slate-800 text-white hover:bg-slate-700 shadow smooth">下一题 →</button>
                                <button onClick={restart} className="px-4 py-2.5 rounded-xl bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 smooth">重新开始 ↻</button>
                            </div>
                        </div>}
                    </Card>

                    {done.length === QUESTIONS.length && <Note tone="emerald" className="mt-5">
                        <p className="m-0 text-center text-lg">🎉 全部答完！答对 <b>{score}</b> / {QUESTIONS.length} 题。
                        {score < QUESTIONS.length && ' 回到前面的模块，把做错的那类再看一遍图。'}</p>
                    </Note>}
                </section>
            );
        };

        // ======================================================================
        // 主程序
        // ======================================================================
        const TABS = [
            { id: 'fxi', title: '① 分数×整数', hint: '连加：几个几分之几', color: 'bg-amber-500', group: '乘法' },
            { id: 'ixf', title: '② 整数×分数', hint: '求一个数的几分之几', color: 'bg-violet-600', group: '乘法' },
            { id: 'fxf', title: '③ 分数×分数', hint: '折纸面积模型（重点）', color: 'bg-emerald-600', group: '乘法' },
            { id: 'cmp', title: '④ 越乘越小？', hint: '和 1 比，判断大小', color: 'bg-rose-500', group: '乘法' },
            { id: 'fdi', title: '⑤ 分数÷整数', hint: '平均分给几个人', color: 'bg-sky-600', group: '除法' },
            { id: 'mdv', title: '⑥ 里面有几个', hint: '包含除（关键）', color: 'bg-indigo-600', group: '除法' },
            { id: 'why', title: '⑦ 为什么颠倒相乘', hint: '三条路推出倒数', color: 'bg-purple-700', group: '除法' },
            { id: 'cal', title: '⑧ 计算车间', hint: '带分数·约分·笔算', color: 'bg-slate-700', group: '计算' },
            { id: 'pra', title: '⑨ 闯关练习', hint: '列式·判断·计算', color: 'bg-green-600', group: '计算' }
        ];

        const App = () => {
            const [tab, setTab] = useState('fxf');
            const idx = TABS.findIndex(t => t.id === tab);

            return (
                <main className="max-w-6xl mx-auto px-4 py-8">
                    <header className="relative text-center mb-6 px-12">
                        <a href="/" aria-label="返回主页" title="返回主页" className="absolute left-0 top-0 inline-flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-500 shadow-sm hover:bg-slate-50 smooth">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></svg>
                        </a>
                        <div className="inline-flex px-3 py-1 rounded-full bg-emerald-100 text-emerald-700 text-sm font-semibold mb-2">五 ~ 六年级 · 分数乘法与除法</div>
                        <h1 className="text-3xl md:text-4xl font-bold text-slate-800 m-0">分数的乘法与除法</h1>
                        <p className="text-slate-500 mt-3 mb-0">折一折、量一量、数一数 —— 先<b>看懂道理</b>，再<b>学会计算</b></p>
                    </header>

                    <nav className="mb-7" aria-label="知识模块">
                        {['乘法', '除法', '计算'].map(g => (
                            <div key={g} className="mb-2">
                                <p className="text-xs text-slate-400 font-semibold mb-1.5 ml-1">{g === '乘法' ? '🟠 分数乘法' : g === '除法' ? '🔵 分数除法' : '🟢 从直观到计算'}</p>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                                    {TABS.filter(t => t.group === g).map(t => (
                                        <button key={t.id} onClick={() => setTab(t.id)}
                                            className={`p-3 rounded-xl border-2 text-left smooth ${tab === t.id ? `${t.color} text-white border-transparent shadow-md` : 'bg-white text-slate-600 border-slate-200 hover:border-slate-300'}`}>
                                            <b className="block text-sm">{t.title}</b>
                                            <span className={`text-xs ${tab === t.id ? 'text-white/80' : 'text-slate-400'}`}>{t.hint}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </nav>

                    {tab === 'fxi' && <FracTimesInt />}
                    {tab === 'ixf' && <IntTimesFrac />}
                    {tab === 'fxf' && <FracTimesFrac />}
                    {tab === 'cmp' && <CompareToOne />}
                    {tab === 'fdi' && <FracDivInt />}
                    {tab === 'mdv' && <MeasurementDiv />}
                    {tab === 'why' && <WhyInvert />}
                    {tab === 'cal' && <CalcWorkshop />}
                    {tab === 'pra' && <Practice />}

                    {/* 上一节 / 下一节，方便按顺序学下来 */}
                    <div className="flex justify-between items-center gap-3 mt-8">
                        {idx > 0
                            ? <button onClick={() => setTab(TABS[idx - 1].id)} className="px-4 py-2.5 rounded-xl bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 smooth text-sm">← {TABS[idx - 1].title}</button>
                            : <span></span>}
                        {idx < TABS.length - 1
                            ? <button onClick={() => setTab(TABS[idx + 1].id)} className="px-4 py-2.5 rounded-xl bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 smooth text-sm">{TABS[idx + 1].title} →</button>
                            : <span></span>}
                    </div>

                    <footer className="text-center text-slate-400 text-sm mt-10">
                        Math101 · 分数可视化 · 适用人教版六年级上册《分数乘法》《分数除法》
                    </footer>
                </main>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <div style="box-sizing:border-box;width:100%;padding:24px 16px;text-align:center;color:#94a3b8;font:13px/1.6 system-ui,-apple-system,sans-serif;">©孙维刚教育研究院 小宇老师 版权所有</div>
</body>
</html>
