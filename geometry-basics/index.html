<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>几何基础概念 | Math101</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f3f4f6; margin: 0; padding: 0; }
        .fade-in { animation: fadeIn 0.4s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .smooth-transition { transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
        .geo-svg { touch-action: none; user-select: none; -webkit-user-select: none; }
        .grab { cursor: grab; }
        .grab:active { cursor: grabbing; }
        .move { cursor: move; }
        .pulse-ok { animation: pulseOk 1.2s ease-in-out infinite; }
        @keyframes pulseOk { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
    </style>
    <link rel="stylesheet" href="../ipad-touch-adapter.css">
    <script src="../ipad-touch-adapter.js" defer></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useMemo, useRef, useCallback, useEffect } = React;

        // ===== 公共小工具 =====
        // 角度约定：水平向右为 0°，逆时针为正。屏幕 y 轴向下，画图时取负。
        const toRad = (d) => d * Math.PI / 180;
        const toDeg = (r) => r * 180 / Math.PI;
        const round1 = (n) => Math.round(n * 10) / 10;
        const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
        const norm360 = (d) => ((d % 360) + 360) % 360;
        const norm180 = (d) => ((d % 180) + 180) % 180;
        const PX_CM = 20;                                    // 20px = 1cm，纯展示用

        const dirToDeg = (dx, dy) => norm360(toDeg(Math.atan2(-dy, dx)));

        // 两条射线的夹角（取 0~180 的那一个）
        const angleBetween = (a, b) => {
            const d = Math.abs(a - b) % 360;
            return d > 180 ? 360 - d : d;
        };

        const dist = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]);
        const add = (p, q) => [p[0] + q[0], p[1] + q[1]];
        const sub = (p, q) => [p[0] - q[0], p[1] - q[1]];
        const mul = (p, k) => [p[0] * k, p[1] * k];
        const unit = (dg) => [Math.cos(toRad(dg)), -Math.sin(toRad(dg))];
        const along = (p, dg, len) => [p[0] + len * Math.cos(toRad(dg)), p[1] - len * Math.sin(toRad(dg))];
        const cm = (px) => round1(px / PX_CM);

        // 点 p 在「过 c、方向 dg 的直线」上的垂足
        const footOf = (p, c, dg) => {
            const u = unit(dg);
            const t = (p[0] - c[0]) * u[0] + (p[1] - c[1]) * u[1];
            return [c[0] + u[0] * t, c[1] + u[1] * t];
        };

        // 两条直线求交点，平行返回 null
        const intersectOf = (c1, d1, c2, d2) => {
            const u1 = unit(d1), u2 = unit(d2);
            const den = u1[0] * u2[1] - u1[1] * u2[0];
            if (Math.abs(den) < 1e-9) return null;
            const t = ((c2[0] - c1[0]) * u2[1] - (c2[1] - c1[1]) * u2[0]) / den;
            return [c1[0] + u1[0] * t, c1[1] + u1[1] * t];
        };

        // 弧线的 A 指令（不含起点 M），从 a0 逆时针到 a1
        const arcCmd = (cx, cy, r, a0, a1) => {
            const span = norm360(a1 - a0);
            const x1 = cx + r * Math.cos(toRad(a1)), y1 = cy - r * Math.sin(toRad(a1));
            return `A ${r} ${r} 0 ${span > 180 ? 1 : 0} 0 ${x1} ${y1}`;
        };

        // 画弧线：从 a0 逆时针到 a1
        const arcPath = (cx, cy, r, a0, a1) => {
            const x0 = cx + r * Math.cos(toRad(a0)), y0 = cy - r * Math.sin(toRad(a0));
            return `M ${x0} ${y0} ${arcCmd(cx, cy, r, a0, a1)}`;
        };

        // 扇形（顶点 + 一段弧），用来给角的内部涂色
        const wedgePath = (cx, cy, r, a0, a1) =>
            `M ${cx} ${cy} L ${cx + r * Math.cos(toRad(a0))} ${cy - r * Math.sin(toRad(a0))} ` +
            arcCmd(cx, cy, r, a0, a1) + ' Z';

        // 直角标记（小方块）：顶点 v，两条边方向 a、b（度）
        const RightAngleMark = ({ v, a, b, size = 18, color = "#2563eb" }) => {
            const p1 = along(v, a, size), p2 = along(v, b, size);
            const p3 = [p1[0] + p2[0] - v[0], p1[1] + p2[1] - v[1]];
            return <polyline points={`${p1[0]},${p1[1]} ${p3[0]},${p3[1]} ${p2[0]},${p2[1]}`}
                fill="none" stroke={color} strokeWidth="2.5" />;
        };

        // 通用：把指针事件换算到 SVG 坐标
        const useSvgPoint = (svgRef, W, H) => useCallback((e) => {
            const pt = e.touches && e.touches.length ? e.touches[0] : e;
            const rect = svgRef.current.getBoundingClientRect();
            return [
                (pt.clientX - rect.left) / rect.width * W,
                (pt.clientY - rect.top) / rect.height * H,
            ];
        }, [svgRef, W, H]);

        // 拖拽外壳：谁在拖 + 按下时的偏移量，够所有模块用了
        const useDragger = (toPt) => {
            const drag = useRef(null);
            const start = (id, anchor) => (e) => {
                e.preventDefault();
                e.stopPropagation();
                const p = toPt(e);
                drag.current = { id, off: anchor ? sub(anchor, p) : [0, 0] };
            };
            const stop = () => { drag.current = null; };
            return { drag, start, stop };
        };

        // 可拖动的把手
        const Handle = ({ p, color = "#f97316", r = 11, onDown, label, labelDy = 0, dim = false }) => (
            <g className="grab" onMouseDown={onDown} onTouchStart={onDown}>
                <circle cx={p[0]} cy={p[1]} r={r + 10} fill="transparent" />
                <circle cx={p[0]} cy={p[1]} r={r} fill="#fff" stroke={color} strokeWidth="3.5" opacity={dim ? 0.55 : 1} />
                {label && <text x={p[0]} y={p[1] - r - 8 + labelDy} textAnchor="middle"
                    className="text-sm font-bold" fill={color}>{label}</text>}
            </g>
        );

        // 浅网格背景，帮孩子看"平"和"直"
        const GridBg = ({ W, H, step = 40, fill = "#fafafa" }) => {
            const lines = [];
            for (let x = step; x < W; x += step) lines.push(<line key={'v' + x} x1={x} y1="0" x2={x} y2={H} stroke="#e8eef5" strokeWidth="1" />);
            for (let y = step; y < H; y += step) lines.push(<line key={'h' + y} x1="0" y1={y} x2={W} y2={y} stroke="#e8eef5" strokeWidth="1" />);
            return <g><rect x="0" y="0" width={W} height={H} fill={fill} rx="14" />{lines}</g>;
        };

        // 卡片外壳
        const Card = ({ children, className = "" }) => (
            <div className={"bg-white rounded-2xl shadow-sm p-5 " + className}>{children}</div>
        );

        // 结论条：一句话说明，用颜色区分
        const TONES = {
            blue: "bg-blue-50 text-blue-700 border-blue-200",
            emerald: "bg-emerald-50 text-emerald-700 border-emerald-200",
            orange: "bg-orange-50 text-orange-700 border-orange-200",
            purple: "bg-purple-50 text-purple-700 border-purple-200",
            slate: "bg-slate-50 text-slate-600 border-slate-200",
            rose: "bg-rose-50 text-rose-700 border-rose-200",
            cyan: "bg-cyan-50 text-cyan-700 border-cyan-200",
        };
        const Verdict = ({ tone, children }) => (
            <div className={"rounded-xl border px-4 py-2.5 text-center font-bold text-lg smooth-transition " + TONES[tone]}>{children}</div>
        );

        // 教材原话式的小结，和"结论条"区分开：这里放定义
        const BookNote = ({ title, children }) => (
            <div className="rounded-xl border border-amber-200 bg-amber-50 px-4 py-3">
                <div className="text-xs font-bold text-amber-600 mb-1">📖 {title}</div>
                <div className="text-sm text-amber-900 leading-relaxed">{children}</div>
            </div>
        );

        // 二级切换（每个大模块里的小场景）
        const SubTabs = ({ items, value, onChange }) => (
            <div className="flex justify-center gap-2 flex-wrap">
                {items.map(([k, label]) => (
                    <button key={k} onClick={() => onChange(k)}
                        className={"px-4 py-1.5 rounded-lg text-sm font-bold smooth-transition border " +
                            (value === k ? "bg-slate-700 text-white border-slate-700 shadow-sm"
                                         : "bg-white text-slate-500 border-slate-200 hover:bg-slate-50")}>
                        {label}
                    </button>
                ))}
            </div>
        );

        const Btn = ({ onClick, children, tone = "slate", disabled, active }) => {
            const map = {
                slate: "bg-slate-100 text-slate-600 hover:bg-slate-200",
                dark: "bg-slate-700 text-white hover:bg-slate-800",
                blue: "bg-blue-500 text-white hover:brightness-110",
                emerald: "bg-emerald-500 text-white hover:brightness-110",
                orange: "bg-orange-500 text-white hover:brightness-110",
                violet: "bg-violet-500 text-white hover:brightness-110",
                cyan: "bg-cyan-600 text-white hover:brightness-110",
            };
            return (
                <button onClick={onClick} disabled={disabled}
                    className={"px-4 py-2 rounded-lg text-sm font-bold smooth-transition disabled:opacity-40 " +
                        (active === false ? "bg-slate-100 text-slate-500" : map[tone])}>
                    {children}
                </button>
            );
        };

        const StepRow = ({ ok, children }) => (
            <div className={"flex items-start gap-2 text-sm smooth-transition " + (ok ? "text-emerald-600 font-bold" : "text-slate-500")}>
                <span className={"mt-0.5 inline-flex h-5 w-5 shrink-0 items-center justify-center rounded-full text-xs font-bold " +
                    (ok ? "bg-emerald-500 text-white" : "bg-slate-200 text-slate-500")}>{ok ? '✓' : '·'}</span>
                <span>{children}</span>
            </div>
        );

        // ===========================================================
        // 模块一：线 —— 直线、射线、线段
        // ===========================================================
        const LINE_KINDS = {
            segment: { name: '线段', color: '#2563eb', ends: 2, desc: '两头都有端点，不能延长', read: '线段 AB', measure: '能量出长度' },
            ray:     { name: '射线', color: '#059669', ends: 1, desc: '一头有端点，另一头无限延长', read: '射线 AB（端点 A 写在前面）', measure: '不能量长度' },
            line:    { name: '直线', color: '#c026d3', ends: 0, desc: '两头都无限延长', read: '直线 AB，也可以写作直线 l', measure: '不能量长度' },
        };

        // —— 场景 1：认一认三种线
        const LineKinds = () => {
            const W = 620, H = 360;
            const svgRef = useRef(null);
            const toPt = useSvgPoint(svgRef, W, H);
            const { drag, start, stop } = useDragger(toPt);
            const [kind, setKind] = useState('segment');
            const [a, setA] = useState([180, 210]);
            const [b, setB] = useState([440, 150]);

            const onMove = (e) => {
                if (!drag.current) return;
                e.preventDefault();
                const raw = toPt(e);
                const p = add(raw, drag.current.off);
                const fit = (q) => [clamp(q[0], 26, W - 26), clamp(q[1], 26, H - 26)];
                if (drag.current.id === 'a') setA(fit(p));
                else if (drag.current.id === 'b') setB(fit(p));
                else if (drag.current.id === 'body') {              // 整条线一起挪
                    const d = sub(fit(p), a);
                    const nb = [b[0] + d[0], b[1] + d[1]];
                    if (nb[0] > 20 && nb[0] < W - 20 && nb[1] > 20 && nb[1] < H - 20) { setA(fit(p)); setB(nb); }
                }
            };

            const meta = LINE_KINDS[kind];
            const L = dist(a, b) || 1;
            const u = [(b[0] - a[0]) / L, (b[1] - a[1]) / L];
            const FAR = 1400;
            const extA = [a[0] - u[0] * FAR, a[1] - u[1] * FAR];
            const extB = [b[0] + u[0] * FAR, b[1] + u[1] * FAR];
            const arrowAt = (p, dirDeg, color) => (
                <polygon points="0,0 -16,7 -16,-7" fill={color} opacity="0.75"
                    transform={`translate(${p[0]} ${p[1]}) rotate(${-dirDeg})`} />
            );
            const dirB = dirToDeg(u[0], u[1]), dirA = norm360(dirB + 180);
            const edgeB = along(a, dirB, Math.min(FAR, 900));
            const edgeA = along(b, dirA, Math.min(FAR, 900));

            return (
                <div className="space-y-4">
                    <div className="flex justify-center gap-2 flex-wrap">
                        {Object.entries(LINE_KINDS).map(([k, v]) => (
                            <button key={k} onClick={() => setKind(k)}
                                className={"px-5 py-2 rounded-xl font-bold smooth-transition border-2 " +
                                    (kind === k ? "text-white shadow" : "bg-white text-slate-500 border-slate-200 hover:bg-slate-50")}
                                style={kind === k ? { background: v.color, borderColor: v.color } : {}}>
                                {v.name}
                            </button>
                        ))}
                    </div>

                    <Card>
                        <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} className="geo-svg w-full"
                            onMouseMove={onMove} onMouseUp={stop} onMouseLeave={stop}
                            onTouchMove={onMove} onTouchEnd={stop}>
                            <defs><clipPath id="lineClip"><rect x="0" y="0" width={W} height={H} rx="14" /></clipPath></defs>
                            <GridBg W={W} H={H} />

                            <g clipPath="url(#lineClip)">
                                {/* 无限延长的部分画成虚线 + 箭头，提示"还在往外走" */}
                                {meta.ends !== 2 && (
                                    <g>
                                        <line x1={b[0]} y1={b[1]} x2={extB[0]} y2={extB[1]}
                                            stroke={meta.color} strokeWidth="4" strokeDasharray="10 8" opacity="0.5" />
                                        {arrowAt(edgeB, dirB, meta.color)}
                                    </g>
                                )}
                                {meta.ends === 0 && (
                                    <g>
                                        <line x1={a[0]} y1={a[1]} x2={extA[0]} y2={extA[1]}
                                            stroke={meta.color} strokeWidth="4" strokeDasharray="10 8" opacity="0.5" />
                                        {arrowAt(edgeA, dirA, meta.color)}
                                    </g>
                                )}
                                <line x1={a[0]} y1={a[1]} x2={b[0]} y2={b[1]} stroke={meta.color} strokeWidth="5"
                                    className="move" onMouseDown={start('body', a)} onTouchStart={start('body', a)} />
                                <line x1={a[0]} y1={a[1]} x2={b[0]} y2={b[1]} stroke="transparent" strokeWidth="26"
                                    className="move" onMouseDown={start('body', a)} onTouchStart={start('body', a)} />
                            </g>

                            {/* 端点：实心圆＝有端点 */}
                            {meta.ends >= 1 && <circle cx={a[0]} cy={a[1]} r="7" fill={meta.color} />}
                            {meta.ends === 2 && <circle cx={b[0]} cy={b[1]} r="7" fill={meta.color} />}

                            <Handle p={a} color={meta.color} label="A" onDown={start('a', a)} />
                            <Handle p={b} color={meta.color} label="B" onDown={start('b', b)} />

                            {/* 只有线段能量长度 */}
                            {meta.ends === 2 && (
                                <text x={(a[0] + b[0]) / 2} y={(a[1] + b[1]) / 2 - 16} textAnchor="middle"
                                    className="text-base font-bold" fill="#1d4ed8">{cm(L)} cm</text>
                            )}
                        </svg>
                        <p className="text-center text-slate-500 mt-2 text-sm">拖 A、B 两个端点，也可以<span className="font-bold">按住线本身整条挪</span></p>
                    </Card>

                    <Verdict tone={kind === 'segment' ? 'blue' : kind === 'ray' ? 'emerald' : 'purple'}>
                        读作：{meta.read}
                    </Verdict>

                    <div className="grid grid-cols-3 gap-3">
                        {Object.entries(LINE_KINDS).map(([k, v]) => (
                            <div key={k} className={"rounded-xl border-2 p-3 text-center smooth-transition " +
                                (kind === k ? "bg-white shadow" : "bg-white/50 border-transparent opacity-60")}
                                style={kind === k ? { borderColor: v.color } : {}}>
                                <div className="font-bold" style={{ color: v.color }}>{v.name}</div>
                                <div className="text-xs text-slate-500 mt-1 leading-relaxed">{v.desc}</div>
                                <div className="text-xs font-bold mt-2 text-slate-400">端点 {v.ends} 个 · {v.measure}</div>
                            </div>
                        ))}
                    </div>

                    <BookNote title="课本上的说法">
                        线段有两个端点，是有限长的；把线段的一端无限延长，得到<span className="font-bold">射线</span>；
                        把线段的两端都无限延长，得到<span className="font-bold">直线</span>。射线和直线都<span className="font-bold">不能度量长度</span>。
                    </BookNote>
                </div>
            );
        };

        // —— 场景 2：过一点 / 过两点，能画几条直线
        const ThroughPoints = () => {
            const W = 620, H = 360;
            const svgRef = useRef(null);
            const toPt = useSvgPoint(svgRef, W, H);
            const { drag, start, stop } = useDragger(toPt);
            const [two, setTwo] = useState(false);
            const [p, setP] = useState([250, 190]);
            const [q, setQ] = useState([430, 130]);
            const [n, setN] = useState(3);                       // 过一点画了几条

            const onMove = (e) => {
                if (!drag.current) return;
                e.preventDefault();
                const raw = add(toPt(e), drag.current.off);
                const fit = [clamp(raw[0], 40, W - 40), clamp(raw[1], 40, H - 40)];
                (drag.current.id === 'p' ? setP : setQ)(fit);
            };

            const FAR = 900;
            const drawLine = (c, deg, color, w, dash, key, op) => {
                const e1 = along(c, deg, FAR), e2 = along(c, deg + 180, FAR);
                return <line key={key} x1={e1[0]} y1={e1[1]} x2={e2[0]} y2={e2[1]}
                    stroke={color} strokeWidth={w} strokeDasharray={dash} opacity={op == null ? 1 : op} strokeLinecap="round" />;
            };

            const pqDeg = dirToDeg(q[0] - p[0], q[1] - p[1]);
            const fan = Array.from({ length: n }, (_, i) => 15 + i * (150 / Math.max(1, n)));

            return (
                <div className="space-y-4">
                    <SubTabs items={[['one', '过一点'], ['two', '过两点']]}
                        value={two ? 'two' : 'one'} onChange={(k) => setTwo(k === 'two')} />

                    <Card>
                        <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} className="geo-svg w-full"
                            onMouseMove={onMove} onMouseUp={stop} onMouseLeave={stop}
                            onTouchMove={onMove} onTouchEnd={stop}>
                            <defs><clipPath id="tpClip"><rect x="0" y="0" width={W} height={H} rx="14" /></clipPath></defs>
                            <GridBg W={W} H={H} />
                            <g clipPath="url(#tpClip)">
                                {!two && fan.map((d, i) => drawLine(p, d, '#8b5cf6', 3.5, null, i, 0.75))}
                                {two && (
                                    <g>
                                        {/* 画歪的都被拉回同一条：两点只能确定一条 */}
                                        {[-9, 9].map((off, i) => drawLine(p, pqDeg + off, '#cbd5e1', 3, '8 8', 'ghost' + i, 0.8))}
                                        {drawLine(p, pqDeg, '#c026d3', 5)}
                                    </g>
                                )}
                            </g>
                            <circle cx={p[0]} cy={p[1]} r="7" fill="#1e293b" />
                            <Handle p={p} color="#7c3aed" label={two ? 'A' : 'P'} onDown={start('p', p)} />
                            {two && <g><circle cx={q[0]} cy={q[1]} r="7" fill="#1e293b" />
                                <Handle p={q} color="#c026d3" label="B" onDown={start('q', q)} /></g>}
                        </svg>
                        <p className="text-center text-slate-500 mt-2 text-sm">
                            {two ? '拖动 A、B 两点：不管怎么拖，穿过它们的直线永远只有一条（灰虚线都靠不上去）'
                                 : '拖动点 P，再按下面的按钮多画几条'}
                        </p>
                    </Card>

                    {!two && (
                        <Card>
                            <div className="flex justify-center gap-2 flex-wrap">
                                <Btn tone="violet" onClick={() => setN(Math.min(36, n + 3))}>再画 3 条</Btn>
                                <Btn tone="violet" onClick={() => setN(36)}>画满</Btn>
                                <Btn onClick={() => setN(3)}>重来</Btn>
                            </div>
                            <p className="text-center text-sm text-slate-500 mt-3">已经画了 <span className="font-bold text-violet-600">{n}</span> 条，还能接着画……</p>
                        </Card>
                    )}

                    <Verdict tone={two ? 'purple' : 'blue'}>
                        {two ? '两点确定一条直线：过两点只能画一条直线' : '过一点可以画无数条直线'}
                    </Verdict>

                    <BookNote title="为什么有用">
                        钉木条时钉<span className="font-bold">两颗钉子</span>就固定住了、拉线绳时先定<span className="font-bold">两个点</span>，
                        用的都是「两点确定一条直线」。
                    </BookNote>
                </div>
            );
        };

        // —— 场景 3：两点之间线段最短
        const ShortestPath = () => {
            const W = 620, H = 360;
            const svgRef = useRef(null);
            const toPt = useSvgPoint(svgRef, W, H);
            const { drag, start, stop } = useDragger(toPt);
            const [a, setA] = useState([110, 270]);
            const [b, setB] = useState([510, 120]);
            const [m1, setM1] = useState([230, 90]);            // 折线的拐点
            const [m2, setM2] = useState([420, 300]);

            const onMove = (e) => {
                if (!drag.current) return;
                e.preventDefault();
                const raw = add(toPt(e), drag.current.off);
                const fit = [clamp(raw[0], 30, W - 30), clamp(raw[1], 30, H - 30)];
                ({ a: setA, b: setB, m1: setM1, m2: setM2 })[drag.current.id](fit);
            };

            const straight = dist(a, b);
            const bent1 = dist(a, m1) + dist(m1, b);
            const bent2 = dist(a, m2) + dist(m2, b);
            const rows = [
                { key: 'straight', name: '① 直直的线段', len: straight, color: '#2563eb' },
                { key: 'b1', name: '② 拐一下', len: bent1, color: '#f97316' },
                { key: 'b2', name: '③ 绕另一边', len: bent2, color: '#8b5cf6' },
            ];
            const maxLen = Math.max(...rows.map((r) => r.len));

            return (
                <div className="space-y-4">
                    <Card>
                        <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} className="geo-svg w-full"
                            onMouseMove={onMove} onMouseUp={stop} onMouseLeave={stop}
                            onTouchMove={onMove} onTouchEnd={stop}>
                            <GridBg W={W} H={H} />
                            <polyline points={`${a[0]},${a[1]} ${m1[0]},${m1[1]} ${b[0]},${b[1]}`}
                                fill="none" stroke="#f97316" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" opacity="0.85" />
                            <polyline points={`${a[0]},${a[1]} ${m2[0]},${m2[1]} ${b[0]},${b[1]}`}
                                fill="none" stroke="#8b5cf6" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" opacity="0.85" />
                            <line x1={a[0]} y1={a[1]} x2={b[0]} y2={b[1]} stroke="#2563eb" strokeWidth="6" strokeLinecap="round" />

                            <text x={(a[0] + b[0]) / 2} y={(a[1] + b[1]) / 2 - 12} textAnchor="middle"
                                className="text-sm font-bold" fill="#1d4ed8">{cm(straight)} cm</text>

                            <circle cx={a[0]} cy={a[1]} r="8" fill="#1e293b" />
                            <circle cx={b[0]} cy={b[1]} r="8" fill="#1e293b" />
                            <Handle p={a} color="#1e293b" label="A" onDown={start('a', a)} />
                            <Handle p={b} color="#1e293b" label="B" onDown={start('b', b)} />
                            <Handle p={m1} color="#f97316" r={9} onDown={start('m1', m1)} />
                            <Handle p={m2} color="#8b5cf6" r={9} onDown={start('m2', m2)} />
                        </svg>
                        <p className="text-center text-slate-500 mt-2 text-sm">拖 A、B，也拖两个<span className="font-bold">拐点</span>试试，看能不能让折线比线段短</p>
                    </Card>

                    <Card>
                        <div className="space-y-2">
                            {rows.map((r) => (
                                <div key={r.key} className="flex items-center gap-3">
                                    <div className="w-24 shrink-0 text-sm font-bold" style={{ color: r.color }}>{r.name}</div>
                                    <div className="flex-1 h-5 rounded-full bg-slate-100 overflow-hidden">
                                        <div className="h-full rounded-full smooth-transition"
                                            style={{ width: (r.len / maxLen * 100) + '%', background: r.color, opacity: 0.85 }} />
                                    </div>
                                    <div className="w-20 shrink-0 text-right text-sm font-bold text-slate-600">{cm(r.len)} cm</div>
                                </div>
                            ))}
                        </div>
                    </Card>

                    <Verdict tone="blue">两点之间的所有连线中，线段最短 —— 这条线段的长度叫做两点间的距离</Verdict>
                    <BookNote title="生活里">过草坪时被踩出的近路、拉紧的绳子，都是在走「线段」这条最短的路。</BookNote>
                </div>
            );
        };

        const Lines = () => {
            const [mode, setMode] = useState('kinds');
            return (
                <div className="fade-in space-y-4">
                    <SubTabs items={[['kinds', '认一认'], ['through', '画几条直线'], ['short', '线段最短']]}
                        value={mode} onChange={setMode} />
                    {mode === 'kinds' && <LineKinds />}
                    {mode === 'through' && <ThroughPoints />}
                    {mode === 'short' && <ShortestPath />}
                </div>
            );
        };

        // ===========================================================
        // 模块二：认识角 —— 自由张合、命名、角的家族
        // ===========================================================
        const angleKind = (deg) => {
            const d = Math.round(deg);
            if (d === 0) return { name: '零角', tone: 'slate', color: '#64748b' };
            if (d < 90) return { name: '锐角', tone: 'emerald', color: '#059669' };
            if (d === 90) return { name: '直角', tone: 'blue', color: '#2563eb' };
            if (d < 180) return { name: '钝角', tone: 'orange', color: '#ea580c' };
            if (d === 180) return { name: '平角', tone: 'purple', color: '#9333ea' };
            if (d < 360) return { name: '优角', tone: 'rose', color: '#e11d48' };
            return { name: '周角', tone: 'rose', color: '#e11d48' };
        };

        // —— 场景 1：自由角（顶点和两条边都能拖）
        const FreeAngle = () => {
            const W = 600, H = 420;
            const svgRef = useRef(null);
            const toPt = useSvgPoint(svgRef, W, H);
            const { drag, start, stop } = useDragger(toPt);
            const [o, setO] = useState([300, 290]);
            const [pa, setPA] = useState([470, 290]);           // 边 OA 的端点
            const [pb, setPB] = useState([420, 165]);           // 边 OB 的端点
            const [showRight, setShowRight] = useState(true);
            const [reflex, setReflex] = useState(false);        // 看外面那个角

            const onMove = (e) => {
                if (!drag.current) return;
                e.preventDefault();
                const raw = add(toPt(e), drag.current.off);
                const fit = [clamp(raw[0], 30, W - 30), clamp(raw[1], 30, H - 30)];
                if (drag.current.id === 'o') {                   // 顶点走，两条边跟着走
                    const d = sub(fit, o);
                    setO(fit); setPA(add(pa, d)); setPB(add(pb, d));
                } else (drag.current.id === 'a' ? setPA : setPB)(fit);
            };

            const degA = dirToDeg(pa[0] - o[0], pa[1] - o[1]);
            const degB = dirToDeg(pb[0] - o[0], pb[1] - o[1]);
            const inner = angleBetween(degA, degB);
            const shown = reflex ? 360 - inner : inner;
            const info = angleKind(shown);
            // 内角这一侧：从 A 到 B 走短的那边
            const ccw = norm360(degB - degA) < 180;
            const from = reflex ? (ccw ? degB : degA) : (ccw ? degA : degB);
            const to = reflex ? (ccw ? degA : degB) : (ccw ? degB : degA);
            const lenA = dist(o, pa), lenB = dist(o, pb);
            const arcR = clamp(Math.min(lenA, lenB) * 0.42, 30, 78);
            const midDeg = from + norm360(to - from) / 2;

            const setDeg = (d) => {                              // 保持 OA 不动，把 OB 摆到指定度数
                setPB(along(o, degA + d, Math.max(120, lenB)));
                setReflex(d > 180);
            };
            const scaleArm = (k) => setPB(along(o, degB, clamp(lenB * k, 45, 260)));

            return (
                <div className="space-y-4">
                    <Card>
                        <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} className="geo-svg w-full"
                            onMouseMove={onMove} onMouseUp={stop} onMouseLeave={stop}
                            onTouchMove={onMove} onTouchEnd={stop}>
                            <GridBg W={W} H={H} />

                            {/* 直角参照：从 OA 边转 90° 的那条线 */}
                            {showRight && (
                                <g opacity="0.9">
                                    <line x1={o[0]} y1={o[1]} x2={along(o, degA + (ccw ? 90 : -90), 190)[0]} y2={along(o, degA + (ccw ? 90 : -90), 190)[1]}
                                        stroke="#93c5fd" strokeWidth="2.5" strokeDasharray="7 6" />
                                    <text x={along(o, degA + (ccw ? 90 : -90), 205)[0]} y={along(o, degA + (ccw ? 90 : -90), 205)[1]}
                                        textAnchor="middle" className="text-xs font-bold" fill="#3b82f6">直角 90°</text>
                                </g>
                            )}

                            {/* 角的内部涂色 */}
                            {shown >= 359.5
                                ? <circle cx={o[0]} cy={o[1]} r={arcR + 40} fill={info.color} opacity="0.1" />
                                : <path d={wedgePath(o[0], o[1], Math.max(60, Math.min(lenA, lenB)), from, to)} fill={info.color} opacity="0.12" />}

                            <path d={arcPath(o[0], o[1], arcR, from, to)} fill="none" stroke={info.color} strokeWidth="3.5" />
                            {Math.round(shown) === 90 && <RightAngleMark v={o} a={from} b={to} size={20} color={info.color} />}

                            <line x1={o[0]} y1={o[1]} x2={pa[0]} y2={pa[1]} stroke="#475569" strokeWidth="5" strokeLinecap="round" />
                            <line x1={o[0]} y1={o[1]} x2={pb[0]} y2={pb[1]} stroke={info.color} strokeWidth="5" strokeLinecap="round" />

                            <text x={along(o, midDeg, arcR + 30)[0]} y={along(o, midDeg, arcR + 30)[1] + 6}
                                textAnchor="middle" className="text-xl font-bold" fill={info.color}>{round1(shown)}°</text>

                            <circle cx={o[0]} cy={o[1]} r="7" fill="#1e293b" />
                            <text x={o[0] - 14} y={o[1] + 26} className="text-sm font-bold" fill="#1e293b">O</text>
                            <Handle p={o} color="#1e293b" r={10} onDown={start('o', o)} />
                            <Handle p={pa} color="#475569" label="A" onDown={start('a', pa)} />
                            <Handle p={pb} color={info.color} label="B" onDown={start('b', pb)} />
                        </svg>
                        <p className="text-center text-slate-500 mt-2 text-sm">
                            拖 <span className="font-bold">A、B</span> 张合，拖 <span className="font-bold">顶点 O</span> 整个角搬家
                        </p>
                    </Card>

                    <Verdict tone={info.tone}>∠AOB = {round1(shown)}°，是{info.name}</Verdict>

                    <Card>
                        <div className="text-sm text-slate-600 leading-relaxed text-center">
                            这个角记作 <span className="font-bold text-slate-800">∠AOB</span>（顶点 O 写在中间），
                            也可以记作 <span className="font-bold text-slate-800">∠O</span> 或 <span className="font-bold text-slate-800">∠1</span>。
                            它由<span className="font-bold">一个顶点</span>和<span className="font-bold">两条边</span>组成。
                        </div>
                        <div className="flex justify-center gap-2 flex-wrap mt-4">
                            {[30, 45, 60, 90, 120, 135, 180, 270].map((d) => (
                                <button key={d} onClick={() => setDeg(d)}
                                    className="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 text-sm font-bold hover:bg-slate-200 smooth-transition">{d}°</button>
                            ))}
                        </div>
                        <div className="flex justify-center gap-2 flex-wrap mt-3">
                            <Btn tone="dark" onClick={() => scaleArm(1.35)}>把边拉长</Btn>
                            <Btn tone="dark" onClick={() => scaleArm(0.72)}>把边缩短</Btn>
                            <Btn onClick={() => setShowRight(!showRight)} active={showRight}>直角参照线 {showRight ? '开' : '关'}</Btn>
                            <Btn onClick={() => setReflex(!reflex)} active={reflex}>{reflex ? '看里面的角' : '看外面的角'}</Btn>
                        </div>
                        <p className="text-center text-sm text-slate-500 mt-3">
                            把边拉长或缩短，度数<span className="font-bold text-slate-700">一点没变</span> —— 角的大小只看两条边张开的程度，和边画多长无关。
                        </p>
                    </Card>
                </div>
            );
        };

        // —— 场景 2：角的家族（分类 + 换算关系）
        const AngleFamily = () => {
            const [deg, setDeg] = useState(60);
            const info = angleKind(deg);
            const W = 560, H = 300;
            const o = [W / 2, H - 60], R = 175;

            const FAMILY = [
                { name: '锐角', rule: '小于 90°', color: '#059669', demo: 45, test: (d) => d > 0 && d < 90 },
                { name: '直角', rule: '正好 90°', color: '#2563eb', demo: 90, test: (d) => Math.round(d) === 90 },
                { name: '钝角', rule: '大于 90°、小于 180°', color: '#ea580c', demo: 130, test: (d) => d > 90 && d < 180 },
                { name: '平角', rule: '正好 180°，两条边成一条直线', color: '#9333ea', demo: 180, test: (d) => Math.round(d) === 180 },
                { name: '周角', rule: '正好 360°，转满一圈', color: '#e11d48', demo: 360, test: (d) => Math.round(d) === 360 },
            ];

            const mini = (d, color) => (
                <svg viewBox="0 0 100 70" className="w-full">
                    {d >= 360
                        ? <circle cx="50" cy="52" r="26" fill={color} opacity="0.18" />
                        : <path d={wedgePath(50, 52, 30, 0, d)} fill={color} opacity="0.2" />}
                    <line x1="50" y1="52" x2="88" y2="52" stroke={color} strokeWidth="3" strokeLinecap="round" />
                    <line x1="50" y1="52" x2={along([50, 52], d, 38)[0]} y2={along([50, 52], d, 38)[1]}
                        stroke={color} strokeWidth="3" strokeLinecap="round" />
                    <circle cx="50" cy="52" r="3.5" fill={color} />
                </svg>
            );

            return (
                <div className="space-y-4">
                    <Card>
                        <svg viewBox={`0 0 ${W} ${H}`} className="geo-svg w-full">
                            <GridBg W={W} H={H} />
                            {/* 90 / 180 / 270 的参照刻度 */}
                            {[90, 180, 270].map((d) => (
                                <line key={d} x1={o[0]} y1={o[1]} x2={along(o, d, R + 14)[0]} y2={along(o, d, R + 14)[1]}
                                    stroke="#cbd5e1" strokeWidth="2" strokeDasharray="5 6" />
                            ))}
                            {deg >= 359.5
                                ? <circle cx={o[0]} cy={o[1]} r={R} fill={info.color} opacity="0.13" />
                                : <path d={wedgePath(o[0], o[1], R, 0, deg)} fill={info.color} opacity="0.13" />}
                            <path d={arcPath(o[0], o[1], 54, 0, Math.min(deg, 359.5))} fill="none" stroke={info.color} strokeWidth="3.5" />
                            <line x1={o[0]} y1={o[1]} x2={o[0] + R} y2={o[1]} stroke="#475569" strokeWidth="5" strokeLinecap="round" />
                            <line x1={o[0]} y1={o[1]} x2={along(o, deg, R)[0]} y2={along(o, deg, R)[1]}
                                stroke={info.color} strokeWidth="5" strokeLinecap="round" />
                            {Math.round(deg) === 90 && <RightAngleMark v={o} a={0} b={90} size={22} color={info.color} />}
                            <circle cx={o[0]} cy={o[1]} r="7" fill="#1e293b" />
                            <text x={along(o, deg / 2, 92)[0]} y={along(o, deg / 2, 92)[1] + 6} textAnchor="middle"
                                className="text-xl font-bold" fill={info.color}>{deg}°</text>
                        </svg>
                        <div className="flex items-center gap-3 mt-3">
                            <span className="text-sm font-bold text-slate-500 shrink-0">0°</span>
                            <input type="range" min="0" max="360" value={deg} onChange={(e) => setDeg(+e.target.value)} className="flex-1" />
                            <span className="text-sm font-bold text-slate-500 shrink-0">360°</span>
                        </div>
                        <p className="text-center text-slate-500 text-sm mt-1">慢慢拉滑块，看角一路从锐角变到周角</p>
                    </Card>

                    <Verdict tone={info.tone}>{deg}° —— {info.name}</Verdict>

                    <div className="grid grid-cols-5 gap-2">
                        {FAMILY.map((f) => {
                            const on = f.test(deg);
                            return (
                                <button key={f.name} onClick={() => setDeg(f.demo)}
                                    className={"rounded-xl border-2 p-2 smooth-transition bg-white " + (on ? "shadow" : "opacity-60 border-transparent")}
                                    style={on ? { borderColor: f.color } : {}}>
                                    {mini(f.demo, f.color)}
                                    <div className="font-bold text-sm mt-1" style={{ color: f.color }}>{f.name}</div>
                                    <div className="text-[11px] text-slate-500 leading-tight mt-0.5">{f.rule}</div>
                                </button>
                            );
                        })}
                    </div>

                    <Card>
                        <div className="text-center font-bold text-slate-700 mb-3">记住这三条关系</div>
                        <div className="grid grid-cols-3 gap-3 text-center">
                            {[['1 平角 = 2 直角', '180° = 90° × 2', '#9333ea'],
                              ['1 周角 = 2 平角', '360° = 180° × 2', '#e11d48'],
                              ['1 周角 = 4 直角', '360° = 90° × 4', '#e11d48']].map(([t, s, c]) => (
                                <div key={t} className="rounded-xl bg-slate-50 py-3">
                                    <div className="font-bold text-sm" style={{ color: c }}>{t}</div>
                                    <div className="text-xs text-slate-500 mt-1">{s}</div>
                                </div>
                            ))}
                        </div>
                    </Card>

                    <BookNote title="容易错的地方">
                        平角是一个<span className="font-bold">角</span>，不是一条直线：它有顶点，两条边正好在一条直线上、方向相反。
                        周角的两条边则完全重合。
                    </BookNote>
                </div>
            );
        };

        const AngleIntro = () => {
            const [mode, setMode] = useState('free');
            return (
                <div className="fade-in space-y-4">
                    <SubTabs items={[['free', '自由张合'], ['family', '角的家族']]} value={mode} onChange={setMode} />
                    {mode === 'free' ? <FreeAngle /> : <AngleFamily />}
                </div>
            );
        };

        // ===========================================================
        // 模块三：量角器 —— 量角 / 画角（教材标准操作）
        // ===========================================================
        const angDiff = (a, b) => Math.abs(norm360(a - b + 180) - 180);   // 两个方向的最小夹角 0~180

        // 半圆量角器：在本地坐标里按 0° 朝右画好，再整体旋转 rot
        const ProtractorShape = ({ c, rot, R, onBodyDown, faded }) => {
            const ticks = [], labels = [];
            for (let t = 0; t <= 180; t++) {
                const big = t % 10 === 0, mid = t % 5 === 0;
                const len = big ? 17 : mid ? 11 : 6;
                const p1 = along(c, t, R - 2), p2 = along(c, t, R - 2 - len);
                ticks.push(<line key={'t' + t} x1={p1[0]} y1={p1[1]} x2={p2[0]} y2={p2[1]}
                    stroke={big ? "#0f766e" : "#14b8a6"} strokeWidth={big ? 1.9 : 1} opacity={big ? 0.95 : 0.65} />);
            }
            // 两圈数字分开放：外圈贴着刻度，内圈往里缩一截。
            // 三位数（100 以上）比两位数占地方，再往里让一点，两端才不会挤成一坨。
            for (let t = 0; t <= 180; t += 10) {
                const wideOut = 180 - t >= 100, wideIn = t >= 100;
                const po = along(c, t, R - (wideOut ? 34 : 30));
                const pi = along(c, t, R - (wideIn ? 57 : 53));
                labels.push(
                    <text key={'o' + t} x={po[0]} y={po[1]} textAnchor="middle" dominantBaseline="middle"
                        transform={`rotate(${90 - t} ${po[0]} ${po[1]})`}
                        fontSize="11.5" fontWeight="bold" fill="#0f766e">{180 - t}</text>);
                labels.push(
                    <text key={'i' + t} x={pi[0]} y={pi[1]} textAnchor="middle" dominantBaseline="middle"
                        transform={`rotate(${90 - t} ${pi[0]} ${pi[1]})`}
                        fontSize="11.5" fontWeight="bold" fill="#7c3aed">{t}</text>);
            }
            const p0 = along(c, 0, R), p180 = along(c, 180, R);
            const body = `M ${p0[0]} ${p0[1]} A ${R} ${R} 0 0 0 ${p180[0]} ${p180[1]} Z`;
            return (
                <g transform={`rotate(${-rot} ${c[0]} ${c[1]})`} opacity={faded ? 0.55 : 1}>
                    <path d={body} fill="#5eead4" fillOpacity="0.17" stroke="#0d9488" strokeWidth="2.5"
                        className={onBodyDown ? "move" : ""} onMouseDown={onBodyDown} onTouchStart={onBodyDown} />
                    {ticks}{labels}
                    {/* 0 刻度线（量角器底边）*/}
                    <line x1={p180[0]} y1={p180[1]} x2={p0[0]} y2={p0[1]} stroke="#dc2626" strokeWidth="3" />
                    {/* 中心 + 中心竖线 */}
                    <line x1={c[0]} y1={c[1]} x2={along(c, 90, R - 2)[0]} y2={along(c, 90, R - 2)[1]}
                        stroke="#dc2626" strokeWidth="1.4" strokeDasharray="5 5" opacity="0.7" />
                    <circle cx={c[0]} cy={c[1]} r="6" fill="none" stroke="#dc2626" strokeWidth="2.5" />
                    <line x1={c[0] - 13} y1={c[1]} x2={c[0] + 13} y2={c[1]} stroke="#dc2626" strokeWidth="2" />
                    <text x={c[0]} y={c[1] + 26} textAnchor="middle" fontSize="11" fontWeight="bold" fill="#dc2626">中心</text>
                    {/* 圈名放到数字里侧，别压着 0 刻度线 */}
                    <text x={along(c, 26, R - 92)[0]} y={along(c, 26, R - 92)[1]} textAnchor="middle" fontSize="10"
                        fontWeight="bold" fill="#7c3aed" opacity="0.85">内圈</text>
                    <text x={along(c, 154, R - 92)[0]} y={along(c, 154, R - 92)[1]} textAnchor="middle" fontSize="10"
                        fontWeight="bold" fill="#0f766e" opacity="0.85">外圈</text>
                </g>
            );
        };

        // —— 场景 1：用量角器量角
        const MeasureAngle = () => {
            const W = 700, H = 470, R = 200;
            const svgRef = useRef(null);
            const toPt = useSvgPoint(svgRef, W, H);
            const { drag, start, stop } = useDragger(toPt);
            const [v, setV] = useState([380, 380]);
            const [pa, setPA] = useState([600, 380]);
            const [pb, setPB] = useState([510, 240]);
            const [pc, setPC] = useState([215, 250]);            // 量角器中心：一开始搁在旁边
            const [rot, setRot] = useState(0);

            const onMove = (e) => {
                if (!drag.current) return;
                e.preventDefault();
                const raw = add(toPt(e), drag.current.off);
                const id = drag.current.id;
                if (id === 'rot') { setRot(round1(dirToDeg(raw[0] - pc[0], raw[1] - pc[1]) - 90)); return; }
                const fit = [clamp(raw[0], 20, W - 20), clamp(raw[1], 20, H - 20)];
                if (id === 'v') { const d = sub(fit, v); setV(fit); setPA(add(pa, d)); setPB(add(pb, d)); }
                else if (id === 'a') setPA(fit);
                else if (id === 'b') setPB(fit);
                else if (id === 'pc') setPC(fit);
            };

            const degA = dirToDeg(pa[0] - v[0], pa[1] - v[1]);
            const degB = dirToDeg(pb[0] - v[0], pb[1] - v[1]);
            const truth = angleBetween(degA, degB);

            const TOL = 4;
            const centerOK = dist(pc, v) <= 15;
            const cands = [
                { arm: 'A', deg: degA, other: degB, end: 'in', err: angDiff(degA, rot) },
                { arm: 'A', deg: degA, other: degB, end: 'out', err: angDiff(degA, rot + 180) },
                { arm: 'B', deg: degB, other: degA, end: 'in', err: angDiff(degB, rot) },
                { arm: 'B', deg: degB, other: degA, end: 'out', err: angDiff(degB, rot + 180) },
            ].sort((x, y) => x.err - y.err);
            const best = cands[0];
            const baseOK = best.err <= TOL;
            const tOther = norm360(best.other - rot);
            const inDome = tOther <= 181;
            const readInner = Math.round(tOther > 180 ? 360 - tOther : tOther);
            const readOuter = 180 - readInner;
            const useInner = best.end === 'in';
            const reading = useInner ? readInner : readOuter;
            const allOK = centerOK && baseOK && inDome;

            const autoFit = () => {
                setPC([...v]);
                setRot(norm360(degB - degA) <= 180 ? degA : degB);
            };
            const shuffle = () => {
                const d = 20 + Math.floor(Math.random() * 140);
                const base = Math.floor(Math.random() * 60) - 30;
                setPA(along(v, base, 215)); setPB(along(v, base + d, 180));
                setPC([215, 250]); setRot(0);
            };

            const handleRot = along(pc, rot + 90, R + 30);

            return (
                <div className="space-y-4">
                    <Card>
                        <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} className="geo-svg w-full"
                            onMouseMove={onMove} onMouseUp={stop} onMouseLeave={stop}
                            onTouchMove={onMove} onTouchEnd={stop}>
                            <GridBg W={W} H={H} />

                            {/* 要量的角 */}
                            <path d={wedgePath(v[0], v[1], 70, norm360(degB - degA) < 180 ? degA : degB,
                                norm360(degB - degA) < 180 ? degB : degA)} fill="#f97316" opacity="0.13" />
                            <line x1={v[0]} y1={v[1]} x2={pa[0]} y2={pa[1]} stroke="#ea580c" strokeWidth="5" strokeLinecap="round" />
                            <line x1={v[0]} y1={v[1]} x2={pb[0]} y2={pb[1]} stroke="#ea580c" strokeWidth="5" strokeLinecap="round" />
                            <circle cx={v[0]} cy={v[1]} r="6" fill="#7c2d12" />

                            <ProtractorShape c={pc} rot={rot} R={R} onBodyDown={start('pc', pc)} faded={!allOK} />

                            {/* 对准了就把读数标在另一条边上 */}
                            {allOK && (() => {
                                // 读数标在量角器外面，不压刻度数字
                                const lab = along(v, rot + tOther / 2, R + 42);
                                return (
                                    <g className="fade-in">
                                        <path d={arcPath(v[0], v[1], 92, rot, rot + tOther)} fill="none"
                                            stroke="#dc2626" strokeWidth="3.5" />
                                        <rect x={lab[0] - 34} y={lab[1] - 19} width="68" height="34" rx="10"
                                            fill="#fff" stroke="#dc2626" strokeWidth="2" />
                                        <text x={lab[0]} y={lab[1] + 7} textAnchor="middle"
                                            className="text-xl font-bold" fill="#dc2626">{reading}°</text>
                                    </g>
                                );
                            })()}

                            <Handle p={pc} color="#0d9488" r={9} onDown={start('pc', pc)} />
                            <Handle p={handleRot} color="#0d9488" r={11} label="转" onDown={start('rot')} />
                            <Handle p={v} color="#7c2d12" r={10} label="顶点" labelDy={-2} onDown={start('v', v)} />
                            <Handle p={pa} color="#ea580c" label="A" onDown={start('a', pa)} />
                            <Handle p={pb} color="#ea580c" label="B" onDown={start('b', pb)} />
                        </svg>
                        <p className="text-center text-slate-500 mt-2 text-sm">
                            拖量角器<span className="font-bold">中心</span>去对顶点，拖<span className="font-bold">「转」</span>把 0 刻度线压到一条边上
                        </p>
                    </Card>

                    <Verdict tone={allOK ? 'emerald' : 'slate'}>
                        {allOK ? `∠AOB = ${reading}°（${angleKind(reading).name}）` : '还没对准，先照着下面三步做'}
                    </Verdict>

                    <Card>
                        <div className="space-y-2">
                            <StepRow ok={centerOK}>① 量角器的<span className="font-bold">中心</span>对准角的<span className="font-bold">顶点</span></StepRow>
                            <StepRow ok={baseOK}>② <span className="font-bold">0 刻度线</span>（红色底边）对准角的<span className="font-bold">一条边</span></StepRow>
                            <StepRow ok={allOK}>③ 另一条边落在刻度上，就读出度数</StepRow>
                        </div>
                        {baseOK && !inDome && (
                            <div className="mt-3 rounded-lg bg-rose-50 border border-rose-200 px-3 py-2 text-sm text-rose-600 font-bold text-center">
                                另一条边跑到量角器外面去了，把量角器转过来（翻个面）再看
                            </div>
                        )}
                        {allOK && (
                            <div className="mt-3 grid grid-cols-2 gap-3">
                                {[['内圈读数', readInner, useInner, '#7c3aed'], ['外圈读数', readOuter, !useInner, '#0f766e']].map(([n, val, ok, col]) => (
                                    <div key={n} className={"rounded-xl border-2 p-3 text-center smooth-transition " + (ok ? "bg-white shadow" : "bg-slate-50 opacity-60")}
                                        style={ok ? { borderColor: col } : { borderColor: 'transparent' }}>
                                        <div className="text-xs font-bold" style={{ color: col }}>{n}</div>
                                        <div className="text-2xl font-bold mt-1" style={{ color: ok ? col : '#94a3b8' }}>{val}°</div>
                                        <div className="text-xs mt-1 font-bold" style={{ color: ok ? '#059669' : '#94a3b8' }}>{ok ? '✓ 该读这一圈' : '不是这一圈'}</div>
                                    </div>
                                ))}
                            </div>
                        )}
                        {allOK && (
                            <p className="text-center text-sm text-slate-500 mt-3">
                                角的一条边压在<span className="font-bold" style={{ color: useInner ? '#7c3aed' : '#0f766e' }}>{useInner ? '内圈' : '外圈'}</span>的
                                <span className="font-bold"> 0 </span>上，就从<span className="font-bold">{useInner ? '内圈' : '外圈'}</span>往下读。
                            </p>
                        )}
                        <div className="flex justify-center gap-2 flex-wrap mt-4">
                            <Btn tone="cyan" onClick={autoFit}>一键对准</Btn>
                            <Btn tone="dark" onClick={shuffle}>换一个角</Btn>
                            <Btn onClick={() => { setPC([215, 250]); setRot(0); }}>把量角器拿开</Btn>
                        </div>
                    </Card>

                    <BookNote title="量角三步">
                        <span className="font-bold">中心对顶点，0 线对一边，再看另一边</span>。
                        内圈外圈都有数，看角的一条边压在哪一圈的 0 上，就读哪一圈。
                        真实答案是 {Math.round(truth)}°，量出来对上了吗？
                    </BookNote>
                </div>
            );
        };

        // —— 场景 2：用量角器画角
        const DrawAngle = () => {
            const W = 700, H = 470, R = 200;
            const svgRef = useRef(null);
            const toPt = useSvgPoint(svgRef, W, H);
            const { drag, start, stop } = useDragger(toPt);
            const v = [250, 355];
            const [target, setTarget] = useState(60);
            const [step, setStep] = useState(0);                 // 0 画射线 1 放量角器 2 点刻度 3 连线
            const [mark, setMark] = useState(null);              // 已点好的刻度（度）
            const [hover, setHover] = useState(150);             // 起手先停在别的刻度上，得自己拖过去

            const reset = (t) => { setTarget(t); setStep(0); setMark(null); setHover(t > 90 ? 30 : 145); };

            const onMove = (e) => {
                if (!drag.current || step !== 2) return;
                e.preventDefault();
                const p = toPt(e);
                const d = clamp(dirToDeg(p[0] - v[0], p[1] - v[1]), 0, 180);
                setHover(Math.abs(d - target) <= 2.5 ? target : round1(d));
            };

            const snapped = Math.abs(hover - target) < 0.01;
            const markDeg = mark != null ? mark : hover;
            const armEnd = along(v, 0, 300);

            return (
                <div className="space-y-4">
                    <Card>
                        <div className="flex justify-center gap-2 flex-wrap mb-3">
                            {[30, 45, 60, 90, 120, 135, 150].map((t) => (
                                <button key={t} onClick={() => reset(t)}
                                    className={"px-3 py-1.5 rounded-lg text-sm font-bold smooth-transition " +
                                        (target === t ? "bg-violet-500 text-white shadow" : "bg-slate-100 text-slate-600 hover:bg-slate-200")}>
                                    画 {t}°
                                </button>
                            ))}
                        </div>

                        <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} className="geo-svg w-full"
                            onMouseMove={onMove} onMouseUp={stop} onMouseLeave={stop}
                            onTouchMove={onMove} onTouchEnd={stop}>
                            <GridBg W={W} H={H} />

                            {step >= 1 && <ProtractorShape c={v} rot={0} R={R} faded={step >= 3} />}

                            {/* 第一步：一条射线，顶点就是端点 */}
                            {step >= 1 && (
                                <g>
                                    <line x1={v[0]} y1={v[1]} x2={armEnd[0]} y2={armEnd[1]} stroke="#1e293b" strokeWidth="5" strokeLinecap="round" />
                                    <circle cx={v[0]} cy={v[1]} r="7" fill="#1e293b" />
                                    <text x={v[0] - 26} y={v[1] + 26} className="text-sm font-bold" fill="#1e293b">O</text>
                                </g>
                            )}
                            {step === 0 && (
                                <g className="pulse-ok">
                                    <line x1={v[0]} y1={v[1]} x2={armEnd[0]} y2={armEnd[1]} stroke="#94a3b8" strokeWidth="5"
                                        strokeLinecap="round" strokeDasharray="12 9" />
                                    <circle cx={v[0]} cy={v[1]} r="7" fill="#94a3b8" />
                                </g>
                            )}

                            {/* 第三步：在刻度上点一个点 */}
                            {step === 2 && (
                                <g>
                                    <line x1={v[0]} y1={v[1]} x2={along(v, markDeg, R + 8)[0]} y2={along(v, markDeg, R + 8)[1]}
                                        stroke={snapped ? "#059669" : "#94a3b8"} strokeWidth="2" strokeDasharray="6 6" />
                                    <circle cx={along(v, markDeg, R - 12)[0]} cy={along(v, markDeg, R - 12)[1]} r="7"
                                        fill={snapped ? "#059669" : "#f97316"} />
                                    <text x={along(v, markDeg, R + 34)[0]} y={along(v, markDeg, R + 34)[1] + 5} textAnchor="middle"
                                        className="text-lg font-bold" fill={snapped ? "#059669" : "#f97316"}>{round1(markDeg)}°</text>
                                    <Handle p={along(v, markDeg, R - 12)} color={snapped ? "#059669" : "#f97316"} r={12}
                                        onDown={start('mark')} />
                                </g>
                            )}

                            {/* 第四步：连线成角 */}
                            {step >= 3 && mark != null && (
                                <g className="fade-in">
                                    <path d={wedgePath(v[0], v[1], 86, 0, mark)} fill="#059669" opacity="0.15" />
                                    <path d={arcPath(v[0], v[1], 86, 0, mark)} fill="none" stroke="#059669" strokeWidth="3.5" />
                                    <line x1={v[0]} y1={v[1]} x2={along(v, mark, 260)[0]} y2={along(v, mark, 260)[1]}
                                        stroke="#059669" strokeWidth="5" strokeLinecap="round" />
                                    {mark === 90 && <RightAngleMark v={v} a={0} b={90} size={24} color="#059669" />}
                                    <text x={along(v, mark / 2, 118)[0]} y={along(v, mark / 2, 118)[1] + 6} textAnchor="middle"
                                        className="text-2xl font-bold" fill="#059669">{mark}°</text>
                                </g>
                            )}
                        </svg>
                    </Card>

                    <Card>
                        <div className="space-y-2">
                            <StepRow ok={step >= 1}>① 先画一条<span className="font-bold">射线</span>，端点就是角的顶点</StepRow>
                            <StepRow ok={step >= 2}>② 量角器<span className="font-bold">中心对端点</span>，<span className="font-bold">0 刻度线对射线</span></StepRow>
                            <StepRow ok={step >= 3}>③ 在 <span className="font-bold">{target}°</span> 的刻度线处点一个点</StepRow>
                            <StepRow ok={step >= 3 && mark === target}>④ 把顶点和这个点<span className="font-bold">连成射线</span></StepRow>
                        </div>

                        <div className="flex justify-center gap-2 flex-wrap mt-4">
                            {step === 0 && <Btn tone="dark" onClick={() => setStep(1)}>① 画出射线</Btn>}
                            {step === 1 && <Btn tone="cyan" onClick={() => setStep(2)}>② 放好量角器</Btn>}
                            {step === 2 && <Btn tone="emerald" disabled={!snapped} onClick={() => { setMark(target); setStep(3); }}>
                                {snapped ? '④ 连成射线' : `③ 把点拖到 ${target}° 处`}</Btn>}
                            {step >= 3 && <Btn tone="violet" onClick={() => reset(target)}>再画一次</Btn>}
                            {step > 0 && step < 3 && <Btn onClick={() => reset(target)}>重来</Btn>}
                        </div>
                        {step === 2 && (
                            <p className="text-center text-sm text-slate-500 mt-3">
                                拖动橙色小点沿刻度走，正好到 <span className="font-bold text-violet-600">{target}°</span> 时它会变绿吸住。
                                注意读<span className="font-bold text-violet-600">内圈</span>（射线压在内圈的 0 上）。
                            </p>
                        )}
                        {step >= 3 && (
                            <p className="text-center text-base font-bold text-emerald-600 mt-3">✓ 画好了：∠AOB = {target}°</p>
                        )}
                    </Card>

                    <BookNote title="画角三步">
                        <span className="font-bold">画射线 → 中心对端点、0 线对射线 → 找到度数点上点 → 连线</span>。
                        画完别忘了写上度数，再用量角器量一量检查。
                    </BookNote>
                </div>
            );
        };

        const ProtractorTool = () => {
            const [mode, setMode] = useState('measure');
            return (
                <div className="fade-in space-y-4">
                    <SubTabs items={[['measure', '量角'], ['draw', '画角']]} value={mode} onChange={setMode} />
                    {mode === 'measure' ? <MeasureAngle /> : <DrawAngle />}
                </div>
            );
        };

        // ===========================================================
        // 模块四：比一比 —— 两个角叠一叠，看谁大
        // ===========================================================
        const CompareAngles = () => {
            const W = 600, H = 400;
            const svgRef = useRef(null);
            const toPt = useSvgPoint(svgRef, W, H);
            const { drag, start, stop } = useDragger(toPt);
            const [d1, setD1] = useState(40);
            const [d2, setD2] = useState(65);
            const [L1, setL1] = useState(155);
            const [L2, setL2] = useState(100);
            const [overlap, setOverlap] = useState(false);       // 叠一叠：顶点对顶点、一边对一边

            const v1 = overlap ? [W / 2 - 60, H - 90] : [W * 0.27, H - 90];
            const v2 = overlap ? [W / 2 - 60, H - 90] : [W * 0.73, H - 90];

            const onMove = (e) => {
                if (!drag.current) return;
                e.preventDefault();
                const p = toPt(e);
                const id = drag.current.id;
                const v = id === 1 ? v1 : v2;
                const d = clamp(dirToDeg(p[0] - v[0], p[1] - v[1]), 0, 180);
                const len = clamp(dist(p, v), 60, 230);
                if (id === 1) { setD1(d); setL1(len); } else { setD2(d); setL2(len); }
            };

            const bigger = Math.round(d1) === Math.round(d2) ? 0 : (d1 > d2 ? 1 : 2);
            const C1 = '#2563eb', C2 = '#ea580c';
            const armEnd = (v, len, deg) => along(v, deg, len);

            const drawAngle = (v, len, deg, color, key) => (
                <g key={key}>
                    <path d={wedgePath(v[0], v[1], len, 0, deg)} fill={color} opacity="0.14" />
                    <line x1={v[0]} y1={v[1]} x2={v[0] + len} y2={v[1]} stroke={color} strokeWidth="4.5" strokeLinecap="round" />
                    <line x1={v[0]} y1={v[1]} x2={armEnd(v, len, deg)[0]} y2={armEnd(v, len, deg)[1]}
                        stroke={color} strokeWidth="4.5" strokeLinecap="round" />
                    <path d={arcPath(v[0], v[1], Math.min(42, len * 0.42), 0, deg)} fill="none" stroke={color} strokeWidth="3" />
                    <circle cx={v[0]} cy={v[1]} r="6" fill={color} />
                </g>
            );

            return (
                <div className="fade-in space-y-4">
                    <Card>
                        <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} className="geo-svg w-full"
                            onMouseMove={onMove} onMouseUp={stop} onMouseLeave={stop}
                            onTouchMove={onMove} onTouchEnd={stop}>
                            <GridBg W={W} H={H} />

                            {/* 叠在一起时先画大的，小的压在上面才看得清 */}
                            {(d1 >= d2 ? [[v1, L1, d1, C1, 'a'], [v2, L2, d2, C2, 'b']]
                                       : [[v2, L2, d2, C2, 'b'], [v1, L1, d1, C1, 'a']])
                                .map(([v, l, d, c, k]) => drawAngle(v, l, d, c, k))}

                            {overlap && bigger !== 0 && (
                                <path d={arcPath(v1[0], v1[1], 200, Math.min(d1, d2), Math.max(d1, d2))}
                                    fill="none" stroke="#0f172a" strokeWidth="3" strokeDasharray="6 6" />
                            )}
                            {overlap && bigger !== 0 && (
                                <text x={along(v1, (d1 + d2) / 2, 226)[0]} y={along(v1, (d1 + d2) / 2, 226)[1] + 5}
                                    textAnchor="middle" className="text-sm font-bold" fill="#0f172a">
                                    差 {round1(Math.abs(d1 - d2))}°
                                </text>
                            )}

                            <Handle p={armEnd(v1, L1, d1)} color={C1} label="①" onDown={start(1)} />
                            <Handle p={armEnd(v2, L2, d2)} color={C2} label="②" onDown={start(2)} />

                            <text x={overlap ? 40 : v1[0]} y={30} textAnchor={overlap ? 'start' : 'middle'}
                                className="text-lg font-bold" fill={C1}>① {round1(d1)}°（边长 {cm(L1)}cm）</text>
                            <text x={overlap ? W - 40 : v2[0]} y={overlap ? 56 : 30} textAnchor={overlap ? 'end' : 'middle'}
                                className="text-lg font-bold" fill={C2}>② {round1(d2)}°（边长 {cm(L2)}cm）</text>
                        </svg>
                        <p className="text-center text-slate-500 mt-2 text-sm">
                            拖把手：<span className="font-bold">绕着转</span>改角度，<span className="font-bold">往外拉</span>改边长
                        </p>
                    </Card>

                    <div className="flex justify-center gap-2 flex-wrap">
                        <Btn tone={overlap ? 'dark' : 'blue'} onClick={() => setOverlap(!overlap)}>
                            {overlap ? '← 分开摆' : '叠一叠 →'}
                        </Btn>
                        <Btn onClick={() => { setD1(40); setL1(155); setD2(65); setL2(100); }}>复位</Btn>
                        <Btn onClick={() => { setD1(50); setL1(230); setD2(70); setL2(70); }}>看个反例（边长很唬人）</Btn>
                    </div>

                    <Verdict tone={bigger === 0 ? 'slate' : (bigger === 1 ? 'blue' : 'orange')}>
                        {bigger === 0 ? '① = ② 一样大' : (bigger === 1 ? `① 比 ② 大 ${round1(d1 - d2)}°` : `② 比 ① 大 ${round1(d2 - d1)}°`)}
                    </Verdict>

                    <BookNote title="比角的办法">
                        ① 用眼睛看张口大小；② <span className="font-bold">叠一叠</span>：顶点对顶点、一条边对一条边，看另一条边落在里面还是外面；
                        ③ 用<span className="font-bold">量角器</span>各量一次，比数。边画得长，角不会变大。
                    </BookNote>
                </div>
            );
        };

        // ===========================================================
        // 模块五：拼角 —— 一副三角尺能拼出哪些角
        // ===========================================================
        const PIECES = [
            { deg: 30, color: '#0ea5e9' },
            { deg: 45, color: '#8b5cf6' },
            { deg: 60, color: '#f59e0b' },
            { deg: 90, color: '#2563eb' },
        ];
        const RULER_COMBOS = [
            { list: [30, 45], sum: 75 }, { list: [30, 60], sum: 90 }, { list: [60, 45], sum: 105 },
            { list: [90, 30], sum: 120 }, { list: [90, 45], sum: 135 }, { list: [90, 60], sum: 150 },
            { list: [90, 90], sum: 180 },
        ];

        const BuildAngle = () => {
            const W = 600, H = 400;
            const svgRef = useRef(null);
            const toPt = useSvgPoint(svgRef, W, H);
            const { drag, start, stop } = useDragger(toPt);
            const vx = W / 2 - 40, vy = H - 80, R = 195;
            const [stack, setStack] = useState([30, 60]);
            const [base, setBase] = useState(0);                 // 整体摆放的方向，可自由旋转
            const [minus, setMinus] = useState(false);           // 相减：大角里挖掉一块

            const onMove = (e) => {
                if (!drag.current) return;
                e.preventDefault();
                const p = toPt(e);
                setBase(round1(dirToDeg(p[0] - vx, p[1] - vy)));
            };

            const total = minus
                ? Math.max(0, (stack[0] || 0) - stack.slice(1).reduce((s, d) => s + d, 0))
                : stack.reduce((s, d) => s + d, 0);
            const info = angleKind(total);

            // 相加不超过周角；相减不能把大角挖成负的
            const canAdd = (d) => minus ? (stack.length === 0 || total - d >= 0) : total + d <= 360;
            const push = (d) => { if (canAdd(d)) setStack([...stack, d]); };

            // 依次累加，画出每一块扇形
            let acc = base;
            const wedges = (minus ? [stack[0] || 0] : stack).map((d, i) => {
                const a0 = acc, a1 = acc + d;
                acc = a1;
                const color = (PIECES.find((p) => p.deg === d) || {}).color || '#64748b';
                return (
                    <g key={i} className="fade-in">
                        <path d={wedgePath(vx, vy, R, a0, a1)} fill={color} opacity="0.3" stroke={color} strokeWidth="2" />
                        <text x={along([vx, vy], (a0 + a1) / 2, R * 0.62)[0]} y={along([vx, vy], (a0 + a1) / 2, R * 0.62)[1] + 5}
                            textAnchor="middle" className="text-base font-bold" fill={color}>{d}°</text>
                    </g>
                );
            });

            // 相减：从大角的另一端挖掉后面几块，剩下的高亮
            let cut = null;
            if (minus && stack.length > 1) {
                const big = stack[0], off = stack.slice(1).reduce((s, d) => s + d, 0);
                cut = (
                    <g>
                        <path d={wedgePath(vx, vy, R, base + big - off, base + big)} fill="#e11d48" opacity="0.32"
                            stroke="#e11d48" strokeWidth="2" />
                        <text x={along([vx, vy], base + big - off / 2, R * 0.82)[0]} y={along([vx, vy], base + big - off / 2, R * 0.82)[1] + 5}
                            textAnchor="middle" className="text-sm font-bold" fill="#be123c">− {off}°</text>
                    </g>
                );
            }
            const endDeg = minus ? base + total : base + total;

            return (
                <div className="fade-in space-y-4">
                    <Card>
                        <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} className="geo-svg w-full"
                            onMouseMove={onMove} onMouseUp={stop} onMouseLeave={stop}
                            onTouchMove={onMove} onTouchEnd={stop}>
                            <GridBg W={W} H={H} />
                            {wedges}
                            {cut}
                            {/* 最外面两条边加粗，强调"拼出来的这一个角" */}
                            <line x1={vx} y1={vy} x2={along([vx, vy], base, R)[0]} y2={along([vx, vy], base, R)[1]}
                                stroke="#1e293b" strokeWidth="5" strokeLinecap="round" />
                            <line x1={vx} y1={vy} x2={along([vx, vy], endDeg, R)[0]} y2={along([vx, vy], endDeg, R)[1]}
                                stroke="#1e293b" strokeWidth="5" strokeLinecap="round" />
                            {total >= 360
                                ? <circle cx={vx} cy={vy} r={R + 16} fill="none" stroke={info.color} strokeWidth="3.5" strokeDasharray="6 5" />
                                : total > 0 && <path d={arcPath(vx, vy, R + 16, base, endDeg)} fill="none"
                                    stroke={info.color} strokeWidth="3.5" strokeDasharray="6 5" />}
                            {Math.round(total) === 90 && <RightAngleMark v={[vx, vy]} a={base} b={base + 90} color="#1e293b" size={24} />}
                            <circle cx={vx} cy={vy} r="7" fill="#1e293b" />
                            <Handle p={along([vx, vy], base, R + 44)} color="#1e293b" r={10} label="摆" onDown={start('base')} />
                        </svg>
                        <p className="text-center text-slate-500 mt-2 text-sm">拖「摆」把整个角转个方向 —— 角的大小不会因为摆的方向变</p>
                    </Card>

                    <Verdict tone={info.tone}>
                        {minus
                            ? (stack.length ? `${stack[0]}°` + stack.slice(1).map((d) => ` − ${d}°`).join('') + ` = ${total}°` : '先选一块大角')
                            : (stack.length ? stack.join('° + ') + '° = ' + total + '°' : '还没拼')}
                        {total > 0 && `　（${info.name}）`}
                    </Verdict>

                    <Card>
                        <div className="flex justify-center gap-2 mb-3">
                            <Btn tone={minus ? 'slate' : 'dark'} onClick={() => { setMinus(false); setStack([30, 60]); }} active={!minus}>相加拼角</Btn>
                            <Btn tone={minus ? 'dark' : 'slate'} onClick={() => { setMinus(true); setStack([60, 45]); }} active={minus}>相减拼角</Btn>
                        </div>
                        <div className="flex justify-center gap-2 flex-wrap">
                            {PIECES.map((p) => (
                                <button key={p.deg} onClick={() => push(p.deg)}
                                    className="px-5 py-2.5 rounded-xl font-bold text-white shadow-sm smooth-transition hover:brightness-110 disabled:opacity-30"
                                    style={{ background: p.color }} disabled={!canAdd(p.deg)}>
                                    {minus && stack.length ? '− ' : '+ '}{p.deg}°
                                </button>
                            ))}
                        </div>
                        <div className="flex justify-center gap-2 mt-3">
                            <Btn onClick={() => setStack(stack.slice(0, -1))} disabled={!stack.length}>撤销一块</Btn>
                            <Btn onClick={() => setStack([])}>清空</Btn>
                        </div>
                    </Card>

                    <Card>
                        <div className="text-center font-bold text-slate-700 mb-3">一副三角尺（30°60°90° 和 45°45°90°）能拼出这些角</div>
                        <div className="flex flex-wrap justify-center gap-2">
                            {RULER_COMBOS.map((c) => (
                                <button key={c.sum} onClick={() => { setMinus(false); setStack(c.list); setBase(0); }}
                                    className={"px-3 py-2 rounded-xl border-2 text-sm font-bold smooth-transition " +
                                        (!minus && stack.join() === c.list.join() ? "bg-violet-500 text-white border-violet-500 shadow"
                                                                                  : "bg-white text-slate-600 border-slate-200 hover:border-violet-300")}>
                                    {c.list.join('°+')}° = {c.sum}°
                                </button>
                            ))}
                        </div>
                        <div className="text-center text-sm text-slate-500 mt-3">
                            相减也能拼：<button className="font-bold text-rose-600 underline" onClick={() => { setMinus(true); setStack([60, 45]); }}>60° − 45° = 15°</button>
                            　<button className="font-bold text-rose-600 underline" onClick={() => { setMinus(true); setStack([90, 60]); }}>90° − 60° = 30°</button>
                        </div>
                    </Card>
                </div>
            );
        };

        // ===========================================================
        // 模块六：平行与垂直
        // ===========================================================
        // —— 场景 1：摆一摆（两条直线自由拖动）
        const PlaceLines = () => {
            const W = 640, H = 400;
            const svgRef = useRef(null);
            const toPt = useSvgPoint(svgRef, W, H);
            const { drag, start, stop } = useDragger(toPt);
            // 每条直线用两个可拖的点表示，拖点转方向，拖线本身整体平移
            const [l1, setL1] = useState([[190, 210], [450, 210]]);
            const [l2, setL2] = useState([[220, 300], [430, 130]]);
            const [snap, setSnap] = useState(true);

            const degOf = (L) => dirToDeg(L[1][0] - L[0][0], L[1][1] - L[0][1]);
            const midOf = (L) => [(L[0][0] + L[1][0]) / 2, (L[0][1] + L[1][1]) / 2];

            const onMove = (e) => {
                if (!drag.current) return;
                e.preventDefault();
                const raw = add(toPt(e), drag.current.off);
                const [id, k] = drag.current.id;
                const [L, setL] = id === 1 ? [l1, setL1] : [l2, setL2];
                const other = id === 1 ? degOf(l2) : degOf(l1);
                const fit = [clamp(raw[0], 26, W - 26), clamp(raw[1], 26, H - 26)];
                if (k === 'm') {                                  // 整条平移
                    const d = sub(fit, midOf(L));
                    setL([add(L[0], d), add(L[1], d)]);
                } else {
                    const anchor = L[1 - k];
                    let p = fit;
                    if (snap) {                                   // 差 3° 以内就吸住，方便学生"摆正"
                        const d = dirToDeg(p[0] - anchor[0], p[1] - anchor[1]);
                        const diff = norm180(d - other);
                        let target = null;
                        if (diff < 3 || diff > 177) target = other + (norm360(d - other) > 90 && norm360(d - other) < 270 ? 180 : 0);
                        else if (Math.abs(diff - 90) < 3) target = other + (norm360(d - other - 90) < 90 || norm360(d - other - 90) > 270 ? 90 : 270);
                        if (target != null) p = along(anchor, target, dist(p, anchor));
                    }
                    const nl = [...L]; nl[k] = p; setL(nl);
                }
            };

            const d1 = degOf(l1), d2 = degOf(l2);
            const diff = norm180(d1 - d2);
            const isParallel = diff < 0.8 || diff > 179.2;
            const isPerp = Math.abs(diff - 90) < 0.8;
            const crossAngle = round1(Math.min(diff, 180 - diff));
            const c1 = midOf(l1), c2 = midOf(l2);
            const inter = isParallel ? null : intersectOf(c1, d1, c2, d2);
            const outside = inter && (inter[0] < 6 || inter[0] > W - 6 || inter[1] < 6 || inter[1] > H - 6);

            // 平行时量三处距离，说明"距离处处相等"
            const gap = useMemo(() => {
                if (!isParallel) return null;
                const f = footOf(c2, c1, d1);
                return { foot: f, d: round1(dist(f, c2)) };
            }, [isParallel, c1[0], c1[1], c2[0], c2[1], d1]);

            const C1 = '#2563eb', C2 = '#ea580c';
            const FAR = 1100;
            const seg = (L, deg) => [along(midOf(L), deg + 180, FAR), along(midOf(L), deg, FAR)];
