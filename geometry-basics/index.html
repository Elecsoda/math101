            const [e1a, e1b] = seg(l1, d1), [e2a, e2b] = seg(l2, d2);

            const state = isParallel ? { tone: 'emerald', text: '互相平行 ∥ —— 永不相交，距离处处相等' }
                : isPerp ? { tone: 'blue', text: '互相垂直 ⊥ —— 相交成 90°' }
                : { tone: 'slate', text: `相交，夹角 ${crossAngle}°` };

            const preset = (kind) => {
                if (kind === 'para') { setL1([[190, 160], [450, 160]]); setL2([[190, 270], [450, 270]]); }
                if (kind === 'perp') { setL1([[180, 200], [460, 200]]); setL2([[320, 90], [320, 320]]); }
                if (kind === 'near') { setL1([[120, 250], [520, 215]]); setL2([[120, 150], [520, 150]]); }
                if (kind === 'slant') { setL1([[160, 300], [470, 130]]); setL2([[160, 140], [470, 310]]); }
            };

            return (
                <div className="space-y-4">
                    <Card>
                        <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} className="geo-svg w-full"
                            onMouseMove={onMove} onMouseUp={stop} onMouseLeave={stop}
                            onTouchMove={onMove} onTouchEnd={stop}>
                            <defs><clipPath id="ppClip"><rect x="0" y="0" width={W} height={H} rx="14" /></clipPath></defs>
                            <GridBg W={W} H={H} />

                            <g clipPath="url(#ppClip)">
                                <line x1={e1a[0]} y1={e1a[1]} x2={e1b[0]} y2={e1b[1]} stroke={C1} strokeWidth="5" strokeLinecap="round" />
                                <line x1={e2a[0]} y1={e2a[1]} x2={e2b[0]} y2={e2b[1]} stroke={C2} strokeWidth="5" strokeLinecap="round" />
                                <line x1={e1a[0]} y1={e1a[1]} x2={e1b[0]} y2={e1b[1]} stroke="transparent" strokeWidth="24"
                                    className="move" onMouseDown={start([1, 'm'], midOf(l1))} onTouchStart={start([1, 'm'], midOf(l1))} />
                                <line x1={e2a[0]} y1={e2a[1]} x2={e2b[0]} y2={e2b[1]} stroke="transparent" strokeWidth="24"
                                    className="move" onMouseDown={start([2, 'm'], midOf(l2))} onTouchStart={start([2, 'm'], midOf(l2))} />

                                {/* 平行：画三条等长的垂直距离线 */}
                                {isParallel && gap && [-170, 0, 170].map((off, i) => {
                                    const p = along(gap.foot, d1, off), q = along(c2, d1, off);
                                    return (
                                        <g key={i}>
                                            <line x1={p[0]} y1={p[1]} x2={q[0]} y2={q[1]} stroke="#059669" strokeWidth="2.5" strokeDasharray="6 5" />
                                            <RightAngleMark v={p} a={d1} b={dirToDeg(q[0] - p[0], q[1] - p[1])} size={11} color="#059669" />
                                            <text x={(p[0] + q[0]) / 2 + 16} y={(p[1] + q[1]) / 2 + 4} className="text-xs font-bold" fill="#059669">{gap.d}</text>
                                        </g>
                                    );
                                })}

                                {/* 相交：标出交点和夹角 */}
                                {inter && (
                                    <g>
                                        <circle cx={inter[0]} cy={inter[1]} r="7" fill="#1e293b" />
                                        {isPerp
                                            ? <g><RightAngleMark v={inter} a={d1} b={d2} size={22} color="#1e293b" />
                                                 <RightAngleMark v={inter} a={d1 + 180} b={d2 + 180} size={22} color="#1e293b" /></g>
                                            : <path d={arcPath(inter[0], inter[1], 42, d1, d2)} fill="none" stroke="#1e293b" strokeWidth="3" />}
                                        {!isPerp && (
                                            <text x={along(inter, (d1 + d2) / 2, 62)[0]} y={along(inter, (d1 + d2) / 2, 62)[1] + 5}
                                                textAnchor="middle" className="text-base font-bold" fill="#1e293b">{crossAngle}°</text>
                                        )}
                                        {isPerp && <text x={inter[0] + 12} y={inter[1] - 30} className="text-sm font-bold" fill="#1e293b">垂足</text>}
                                    </g>
                                )}
                            </g>

                            {/* 交点跑到画面外：提醒"延长以后还是会相交" */}
                            {outside && (
                                <g className="fade-in">
                                    <rect x={W / 2 - 175} y="12" width="350" height="34" rx="10" fill="#fee2e2" />
                                    <text x={W / 2} y="34" textAnchor="middle" className="text-sm font-bold" fill="#b91c1c">
                                        看着不相交，其实延长以后会相交 → 不是平行
                                    </text>
                                </g>
                            )}

                            <Handle p={l1[0]} color={C1} r={9} onDown={start([1, 0], l1[0])} />
                            <Handle p={l1[1]} color={C1} r={9} onDown={start([1, 1], l1[1])} />
                            <Handle p={l2[0]} color={C2} r={9} onDown={start([2, 0], l2[0])} />
                            <Handle p={l2[1]} color={C2} r={9} onDown={start([2, 1], l2[1])} />
                        </svg>
                        <p className="text-center text-slate-500 mt-2 text-sm">
                            拖<span className="font-bold">圆点</span>转方向，按住<span className="font-bold">线本身</span>整条平移
                        </p>
                    </Card>

                    <Verdict tone={state.tone}>{state.text}</Verdict>

                    <Card>
                        <div className="flex justify-center gap-2 flex-wrap">
                            <Btn tone="emerald" onClick={() => preset('para')}>摆成平行</Btn>
                            <Btn tone="blue" onClick={() => preset('perp')}>摆成垂直</Btn>
                            <Btn tone="orange" onClick={() => preset('near')}>差一点点平行</Btn>
                            <Btn tone="violet" onClick={() => preset('slant')}>斜着相交</Btn>
                            <Btn onClick={() => setSnap(!snap)} active={snap}>自动吸附 {snap ? '开' : '关'}</Btn>
                        </div>
                    </Card>

                    <BookNote title="课本上的说法">
                        在<span className="font-bold">同一平面内</span>，两条直线的位置关系只有两种：<span className="font-bold">相交</span>和<span className="font-bold">不相交</span>。
                        不相交的两条直线<span className="font-bold">互相平行</span>，记作 a∥b；相交成直角时<span className="font-bold">互相垂直</span>，记作 a⊥b，
                        交点叫<span className="font-bold">垂足</span>。判断平行不能只看画出来的一段，要想「延长以后会不会碰上」。
                    </BookNote>
                </div>
            );
        };

        // —— 场景 2：点到直线的距离，垂线段最短
        const PointToLine = () => {
            const W = 640, H = 380;
            const svgRef = useRef(null);
            const toPt = useSvgPoint(svgRef, W, H);
            const { drag, start, stop } = useDragger(toPt);
            const [p, setP] = useState([320, 120]);
            const [lineY, setLineY] = useState(300);
            const [lineDeg, setLineDeg] = useState(0);
            const [freeFoot, setFreeFoot] = useState(180);       // 学生自己拖的那个落点（沿线偏移）

            const c = [W / 2, lineY];
            const onMove = (e) => {
                if (!drag.current) return;
                e.preventDefault();
                const raw = add(toPt(e), drag.current.off);
                if (drag.current.id === 'p') setP([clamp(raw[0], 40, W - 40), clamp(raw[1], 30, H - 30)]);
                else if (drag.current.id === 'line') setLineY(clamp(raw[1], 150, H - 40));
                else if (drag.current.id === 'rot') {            // 把方向折到 (-90°, 90°] 再限幅，直线不会翻个个儿
                    let d = norm180(dirToDeg(raw[0] - c[0], raw[1] - c[1]));
                    if (d > 90) d -= 180;
                    setLineDeg(clamp(round1(d), -35, 35));
                }
                else if (drag.current.id === 'free') {
                    const f = footOf(raw, c, lineDeg);
                    setFreeFoot(round1((f[0] - c[0]) * Math.cos(toRad(lineDeg)) - (f[1] - c[1]) * Math.sin(toRad(lineDeg))));
                }
            };

            const foot = footOf(p, c, lineDeg);
            const perpLen = dist(p, foot);
            const others = [-150, -80, 80, 150].map((off) => along(foot, lineDeg, off));
            const freeP = along(foot, lineDeg, freeFoot);
            const FAR = 900;
            const ea = along(c, lineDeg + 180, FAR), eb = along(c, lineDeg, FAR);

            return (
                <div className="space-y-4">
                    <Card>
                        <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} className="geo-svg w-full"
                            onMouseMove={onMove} onMouseUp={stop} onMouseLeave={stop}
                            onTouchMove={onMove} onTouchEnd={stop}>
                            <defs><clipPath id="ptlClip"><rect x="0" y="0" width={W} height={H} rx="14" /></clipPath></defs>
                            <GridBg W={W} H={H} />
                            <g clipPath="url(#ptlClip)">
                                <line x1={ea[0]} y1={ea[1]} x2={eb[0]} y2={eb[1]} stroke="#334155" strokeWidth="5" strokeLinecap="round" />
                                <line x1={ea[0]} y1={ea[1]} x2={eb[0]} y2={eb[1]} stroke="transparent" strokeWidth="24"
                                    className="move" onMouseDown={start('line', c)} onTouchStart={start('line', c)} />

                                {/* 斜着的连线：都比垂线段长 */}
                                {others.map((q, i) => (
                                    <g key={i}>
                                        <line x1={p[0]} y1={p[1]} x2={q[0]} y2={q[1]} stroke="#94a3b8" strokeWidth="2.5" strokeDasharray="7 6" />
                                        <text x={(p[0] + q[0]) / 2 + (q[0] > p[0] ? 14 : -14)} y={(p[1] + q[1]) / 2}
                                            textAnchor="middle" className="text-xs font-bold" fill="#94a3b8">{cm(dist(p, q))}</text>
                                    </g>
                                ))}
                                {/* 学生自己拖的那条 */}
                                <line x1={p[0]} y1={p[1]} x2={freeP[0]} y2={freeP[1]} stroke="#f97316" strokeWidth="3.5" />
                                <text x={(p[0] + freeP[0]) / 2 + 16} y={(p[1] + freeP[1]) / 2 - 6}
                                    className="text-sm font-bold" fill="#f97316">{cm(dist(p, freeP))} cm</text>

                                {/* 垂线段 */}
                                <line x1={p[0]} y1={p[1]} x2={foot[0]} y2={foot[1]} stroke="#059669" strokeWidth="5" strokeLinecap="round" />
                                <RightAngleMark v={foot} a={lineDeg} b={dirToDeg(p[0] - foot[0], p[1] - foot[1])} size={16} color="#059669" />
                                <text x={(p[0] + foot[0]) / 2 - 40} y={(p[1] + foot[1]) / 2 + 5} className="text-base font-bold" fill="#059669">
                                    {cm(perpLen)} cm
                                </text>
                                <circle cx={foot[0]} cy={foot[1]} r="6" fill="#059669" />
                                <text x={foot[0] + 10} y={foot[1] + 22} className="text-sm font-bold" fill="#059669">垂足 F</text>
                            </g>
                            <circle cx={p[0]} cy={p[1]} r="7" fill="#1e293b" />
                            <text x={p[0] - 20} y={p[1] - 14} className="text-sm font-bold" fill="#1e293b">P</text>
                            <Handle p={p} color="#1e293b" r={10} onDown={start('p', p)} />
                            <Handle p={freeP} color="#f97316" r={9} onDown={start('free')} />
                            <Handle p={along(c, lineDeg, 250)} color="#334155" r={9} label="转" onDown={start('rot')} />
                        </svg>
                        <p className="text-center text-slate-500 mt-2 text-sm">
                            拖 <span className="font-bold">P</span> 换位置，拖<span className="font-bold">橙点</span>沿直线滑动 —— 试试能不能比绿色的短
                        </p>
                    </Card>

                    <Verdict tone={Math.abs(dist(p, freeP) - perpLen) < 1 ? 'emerald' : 'slate'}>
                        垂线段 {cm(perpLen)} cm，你拖的这条 {cm(dist(p, freeP))} cm
                        {Math.abs(dist(p, freeP) - perpLen) < 1 ? '（正好也垂直了）' : '，还是垂线段短'}
                    </Verdict>

                    <BookNote title="点到直线的距离">
                        从直线外一点到这条直线所画的<span className="font-bold">线段中，垂直线段最短</span>。
                        这条垂直线段的<span className="font-bold">长度</span>，叫做这点到直线的距离。
                        （跳远量成绩、过马路走垂直方向最近，都是这个道理。）
                    </BookNote>
                </div>
            );
        };

        // —— 场景 3：平行线之间的距离处处相等
        const ParallelGap = () => {
            const W = 640, H = 360;
            const svgRef = useRef(null);
            const toPt = useSvgPoint(svgRef, W, H);
            const { drag, start, stop } = useDragger(toPt);
            const [gap, setGap] = useState(110);
            const [deg, setDeg] = useState(0);
            const [x, setX] = useState(0);                        // 沿直线滑动的量点

            const c1 = [W / 2, H / 2 - 0];
            const c2 = along(c1, deg + 90, -gap);                  // 第二条线在下方
            const onMove = (e) => {
                if (!drag.current) return;
                e.preventDefault();
                const p = toPt(e);
                if (drag.current.id === 'slide') {
                    const f = footOf(p, c1, deg);
                    setX(round1((f[0] - c1[0]) * Math.cos(toRad(deg)) - (f[1] - c1[1]) * Math.sin(toRad(deg))));
                } else if (drag.current.id === 'rot') {
                    let d = norm180(dirToDeg(p[0] - c1[0], p[1] - c1[1]));
                    if (d > 90) d -= 180;
                    setDeg(clamp(round1(d), -30, 30));
                }
            };

            const FAR = 900;
            const l1a = along(c1, deg + 180, FAR), l1b = along(c1, deg, FAR);
            const l2a = along(c2, deg + 180, FAR), l2b = along(c2, deg, FAR);
            const marks = [-230, -115, 0, 115, 230];
            const slideTop = along(c1, deg, x);
            const slideBot = along(slideTop, deg + 90, -gap);

            return (
                <div className="space-y-4">
                    <Card>
                        <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} className="geo-svg w-full"
                            onMouseMove={onMove} onMouseUp={stop} onMouseLeave={stop}
                            onTouchMove={onMove} onTouchEnd={stop}>
                            <defs><clipPath id="pgClip"><rect x="0" y="0" width={W} height={H} rx="14" /></clipPath></defs>
                            <GridBg W={W} H={H} />
                            <g clipPath="url(#pgClip)">
                                <line x1={l1a[0]} y1={l1a[1]} x2={l1b[0]} y2={l1b[1]} stroke="#2563eb" strokeWidth="5" strokeLinecap="round" />
                                <line x1={l2a[0]} y1={l2a[1]} x2={l2b[0]} y2={l2b[1]} stroke="#2563eb" strokeWidth="5" strokeLinecap="round" />
                                {marks.map((m, i) => {
                                    const a = along(c1, deg, m), b = along(a, deg + 90, -gap);
                                    return (
                                        <g key={i}>
                                            <line x1={a[0]} y1={a[1]} x2={b[0]} y2={b[1]} stroke="#059669" strokeWidth="2.5" strokeDasharray="6 5" />
                                            <RightAngleMark v={a} a={deg} b={deg - 90} size={11} color="#059669" />
                                            <text x={(a[0] + b[0]) / 2 + 15} y={(a[1] + b[1]) / 2 + 4} className="text-xs font-bold" fill="#059669">{cm(gap)}</text>
                                        </g>
                                    );
                                })}
                                <line x1={slideTop[0]} y1={slideTop[1]} x2={slideBot[0]} y2={slideBot[1]} stroke="#f97316" strokeWidth="5" strokeLinecap="round" />
                                <text x={(slideTop[0] + slideBot[0]) / 2 - 34} y={(slideTop[1] + slideBot[1]) / 2 + 5}
                                    className="text-base font-bold" fill="#f97316">{cm(gap)} cm</text>
                            </g>
                            <Handle p={slideTop} color="#f97316" r={10} onDown={start('slide')} />
                            <Handle p={along(c1, deg, 260)} color="#2563eb" r={9} label="转" onDown={start('rot')} />
                        </svg>
                        <div className="flex items-center gap-3 mt-3">
                            <span className="text-sm font-bold text-slate-500 shrink-0">两线距离</span>
                            <input type="range" min="50" max="150" value={gap} onChange={(e) => setGap(+e.target.value)} className="flex-1" />
                            <span className="text-sm font-bold text-emerald-600 shrink-0 w-16 text-right">{cm(gap)} cm</span>
                        </div>
                        <p className="text-center text-slate-500 text-sm mt-1">橙色量尺可以左右滑动 —— 量到哪儿都一样长</p>
                    </Card>

                    <Verdict tone="emerald">两条平行线之间的垂直线段处处相等，都是 {cm(gap)} cm</Verdict>
                    <BookNote title="想一想">
                        铁轨、跑道分道线、作业本的横线，为什么走多远都不会挤到一起？因为它们互相平行，间距处处相等。
                    </BookNote>
                </div>
            );
        };

        // —— 场景 4：用三角尺画垂线 / 画平行线
        const DrawRuler = () => {
            const W = 640, H = 380;
            const [kind, setKind] = useState('perp');
            const [step, setStep] = useState(0);
            const Ly = 285, P = [400, 145];
            const STEPS = {
                perp: ['把三角尺的一条直角边靠在直线上', '沿着直线移动三角尺，让另一条直角边经过点 P', '沿着这条直角边画出垂线', '画上直角符号，标出垂足'],
                para: ['把三角尺的一条边对准已知直线', '用直尺紧靠三角尺的另一条边（直尺不动）', '沿着直尺平移三角尺，直到那条边经过点 P', '沿着这条边画出平行线'],
            };
            const steps = STEPS[kind];
            const next = () => setStep((s) => Math.min(steps.length, s + 1));
            const prev = () => setStep((s) => Math.max(0, s - 1));
            useEffect(() => { setStep(0); }, [kind]);

            // 三角尺（直角在左下角）。画垂线要竖边够高、够得着 P；画平行线要横边够长、盖过 P
            const TW = kind === 'para' ? 292 : 160;
            const TH = kind === 'para' ? 120 : 158;
            const triPts = (ax, ay) => `${ax},${ay} ${ax + TW},${ay} ${ax},${ay - TH}`;

            // 垂线：三角尺先靠上直线，再沿直线滑到点 P 底下
            const perpX = step >= 2 ? P[0] : 150;
            const paraShift = kind === 'para' && step >= 3;      // 平行线：沿直尺把三角尺推上去

            return (
                <div className="space-y-4">
                    <SubTabs items={[['perp', '画垂线'], ['para', '画平行线']]} value={kind} onChange={setKind} />
                    <Card>
                        <svg viewBox={`0 0 ${W} ${H}`} className="geo-svg w-full">
                            <GridBg W={W} H={H} />
                            {/* 已知直线 */}
                            <line x1="40" y1={Ly} x2={W - 40} y2={Ly} stroke="#334155" strokeWidth="5" strokeLinecap="round" />
                            <text x={W - 46} y={Ly + 24} textAnchor="end" className="text-sm font-bold" fill="#334155">已知直线 a</text>
                            {/* 已知点 P */}
                            <circle cx={P[0]} cy={P[1]} r="7" fill="#dc2626" />
                            <text x={P[0] + 14} y={P[1] - 10} className="text-sm font-bold" fill="#dc2626">P</text>

                            {kind === 'perp' && (
                                <g>
                                    {/* 画好的垂线 */}
                                    {step >= 3 && (
                                        <g className="fade-in">
                                            <line x1={P[0]} y1={Ly} x2={P[0]} y2={P[1] - 55} stroke="#2563eb" strokeWidth="4.5" strokeLinecap="round" />
                                            <RightAngleMark v={[P[0], Ly]} a={0} b={90} size={18} color="#2563eb" />
                                            <circle cx={P[0]} cy={Ly} r="6" fill="#2563eb" />
                                            {step >= 4 && <text x={P[0] + 12} y={Ly + 26} className="text-sm font-bold" fill="#2563eb">垂足</text>}
                                        </g>
                                    )}
                                    {step < 4 && (
                                        <g style={{ transition: 'transform .6s cubic-bezier(.4,0,.2,1)' }}
                                            transform={`translate(${step === 0 ? -110 : perpX - 150} ${step === 0 ? -120 : 0})`}>
                                            <polygon points={triPts(150, Ly)} fill="#fde68a" fillOpacity="0.75" stroke="#d97706" strokeWidth="2.5" strokeLinejoin="round" />
                                            <RightAngleMark v={[150, Ly]} a={0} b={90} size={16} color="#b45309" />
                                            <text x={150 + TW * 0.36} y={Ly - 14} className="text-xs font-bold" fill="#b45309">三角尺</text>
                                        </g>
                                    )}
                                </g>
                            )}

                            {kind === 'para' && (
                                <g>
                                    {/* 直尺：紧靠三角尺的竖直边 */}
                                    {step >= 2 && (
                                        <g className="fade-in">
                                            <rect x="150" y={Ly - 258} width="34" height="258" rx="5" fill="#bfdbfe" fillOpacity="0.85" stroke="#2563eb" strokeWidth="2.5"
                                                transform="translate(-36 0)" />
                                            <text x="131" y={Ly - 232} textAnchor="middle" className="text-xs font-bold" fill="#1d4ed8"
                                                transform={`rotate(-90 131 ${Ly - 232})`}>直尺</text>
                                        </g>
                                    )}
                                    {/* 画好的平行线 */}
                                    {step >= 4 && (
                                        <g className="fade-in">
                                            <line x1="150" y1={P[1]} x2={W - 60} y2={P[1]} stroke="#059669" strokeWidth="4.5" strokeLinecap="round" />
                                            <text x={W - 66} y={P[1] - 12} textAnchor="end" className="text-sm font-bold" fill="#059669">b ∥ a</text>
                                        </g>
                                    )}
                                    {step < 4 && (
                                        <g style={{ transition: 'transform .6s cubic-bezier(.4,0,.2,1)' }}
                                            transform={`translate(${step === 0 ? -100 : 0} ${step === 0 ? -140 : (paraShift ? P[1] - Ly : 0)})`}>
                                            <polygon points={triPts(150, Ly)} fill="#fde68a" fillOpacity="0.75" stroke="#d97706" strokeWidth="2.5" strokeLinejoin="round" />
                                            <RightAngleMark v={[150, Ly]} a={0} b={90} size={16} color="#b45309" />
                                            <text x={150 + TW * 0.36} y={Ly - 14} className="text-xs font-bold" fill="#b45309">三角尺</text>
                                        </g>
                                    )}
                                </g>
                            )}
                        </svg>
                    </Card>

                    <Card>
                        <div className="space-y-2">
                            {steps.map((s, i) => <StepRow key={i} ok={step > i}>{`${'①②③④'[i]} ${s}`}</StepRow>)}
                        </div>
                        <div className="flex justify-center gap-2 mt-4">
                            <Btn onClick={prev} disabled={step === 0}>← 上一步</Btn>
                            <Btn tone="dark" onClick={next} disabled={step >= steps.length}>{step >= steps.length ? '画完了' : '下一步 →'}</Btn>
                            <Btn onClick={() => setStep(0)}>重来</Btn>
                        </div>
                    </Card>

                    <BookNote title="口诀">
                        画垂线：<span className="font-bold">一靠、二移、三画线</span>（直角边靠直线，移到过点，沿边画线，标直角）。<br />
                        画平行线：<span className="font-bold">一对、二靠、三推、四画</span>（三角尺对直线，直尺靠住，推三角尺，沿边画线）。
                    </BookNote>
                </div>
            );
        };

        // —— 场景 5：生活里的平行与垂直
        const LifeScenes = () => {
            const [hl, setHl] = useState('para');
            const P = '#059669', V = '#2563eb', N = '#94a3b8';
            const col = (isPara) => hl === 'none' ? N : (isPara ? (hl === 'para' ? P : N) : (hl === 'perp' ? V : N));
            const wd = (isPara) => (hl !== 'none' && ((isPara && hl === 'para') || (!isPara && hl === 'perp'))) ? 6 : 3.5;

            const scenes = [
                {
                    name: '窗框', draw: (
                        <g>
                            <rect x="30" y="30" width="200" height="130" fill="#f8fafc" stroke="#cbd5e1" strokeWidth="2" />
                            <line x1="30" y1="30" x2="230" y2="30" stroke={col(true)} strokeWidth={wd(true)} />
                            <line x1="30" y1="95" x2="230" y2="95" stroke={col(true)} strokeWidth={wd(true)} />
                            <line x1="30" y1="160" x2="230" y2="160" stroke={col(true)} strokeWidth={wd(true)} />
                            <line x1="130" y1="30" x2="130" y2="160" stroke={col(false)} strokeWidth={wd(false)} />
                            {hl === 'perp' && <RightAngleMark v={[130, 95]} a={0} b={90} size={13} color={V} />}
                        </g>
                    ), tip: '上下横框互相平行，横框和竖框互相垂直'
                },
                {
                    name: '十字路口', draw: (
                        <g>
                            <rect x="0" y="0" width="260" height="190" fill="#f1f5f9" />
                            <rect x="0" y="70" width="260" height="50" fill="#e2e8f0" />
                            <rect x="105" y="0" width="50" height="190" fill="#e2e8f0" />
                            <line x1="0" y1="70" x2="260" y2="70" stroke={col(true)} strokeWidth={wd(true)} />
                            <line x1="0" y1="120" x2="260" y2="120" stroke={col(true)} strokeWidth={wd(true)} />
                            <line x1="105" y1="0" x2="105" y2="190" stroke={col(false)} strokeWidth={wd(false)} />
                            <line x1="155" y1="0" x2="155" y2="190" stroke={col(false)} strokeWidth={wd(false)} />
                            {hl === 'perp' && <RightAngleMark v={[105, 70]} a={180} b={-90} size={13} color={V} />}
                        </g>
                    ), tip: '两条路的边线互相平行，两条路互相垂直'
                },
                {
                    name: '双杠', draw: (
                        <g>
                            <rect x="0" y="0" width="260" height="190" fill="#fefce8" />
                            <line x1="25" y1="60" x2="235" y2="60" stroke={col(true)} strokeWidth={wd(true) + 2} strokeLinecap="round" />
                            <line x1="25" y1="105" x2="235" y2="105" stroke={col(true)} strokeWidth={wd(true) + 2} strokeLinecap="round" />
                            {[55, 205].map((x) => (
                                <g key={x}>
                                    <line x1={x} y1="60" x2={x} y2="165" stroke={col(false)} strokeWidth={wd(false)} />
                                    <line x1={x - 10} y1="105" x2={x - 10} y2="165" stroke={col(false)} strokeWidth={wd(false)} opacity="0.6" />
                                </g>
                            ))}
                            <line x1="10" y1="165" x2="250" y2="165" stroke="#a16207" strokeWidth="4" />
                            {hl === 'perp' && <RightAngleMark v={[55, 165]} a={0} b={90} size={13} color={V} />}
                        </g>
                    ), tip: '两根杠互相平行，立柱和地面互相垂直'
                },
                {
                    name: '五线谱', draw: (
                        <g>
                            <rect x="0" y="0" width="260" height="190" fill="#fff" />
                            {[45, 70, 95, 120, 145].map((y) => (
                                <line key={y} x1="25" y1={y} x2="235" y2={y} stroke={col(true)} strokeWidth={wd(true) - 1} />
                            ))}
                            <line x1="80" y1="45" x2="80" y2="145" stroke={col(false)} strokeWidth={wd(false)} />
                            <line x1="180" y1="45" x2="180" y2="145" stroke={col(false)} strokeWidth={wd(false)} />
                            {hl === 'perp' && <RightAngleMark v={[80, 95]} a={0} b={-90} size={12} color={V} />}
                        </g>
                    ), tip: '五条线互相平行，小节线和它们互相垂直'
                },
            ];

            return (
                <div className="space-y-4">
                    <div className="flex justify-center gap-2">
                        <Btn tone={hl === 'para' ? 'emerald' : 'slate'} onClick={() => setHl('para')}>标出平行 ∥</Btn>
                        <Btn tone={hl === 'perp' ? 'blue' : 'slate'} onClick={() => setHl('perp')}>标出垂直 ⊥</Btn>
                        <Btn tone={hl === 'none' ? 'dark' : 'slate'} onClick={() => setHl('none')}>都不标</Btn>
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                        {scenes.map((s) => (
                            <Card key={s.name} className="p-3">
                                <div className="font-bold text-slate-700 text-sm mb-1">{s.name}</div>
                                <svg viewBox="0 0 260 190" className="w-full rounded-lg overflow-hidden">{s.draw}</svg>
                                <div className="text-xs text-slate-500 mt-2 leading-relaxed">{s.tip}</div>
                            </Card>
                        ))}
                    </div>
                    <BookNote title="找一找">
                        教室里也到处都是：黑板的上下边、课桌的两条对边是<span className="font-bold">平行</span>；
                        墙角的两条边、书本相邻的两条边是<span className="font-bold">垂直</span>。
                    </BookNote>
                </div>
            );
        };

        const PerpParallel = () => {
            const [mode, setMode] = useState('place');
            return (
                <div className="fade-in space-y-4">
                    <SubTabs items={[['place', '摆一摆'], ['dist', '点到直线'], ['gap', '平行线距离'], ['draw', '画一画'], ['life', '生活里']]}
                        value={mode} onChange={setMode} />
                    {mode === 'place' && <PlaceLines />}
                    {mode === 'dist' && <PointToLine />}
                    {mode === 'gap' && <ParallelGap />}
                    {mode === 'draw' && <DrawRuler />}
                    {mode === 'life' && <LifeScenes />}
                </div>
            );
        };

        // ===========================================================
        // 模块七：图形里的角 —— 顶点可以随便拖
        // ===========================================================
        const SHAPES = {
            tri:  { name: '三角形', pts: [[280, 90], [130, 300], [430, 300]] },
            rect: { name: '长方形', pts: [[150, 110], [430, 110], [430, 290], [150, 290]] },
            para: { name: '平行四边形', pts: [[190, 110], [460, 110], [390, 290], [120, 290]] },
            trap: { name: '梯形', pts: [[220, 110], [390, 110], [460, 290], [130, 290]] },
            pent: { name: '五边形', pts: [[280, 80], [450, 190], [390, 310], [170, 310], [110, 190]] },
        };

        const ShapeAngles = () => {
            const W = 560, H = 400;
            const svgRef = useRef(null);
            const toPt = useSvgPoint(svgRef, W, H);
            const { drag, start, stop } = useDragger(toPt);
            const [key, setKey] = useState('rect');
            const [pts, setPts] = useState(SHAPES.rect.pts);
            const [sel, setSel] = useState(0);
            const [mark, setMark] = useState(true);               // 标出平行边 / 直角
            const n = pts.length;

            const load = (k) => { setKey(k); setPts(SHAPES[k].pts.map((p) => [...p])); setSel(0); };

            const onMove = (e) => {
                if (!drag.current) return;
                e.preventDefault();
                const raw = add(toPt(e), drag.current.off);
                const i = drag.current.id;
                const np = pts.map((p, k) => k === i ? [clamp(raw[0], 26, W - 26), clamp(raw[1], 26, H - 26)] : p);
                setPts(np);
            };

            // 用有向面积判断绕向，再算真正的内角（拖成凹多边形也不会算错）
            const area2 = pts.reduce((s, p, i) => {
                const q = pts[(i + 1) % n];
                return s + (p[0] * q[1] - q[0] * p[1]);
            }, 0);
            const cw = area2 > 0;

            const angles = pts.map((p, i) => {
                const prev = pts[(i - 1 + n) % n], next = pts[(i + 1) % n];
                const a = dirToDeg(prev[0] - p[0], prev[1] - p[1]);
                const b = dirToDeg(next[0] - p[0], next[1] - p[1]);
                const deg = cw ? norm360(b - a) : norm360(a - b);
                // deg 是从 from 逆时针扫到 to 的那一块，正好是图形内部这个角
                return { deg, a, b, from: cw ? a : b, to: cw ? b : a };
            });

            const sum = Math.round(angles.reduce((s, x) => s + x.deg, 0));
            const cur = angles[sel] || angles[0];
            const info = angleKind(cur.deg);
            // 弧半径不超过邻边的一小半，钝角/大角再收一点
            const nbr = Math.min(dist(pts[sel], pts[(sel + 1) % n]), dist(pts[sel], pts[(sel - 1 + n) % n]));
            const arcR = clamp(nbr * 0.3, 18, cur.deg > 150 ? 34 : 46);

            // 边的方向：找出互相平行的边
            const edges = pts.map((p, i) => ({ i, p, q: pts[(i + 1) % n], deg: dirToDeg(pts[(i + 1) % n][0] - p[0], pts[(i + 1) % n][1] - p[1]) }));
            const paraGroups = [];
            edges.forEach((e) => {
                const g = paraGroups.find((grp) => {
                    const d = norm180(grp[0].deg - e.deg);
                    return d < 1.5 || d > 178.5;
                });
                if (g) g.push(e); else paraGroups.push([e]);
            });
            const paraPairs = paraGroups.filter((g) => g.length > 1);
            const rightCount = angles.filter((x) => Math.abs(x.deg - 90) < 1).length;
            const GROUP_COLORS = ['#059669', '#7c3aed', '#0891b2'];

            return (
                <div className="fade-in space-y-4">
                    <div className="flex justify-center gap-2 flex-wrap">
                        {Object.entries(SHAPES).map(([k, s]) => (
                            <button key={k} onClick={() => load(k)}
                                className={"px-4 py-2 rounded-xl font-bold text-sm smooth-transition " +
                                    (key === k ? "bg-slate-700 text-white shadow" : "bg-white text-slate-500 hover:bg-slate-50")}>
                                {s.name}
                            </button>
                        ))}
                    </div>

                    <Card>
                        <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} className="geo-svg w-full"
                            onMouseMove={onMove} onMouseUp={stop} onMouseLeave={stop}
                            onTouchMove={onMove} onTouchEnd={stop}>
                            <GridBg W={W} H={H} />
                            <polygon points={pts.map((p) => p.join(',')).join(' ')}
                                fill="#e0f2fe" stroke="#0284c7" strokeWidth="4" strokeLinejoin="round" />

                            {/* 平行边打上同色的记号：同组画同样多的小斜杠（课本的画法） */}
                            {mark && paraPairs.map((g, gi) => g.map((e) => {
                                const m = [(e.p[0] + e.q[0]) / 2, (e.p[1] + e.q[1]) / 2];
                                const color = GROUP_COLORS[gi % 3];
                                const ticks = Array.from({ length: gi + 1 }, (_, k) => {
                                    const base = along(m, e.deg, (k - gi / 2) * 9);
                                    const a = along(base, e.deg + 55, 9), b = along(base, e.deg + 235, 9);
                                    return <line key={k} x1={a[0]} y1={a[1]} x2={b[0]} y2={b[1]}
                                        stroke={color} strokeWidth="3" strokeLinecap="round" />;
                                });
                                return (
                                    <g key={'p' + gi + e.i}>
                                        <line x1={e.p[0]} y1={e.p[1]} x2={e.q[0]} y2={e.q[1]}
                                            stroke={color} strokeWidth="5" opacity="0.85" />
                                        {ticks}
                                    </g>
                                );
                            }))}

                            {/* 所有直角都标出来 */}
                            {mark && angles.map((x, i) => Math.abs(x.deg - 90) < 1 &&
                                <RightAngleMark key={'r' + i} v={pts[i]} a={x.a} b={x.b} size={18} color="#1d4ed8" />)}

                            {/* 选中的角：涂色 + 画弧。半径跟着两条邻边缩，免得涂到图形外面 */}
                            <path d={wedgePath(pts[sel][0], pts[sel][1], arcR, cur.from, cur.to)} fill={info.color} opacity="0.3" />
                            <path d={arcPath(pts[sel][0], pts[sel][1], arcR, cur.from, cur.to)} fill="none" stroke={info.color} strokeWidth="3.5" />

                            {pts.map((p, i) => (
                                <g key={i} className="grab" onMouseDown={start(i, p)} onTouchStart={start(i, p)} onClick={() => setSel(i)}>
                                    <circle cx={p[0]} cy={p[1]} r="20" fill="transparent" />
                                    <circle cx={p[0]} cy={p[1]} r={i === sel ? 10 : 7}
                                        fill={i === sel ? info.color : '#0284c7'} stroke="#fff" strokeWidth="2.5" className="smooth-transition" />
                                </g>
                            ))}

                            <text x={pts[sel][0]} y={pts[sel][1] - 34} textAnchor="middle"
                                className="text-lg font-bold" fill={info.color}>{Math.round(cur.deg)}°</text>
                        </svg>
                        <p className="text-center text-slate-500 mt-2 text-sm">
                            <span className="font-bold">拖动顶点</span>随便变形，点顶点看那个角
                        </p>
                    </Card>

                    <Verdict tone={info.tone}>这个角是 {Math.round(cur.deg)}°，{info.name}</Verdict>

                    <Card>
                        <div className="flex flex-wrap justify-center gap-2 mb-3">
                            {angles.map((x, i) => {
                                const k = angleKind(x.deg);
                                return (
                                    <button key={i} onClick={() => setSel(i)}
                                        className={"px-3 py-1.5 rounded-lg text-sm font-bold smooth-transition border-2 " +
                                            (i === sel ? "text-white" : "bg-white")}
                                        style={i === sel ? { background: k.color, borderColor: k.color }
                                                        : { color: k.color, borderColor: k.color + '55' }}>
                                        {Math.round(x.deg)}° {k.name}
                                    </button>
                                );
                            })}
                        </div>
                        <div className="text-center font-bold text-slate-700">
                            {n} 个内角加起来 = <span className="text-blue-600">{sum}°</span>
                            <span className="text-slate-400 font-normal text-sm">（{n} 边形内角和 = ({n}−2) × 180° = {(n - 2) * 180}°）</span>
                        </div>
                        <div className="flex justify-center gap-4 flex-wrap mt-3 text-sm text-slate-600">
                            <span>直角 <span className="font-bold text-blue-600">{rightCount}</span> 个</span>
                            <span>平行边 <span className="font-bold text-emerald-600">{paraPairs.length}</span> 组</span>
                        </div>
                        <div className="flex justify-center gap-2 mt-3">
                            <Btn onClick={() => setMark(!mark)} active={mark}>标出平行边和直角 {mark ? '开' : '关'}</Btn>
                            <Btn onClick={() => load(key)}>复原</Btn>
                        </div>
                        <p className="text-center text-sm text-slate-500 mt-3">
                            使劲拖顶点，每个角都在变，可是<span className="font-bold text-slate-700">加起来的和一直是 {(n - 2) * 180}°</span>。
                        </p>
                    </Card>
                </div>
            );
        };

        // ===========================================================
        // 模块八：判一判 —— 随机小练习
        // ===========================================================
        const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
        const shuffled = (arr) => [...arr].sort(() => Math.random() - 0.5);

        const QTYPES = [
            // 认线
            () => {
                const kind = pick(['segment', 'ray', 'line']);
                const m = LINE_KINDS[kind];
                return {
                    render: () => (
                        <svg viewBox="0 0 400 200" className="w-full max-w-sm mx-auto">
                            {m.ends !== 2 && <line x1="290" y1="100" x2="395" y2="100" stroke={m.color} strokeWidth="4" strokeDasharray="9 7" opacity="0.55" />}
                            {m.ends === 0 && <line x1="110" y1="100" x2="5" y2="100" stroke={m.color} strokeWidth="4" strokeDasharray="9 7" opacity="0.55" />}
                            <line x1="110" y1="100" x2="290" y2="100" stroke={m.color} strokeWidth="5" />
                            {m.ends >= 1 && <circle cx="110" cy="100" r="7" fill={m.color} />}
                            {m.ends === 2 && <circle cx="290" cy="100" r="7" fill={m.color} />}
                        </svg>
                    ),
                    q: '这是什么？', options: ['线段', '射线', '直线'], answer: m.name,
                    why: `${m.name}有 ${m.ends} 个端点`,
                };
            },
            // 认角
            () => {
                const deg = pick([25, 40, 65, 90, 110, 145, 180]);
                const v = [200, 150], L = 120;
                return {
                    render: () => (
                        <svg viewBox="0 0 400 200" className="w-full max-w-sm mx-auto">
                            <path d={wedgePath(v[0], v[1], 60, 0, deg)} fill="#f97316" opacity="0.15" />
                            <line x1={v[0]} y1={v[1]} x2={v[0] + L} y2={v[1]} stroke="#475569" strokeWidth="5" strokeLinecap="round" />
                            <line x1={v[0]} y1={v[1]} x2={along(v, deg, L)[0]} y2={along(v, deg, L)[1]} stroke="#475569" strokeWidth="5" strokeLinecap="round" />
                            <path d={arcPath(v[0], v[1], 38, 0, deg)} fill="none" stroke="#f97316" strokeWidth="3" />
                            <circle cx={v[0]} cy={v[1]} r="6" fill="#1e293b" />
                        </svg>
                    ),
                    q: '这是什么角？', options: ['锐角', '直角', '钝角', '平角'], answer: angleKind(deg).name,
                    why: `这个角是 ${deg}°`,
                };
            },
            // 平行 / 垂直 / 相交
            () => {
                const rel = pick(['平行', '垂直', '相交']);
                const d1 = 15, d2 = rel === '平行' ? 15 : (rel === '垂直' ? 105 : 55);
                const line = (c, deg, color) => {
                    const p = along(c, deg, 300), q = along(c, deg + 180, 300);
                    return <line x1={q[0]} y1={q[1]} x2={p[0]} y2={p[1]} stroke={color} strokeWidth="5" strokeLinecap="round" />;
                };
                return {
                    render: () => (
                        <svg viewBox="0 0 400 200" className="w-full max-w-sm mx-auto">
                            <clipPath id="qClip"><rect x="0" y="0" width="400" height="200" /></clipPath>
                            <g clipPath="url(#qClip)">
                                {line(rel === '平行' ? [200, 70] : [200, 100], d1, '#2563eb')}
                                {line(rel === '平行' ? [200, 135] : [200, 100], d2, '#ea580c')}
                            </g>
                        </svg>
                    ),
                    q: '这两条直线是什么关系？',
                    options: ['互相平行', '互相垂直', '相交（不垂直）'],
                    answer: rel === '平行' ? '互相平行' : (rel === '垂直' ? '互相垂直' : '相交（不垂直）'),
                    why: rel === '平行' ? '方向一样，延长也不会相交' : `相交成 ${Math.abs(d2 - d1)}°`,
                };
            },
            // 拼角计算
            () => {
                const a = pick([30, 45, 60, 90]), b = pick([30, 45, 60, 90]);
                const v = [200, 165], R = 115;
                return {
                    render: () => (
                        <svg viewBox="0 0 400 200" className="w-full max-w-sm mx-auto">
                            <path d={wedgePath(v[0], v[1], R, 0, a)} fill="#0ea5e9" opacity="0.3" stroke="#0ea5e9" strokeWidth="2" />
                            <path d={wedgePath(v[0], v[1], R, a, a + b)} fill="#f59e0b" opacity="0.3" stroke="#f59e0b" strokeWidth="2" />
                            <text x={along(v, a / 2, 70)[0]} y={along(v, a / 2, 70)[1] + 5} textAnchor="middle" className="text-sm font-bold" fill="#0284c7">{a}°</text>
                            <text x={along(v, a + b / 2, 70)[0]} y={along(v, a + b / 2, 70)[1] + 5} textAnchor="middle" className="text-sm font-bold" fill="#d97706">{b}°</text>
                            <circle cx={v[0]} cy={v[1]} r="6" fill="#1e293b" />
                        </svg>
                    ),
                    q: '拼成的大角是多少度？',
                    options: shuffled([...new Set([a + b, a + b + 15, Math.max(15, a + b - 15), a + b + 30])].slice(0, 4)).map((x) => x + '°'),
                    answer: (a + b) + '°', why: `${a}° + ${b}° = ${a + b}°`,
                };
            },
            // 量角器读数（内外圈陷阱）
            () => {
                const t = pick([30, 40, 50, 60, 70, 110, 120, 130, 140, 150]);
                const flip = Math.random() < 0.5;                 // 边压在外圈的 0 上
                const v = [200, 168], R = 150;
                const baseDeg = flip ? 180 : 0;
                const otherT = flip ? 180 - t : t;
                return {
                    render: () => (
                        <svg viewBox="0 0 400 200" className="w-full max-w-lg mx-auto">
                            <line x1={v[0]} y1={v[1]} x2={along(v, baseDeg, R + 18)[0]} y2={along(v, baseDeg, R + 18)[1]}
                                stroke="#ea580c" strokeWidth="5" strokeLinecap="round" />
                            <line x1={v[0]} y1={v[1]} x2={along(v, otherT, R + 18)[0]} y2={along(v, otherT, R + 18)[1]}
                                stroke="#ea580c" strokeWidth="5" strokeLinecap="round" />
                            <ProtractorShape c={v} rot={0} R={R} />
                            <circle cx={v[0]} cy={v[1]} r="5" fill="#7c2d12" />
                        </svg>
                    ),
                    q: '量角器上这个角是多少度？',
                    options: shuffled([t + '°', (180 - t) + '°', (t + 10) + '°', Math.abs(t - 20) + '°']).slice(0, 4),
                    answer: t + '°',
                    why: flip ? '这条边压在外圈的 0 上，要读外圈' : '这条边压在内圈的 0 上，要读内圈',
                };
            },
            // 点到直线的距离
            () => {
                const p = [200, 55];
                const feet = [[110, 155], [200, 155], [285, 155]];
                return {
                    render: () => (
                        <svg viewBox="0 0 400 200" className="w-full max-w-sm mx-auto">
                            <line x1="30" y1="155" x2="370" y2="155" stroke="#334155" strokeWidth="4" />
                            {feet.map((f, i) => (
                                <g key={i}>
                                    <line x1={p[0]} y1={p[1]} x2={f[0]} y2={f[1]} stroke={['#f97316', '#059669', '#8b5cf6'][i]} strokeWidth="3.5" />
                                    <text x={(p[0] + f[0]) / 2 + (i === 1 ? 14 : 0)} y={(p[1] + f[1]) / 2} className="text-sm font-bold"
                                        fill={['#f97316', '#059669', '#8b5cf6'][i]}>{['①', '②', '③'][i]}</text>
                                </g>
                            ))}
                            <circle cx={p[0]} cy={p[1]} r="6" fill="#1e293b" />
                            <text x={p[0] - 18} y={p[1] - 8} className="text-sm font-bold" fill="#1e293b">P</text>
                        </svg>
                    ),
                    q: '哪一条才是点 P 到这条直线的距离？',
                    options: ['①', '②', '③', '一样长'], answer: '②',
                    why: '只有②和直线垂直，垂线段最短，它的长度才叫距离',
                };
            },
            // 角的换算
            () => {
                const q = pick([
                    { q: '1 个平角等于几个直角？', options: ['2 个', '3 个', '4 个', '1 个'], answer: '2 个', why: '180° ÷ 90° = 2' },
                    { q: '1 个周角等于几个平角？', options: ['2 个', '3 个', '4 个', '6 个'], answer: '2 个', why: '360° ÷ 180° = 2' },
                    { q: '1 个周角等于几个直角？', options: ['4 个', '2 个', '3 个', '6 个'], answer: '4 个', why: '360° ÷ 90° = 4' },
                    { q: '把角的两条边都画长一倍，角会怎样？', options: ['不变', '变大一倍', '变小', '说不准'], answer: '不变', why: '角的大小只看张开的程度' },
                    { q: '过一点能画多少条直线？', options: ['无数条', '1 条', '2 条', '4 条'], answer: '无数条', why: '只有一个点定不住方向' },
                    { q: '过两点能画多少条直线？', options: ['1 条', '2 条', '无数条', '不能画'], answer: '1 条', why: '两点确定一条直线' },
                ]);
                return { render: () => (
                    <svg viewBox="0 0 400 120" className="w-full max-w-sm mx-auto">
                        <text x="200" y="70" textAnchor="middle" fontSize="46">🤔</text>
                    </svg>
                ), ...q };
            },
        ];

        const makeQuestion = () => pick(QTYPES)();

        const Quiz = () => {
            const [q, setQ] = useState(makeQuestion);
            const [chosen, setChosen] = useState(null);
            const [score, setScore] = useState({ right: 0, total: 0 });

            const options = useMemo(() => shuffled(q.options), [q]);
            const choose = (o) => {
                if (chosen) return;
                setChosen(o);
                setScore((s) => ({ right: s.right + (o === q.answer ? 1 : 0), total: s.total + 1 }));
            };
            const next = () => { setQ(makeQuestion()); setChosen(null); };

            return (
                <div className="fade-in space-y-4">
                    <Card>
                        <div className="bg-slate-50 rounded-xl py-4">{q.render()}</div>
                        <p className="text-center text-lg font-bold text-slate-700 mt-4">{q.q}</p>
                        <div className="grid grid-cols-2 gap-3 mt-4">
                            {options.map((o) => {
                                const isAns = o === q.answer;
                                const cls = !chosen ? "bg-white border-slate-200 text-slate-600 hover:border-blue-300 hover:bg-blue-50"
                                    : isAns ? "bg-emerald-500 border-emerald-500 text-white"
                                    : (o === chosen ? "bg-rose-100 border-rose-300 text-rose-600" : "bg-white border-slate-200 text-slate-300");
                                return (
                                    <button key={o} onClick={() => choose(o)}
                                        className={"px-4 py-3 rounded-xl border-2 font-bold smooth-transition " + cls}>{o}</button>
                                );
                            })}
                        </div>
                        {chosen && (
                            <div className="mt-4 flex flex-col items-center gap-3 fade-in">
                                <div className={"font-bold text-lg " + (chosen === q.answer ? "text-emerald-600" : "text-rose-500")}>
                                    {chosen === q.answer ? '✓ 答对了' : `✗ 答案是 ${q.answer}`}
                                </div>
                                {q.why && <div className="text-sm text-slate-500">{q.why}</div>}
                                <button onClick={next}
                                    className="px-6 py-2.5 rounded-xl bg-slate-700 text-white font-bold hover:bg-slate-800 smooth-transition">
                                    下一题 →
                                </button>
                            </div>
                        )}
                    </Card>
                    <p className="text-center text-slate-500 font-bold">答对 {score.right} / {score.total}</p>
                </div>
            );
        };

        // ===========================================================
        // 应用外壳
        // ===========================================================
        const App = () => {
            const [tab, setTab] = useState('lines');
            const tabs = [
                ['lines', '线', 'bg-blue-500'],
                ['angle', '认识角', 'bg-emerald-500'],
                ['protractor', '量角器', 'bg-teal-600'],
                ['compare', '比一比', 'bg-amber-500'],
                ['build', '拼角', 'bg-violet-500'],
                ['perp', '平行与垂直', 'bg-cyan-600'],
                ['shape', '图形里的角', 'bg-sky-600'],
                ['quiz', '判一判', 'bg-rose-500'],
            ];
            return (
                <div className="min-h-screen py-8 px-4">
                    <header className="relative max-w-4xl mx-auto text-center mb-8 px-12">
                        <a href="/" aria-label="返回主页" title="返回主页" className="absolute left-0 top-0 inline-flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-500 shadow-sm transition hover:border-blue-200 hover:bg-blue-50 hover:text-blue-600">
                            <svg className="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                                <polyline points="9 22 9 12 15 12 15 22" />
                            </svg>
                        </a>
                        <h1 className="text-3xl font-bold text-slate-800">几何基础概念</h1>
                        <p className="text-slate-500 mt-1">线、角、量角器、平行与垂直 —— 动手拖一拖就懂</p>
                    </header>

                    <div className="flex justify-center gap-2 mb-8 flex-wrap max-w-3xl mx-auto">
                        {tabs.map(([key, label, color]) => (
                            <button key={key} onClick={() => setTab(key)}
                                className={"px-5 py-2.5 rounded-full font-bold smooth-transition " +
                                    (tab === key ? color + " text-white shadow" : "bg-white text-slate-500 hover:bg-slate-100")}>
                                {label}
                            </button>
                        ))}
                    </div>

                    <div className="max-w-3xl mx-auto">
                        {tab === 'lines' && <Lines />}
                        {tab === 'angle' && <AngleIntro />}
                        {tab === 'protractor' && <ProtractorTool />}
                        {tab === 'compare' && <CompareAngles />}
                        {tab === 'build' && <BuildAngle />}
                        {tab === 'perp' && <PerpParallel />}
                        {tab === 'shape' && <ShapeAngles />}
                        {tab === 'quiz' && <Quiz />}
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <div class="site-copyright" style="box-sizing: border-box; width: 100%; padding: 24px 16px; text-align: center; color: #94a3b8; font: 13px/1.6 system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">©孙维刚教育研究院 小宇老师 版权所有</div>
</body>
</html>
