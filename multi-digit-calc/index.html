<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多位数乘法竖式实验室 | Math101</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f3f4f6; margin: 0; padding: 0; }
        .fade-in { animation: fadeIn 0.45s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .smooth-transition { transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
        .pop { animation: pop 0.4s ease; }
        @keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 60% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }
        .col-grid { font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
        .cell { display: inline-block; width: 1.15em; text-align: center; }
    </style>
    <link rel="stylesheet" href="../ipad-touch-adapter.css">
    <script src="../ipad-touch-adapter.js" defer></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        /* ============ 通用小组件 ============ */

        const Card = ({ children, className = '' }) => (
            <div className={"bg-white rounded-xl shadow p-5 " + className}>{children}</div>
        );

        const Hint = ({ tone = 'amber', children }) => {
            const map = {
                amber: 'bg-amber-50 border-amber-200 text-amber-800',
                sky: 'bg-sky-50 border-sky-200 text-sky-800',
                emerald: 'bg-emerald-50 border-emerald-200 text-emerald-800',
                rose: 'bg-rose-50 border-rose-200 text-rose-800',
            };
            return <div className={"px-4 py-2.5 border rounded-lg text-sm leading-relaxed " + map[tone]}>{children}</div>;
        };

        const StepBar = ({ step, maxStep, labels, onReset, onNext, color = 'indigo' }) => {
            const btn = {
                indigo: 'bg-indigo-500 hover:bg-indigo-600',
                emerald: 'bg-emerald-500 hover:bg-emerald-600',
                rose: 'bg-rose-500 hover:bg-rose-600',
            }[color];
            return (
                <div className="flex flex-col items-center gap-3 mt-6">
                    <div className="text-slate-600 font-semibold text-center min-h-[1.5rem] px-4">{labels[step]}</div>
                    <div className="flex gap-3">
                        <button onClick={onReset} disabled={step === 0}
                            className="px-5 py-2.5 rounded-lg font-semibold smooth-transition bg-slate-100 hover:bg-slate-200 disabled:opacity-40 text-slate-700">重来</button>
                        <button onClick={onNext} disabled={step === maxStep}
                            className={"px-6 py-2.5 rounded-lg font-semibold smooth-transition text-white disabled:opacity-40 " + btn}>
                            {step === maxStep ? '已完成' : '下一步'}
                        </button>
                    </div>
                </div>
            );
        };

        // 注意：Tailwind CDN 不能识别拼接出来的类名，这里用查表写全。
        const INPUT_BORDER = { indigo: 'border-indigo-300', emerald: 'border-emerald-300' };

        const NumberInput = ({ label, value, min, max, onChange, color = 'indigo' }) => (
            <div className="flex items-center gap-2">
                <label className="font-semibold text-slate-700 text-sm">{label}</label>
                <input type="number" min={min} max={max} value={value}
                    onChange={e => {
                        const raw = e.target.value;
                        if (raw === '') { onChange(min); return; }
                        onChange(Math.max(min, Math.min(max, Number(raw))));
                    }}
                    className={"w-24 text-center text-lg border-2 rounded p-1.5 " + INPUT_BORDER[color]} />
            </div>
        );

        // 竖式里一行数字：按数位右对齐排列，可逐位高亮
        const DigitRow = ({ text, width, highlight = [], className = '', prefix = '' }) => {
            const chars = String(text).split('');
            const pad = Math.max(0, width - chars.length);
            return (
                <div className={"whitespace-nowrap " + className}>
                    <span className="cell text-slate-400">{prefix}</span>
                    {Array.from({ length: pad }).map((_, i) => <span key={'p' + i} className="cell">&nbsp;</span>)}
                    {chars.map((c, i) => {
                        const place = chars.length - 1 - i; // 该字符所在数位（0=个位）
                        const hi = highlight.includes(place);
                        return <span key={i} className={"cell " + (hi ? "text-rose-600 font-bold" : "")}>{c}</span>;
                    })}
                </div>
            );
        };

        /* ============ 1. 口算迁移：整十整百 ============ */

        const OralTab = () => {
            const [base, setBase] = useState(3);   // 一位数因数
            const [zeros, setZeros] = useState(2); // 另一个因数末尾 0 的个数
            const [lead, setLead] = useState(4);   // 另一个因数首位

            const other = lead * Math.pow(10, zeros);
            const core = base * lead;
            const result = base * other;

            const unitName = ['一', '十', '百', '千'][zeros];

            return (
                <div className="fade-in space-y-5">
                    <Card>
                        <div className="flex flex-wrap gap-5 items-center justify-center">
                            <NumberInput label="一位数" value={base} min={2} max={9} onChange={setBase} />
                            <span className="text-2xl font-bold text-slate-400">×</span>
                            <NumberInput label="首位" value={lead} min={1} max={9} onChange={setLead} />
                            <div className="flex items-center gap-2">
                                <label className="font-semibold text-slate-700 text-sm">末尾 0 的个数</label>
                                <select value={zeros} onChange={e => setZeros(Number(e.target.value))}
                                    className="border-2 border-emerald-300 rounded p-1.5 text-lg">
                                    <option value={0}>0 个</option>
                                    <option value={1}>1 个（整十）</option>
                                    <option value={2}>2 个（整百）</option>
                                    <option value={3}>3 个（整千）</option>
                                </select>
                            </div>
                        </div>
                    </Card>

                    <Card>
                        <h3 className="font-bold text-slate-800 mb-4 text-center">把大数看成"几个计数单位"</h3>
                        <div className="text-center space-y-3">
                            <div className="text-3xl font-bold text-slate-800 col-grid">
                                {base} × {other} = ?
                            </div>
                            <div className="text-slate-500">↓ {other} 就是 {lead} 个 {Math.pow(10, zeros)}</div>
                            <div className="text-2xl text-slate-700 col-grid">
                                {base} × <span className="text-emerald-600 font-bold">{lead}</span> 个 <span className="text-sky-600 font-bold">{Math.pow(10, zeros)}</span>
                            </div>
                            <div className="text-slate-500">↓ 先算口诀，再数计数单位</div>
                            <div className="text-2xl text-slate-700 col-grid">
                                = <span className="text-emerald-600 font-bold">{core}</span> 个 <span className="text-sky-600 font-bold">{Math.pow(10, zeros)}</span>
                            </div>
                            <div className="text-4xl font-bold text-rose-600 col-grid pt-2">
                                = {result}
                            </div>
                        </div>
                    </Card>

                    <Hint tone="sky">
                        <b>口算规律：</b>先用口诀算出 {base} × {lead} = {core}，
                        再在积的末尾添上 <b>{zeros}</b> 个 0。
                        因为算的是"{core} 个{unitName}"，计数单位是{unitName}，末尾的 0 就是数位的标记。
                    </Hint>
                    <Hint tone="amber">
                        <b>易错提醒：</b>添 0 的个数只看<b>因数末尾</b>的 0，口诀积里本身的 0 是算出来的，两者都要写。
                        比如 5 × 400：口诀 5 × 4 = <b>20</b> 末尾已经有一个 0，再添因数的 <b>2</b> 个 0，
                        结果是 2000（三个 0），不是 200。
                    </Hint>
                </div>
            );
        };

        /* ============ 2. 分解运算：拆成"整十"和"几个" ============ */

        const DecomposeTab = () => {
            const [a, setA] = useState(12);   // 每份数
            const [b, setB] = useState(7);    // 份数
            const [step, setStep] = useState(0);

            const tens = Math.floor(a / 10);      // 整十里有几组十
            const ones = a % 10;
            const tenPart = tens * 10;            // 例：12 → 10
            const pTen = tenPart * b;             // 10 × 7 = 70
            const pOne = ones * b;                // 2 × 7 = 14
            const total = a * b;

            // 0 摆点 / 1 拆开 / 2 算个位那堆 / 3 算整十那堆 / 4 合起来
            const MAX = 4;
            const labels = [
                `先把题目摆出来：${b} 行，每行 ${a} 个，一共多少个？`,
                `每行 ${a} 个 = ${tenPart} 个 ＋ ${ones} 个，把两堆分开`,
                `先数右边小堆：每行 ${ones} 个，${b} 行 → ${ones} × ${b} = ${pOne}`,
                `再数左边大堆：每行 ${tenPart} 个，${b} 行 → ${tenPart} × ${b} = ${pTen}`,
                `两堆合起来：${pOne} ＋ ${pTen} = ${total}`,
            ];

            // 点太多时把点画小一些，保证一屏放得下
            const dotSize = a > 15 || b > 8 ? '7px' : '10px';
            const dotStyle = { width: dotSize, height: dotSize };

            // step 0 时全是一样的灰蓝点，看不出哪些该分到哪堆；拆开后才染成两色
            const Dot = ({ tone }) => (
                <span className={"rounded-full inline-block smooth-transition " +
                    (step === 0 ? 'bg-slate-400' : tone === 'sky' ? 'bg-sky-500' : 'bg-amber-500')}
                    style={dotStyle} />
            );

            const gap = step >= 1 ? 44 : 0;

            const randomize = () => {
                setA(11 + Math.floor(Math.random() * 8));       // 11~18，先守住"十几"
                setB(2 + Math.floor(Math.random() * 8));
                setStep(0);
            };

            // 整十数（20、30…）本身就是整十口算，拆成"20 和 0"没有意义，
            // 这里直接引导回上一个标签页，不画空堆。
            if (ones === 0) {
                return (
                    <div className="fade-in space-y-5">
                        <Card>
                            <div className="flex flex-wrap gap-5 items-center justify-center">
                                <NumberInput label="每份数" value={a} min={11} max={29} onChange={v => { setA(v); setStep(0); }} />
                                <span className="text-2xl font-bold text-slate-400">×</span>
                                <NumberInput label="份数" value={b} min={2} max={9} onChange={v => { setB(v); setStep(0); }} color="emerald" />
                                <button onClick={randomize}
                                    className="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg font-semibold text-slate-700 smooth-transition">换一题</button>
                            </div>
                        </Card>
                        <Hint tone="sky">
                            {a} 是<b>整十数</b>，本来就只有"{tens} 个十"这一堆，用不着再拆。
                            {a} × {b} 直接口算：{tens} × {b} = {tens * b}，所以是 {tens * b} 个十 = <b>{total}</b>。
                            想看拆分，把每份数改成 12、23 这样<b>末尾不是 0</b> 的数。
                        </Hint>
                    </div>
                );
            }

            return (
                <div className="fade-in space-y-5">
                    <Card>
                        <div className="flex flex-wrap gap-5 items-center justify-center">
                            <NumberInput label="每份数" value={a} min={11} max={29} onChange={v => { setA(v); setStep(0); }} />
                            <span className="text-2xl font-bold text-slate-400">×</span>
                            <NumberInput label="份数" value={b} min={2} max={9} onChange={v => { setB(v); setStep(0); }} color="emerald" />
                            <button onClick={randomize}
                                className="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg font-semibold text-slate-700 smooth-transition">换一题</button>
                        </div>
                        <p className="text-center text-sm text-slate-500 mt-3">
                            {b} 行，每行 {a} 个 —— 一行一行地数太慢了，看看能不能拆开来算。
                        </p>
                    </Card>

                    <div className="grid lg:grid-cols-2 gap-5">
                        {/* 点阵：拆的动作发生在这里 */}
                        <Card>
                            <h3 className="font-bold text-slate-800 mb-4 text-center">
                                {step === 0 ? `${b} 行，每行 ${a} 个` : `分成两堆来数`}
                            </h3>

                            {/* 分堆后的顶部标签 */}
                            <div className={"flex justify-center mb-2 smooth-transition " + (step >= 1 ? "opacity-100" : "opacity-0")}>
                                <div className="flex items-start" style={{ gap: '10px' }}>
                                    <div className="text-center font-bold text-sky-700 text-sm"
                                        style={{ width: tens * (10 * (parseInt(dotSize) + 2) + 8) }}>
                                        每行 {tenPart} 个
                                    </div>
                                    <div style={{ width: gap }} />
                                    <div className="text-center font-bold text-amber-700 text-sm"
                                        style={{ width: ones * (parseInt(dotSize) + 2) + 8 }}>
                                        每行 {ones} 个
                                    </div>
                                </div>
                            </div>

                            <div className="flex justify-center overflow-x-auto pb-2">
                                <div className="space-y-1.5">
                                    {Array.from({ length: b }).map((_, r) => (
                                        <div key={r} className="flex items-center" style={{ gap: step >= 1 ? '10px' : '2px' }}>
                                            <span className="text-xs text-slate-400 w-10 text-right pr-1 mr-2">第{r + 1}行</span>
                                            {/* 整十部分 */}
                                            <div className="flex" style={{ gap: step >= 1 ? '4px' : '2px' }}>
                                                {Array.from({ length: tens }).map((_, g) => (
                                                    <div key={g}
                                                        className={"flex rounded py-0.5 smooth-transition " +
                                                            (step >= 1 ? "px-1 " : "px-0 ") +
                                                            (step === 3 ? "bg-sky-100 ring-2 ring-sky-400"
                                                                : step >= 1 ? "bg-sky-50" : "")}
                                                        style={{ gap: '2px' }}>
                                                        {Array.from({ length: 10 }).map((_, i) => <Dot key={i} tone="sky" />)}
                                                    </div>
                                                ))}
                                            </div>
                                            {/* 拆开的空隙 */}
                                            <div className="smooth-transition" style={{ width: gap }} />
                                            {/* 个位部分 */}
                                            <div className={"flex rounded py-0.5 smooth-transition " +
                                                (step >= 1 ? "px-1 " : "px-0 ") +
                                                (step === 2 ? "bg-amber-100 ring-2 ring-amber-400"
                                                    : step >= 1 ? "bg-amber-50" : "")}
                                                style={{ gap: '2px' }}>
                                                {Array.from({ length: ones }).map((_, i) => <Dot key={i} tone="amber" />)}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* 每堆下方的小计 */}
                            <div className={"flex justify-center mt-3 smooth-transition " + (step >= 2 ? "opacity-100" : "opacity-0")}>
                                <div className="flex items-start" style={{ gap: '10px' }}>
                                    <div className="text-center" style={{ width: tens * (10 * (parseInt(dotSize) + 2) + 8) }}>
                                        {step >= 3 && <div className="text-sky-700 font-bold pop">{tenPart} × {b} = {pTen}</div>}
                                    </div>
                                    <div style={{ width: gap }} />
                                    <div className="text-center" style={{ width: ones * (parseInt(dotSize) + 2) + 8 }}>
                                        {step >= 2 && <div className="text-amber-700 font-bold pop whitespace-nowrap">{ones} × {b} = {pOne}</div>}
                                    </div>
                                </div>
                            </div>
                        </Card>

                        {/* 算式：和点阵一步一步对上 */}
                        <Card>
                            <h3 className="font-bold text-slate-800 mb-4 text-center">算式跟着一起拆</h3>
                            <div className="col-grid text-xl space-y-3">
                                <div className="text-slate-800 font-bold text-2xl text-center">{a} × {b}</div>

                                <div className={"text-center smooth-transition " + (step >= 1 ? "opacity-100" : "opacity-0")}>
                                    <div className="text-slate-400 text-sm mb-1">↓ 把 {a} 拆成 {tenPart} 和 {ones}</div>
                                    <div>
                                        = (<span className="text-sky-600 font-bold">{tenPart}</span>
                                        ＋<span className="text-amber-600 font-bold">{ones}</span>) × {b}
                                    </div>
                                </div>

                                <div className="space-y-2 pt-1">
                                    <div className={"px-3 py-2.5 rounded-lg border smooth-transition " +
                                        (step === 2 ? "bg-amber-50 border-amber-300 pop" : step > 2 ? "bg-amber-50/60 border-amber-200" : "bg-white border-dashed border-slate-200")}>
                                        <div className={"text-sm " + (step >= 2 ? "text-slate-500" : "text-slate-300")}>先算小堆（每行剩下的 {ones} 个）</div>
                                        <div className={"font-bold text-2xl " + (step >= 2 ? "text-amber-700" : "text-slate-300")}>
                                            {ones} × {b} = {step >= 2 ? pOne : '?'}
                                        </div>
                                    </div>
                                    <div className={"px-3 py-2.5 rounded-lg border smooth-transition " +
                                        (step === 3 ? "bg-sky-50 border-sky-300 pop" : step > 3 ? "bg-sky-50/60 border-sky-200" : "bg-white border-dashed border-slate-200")}>
                                        <div className={"text-sm " + (step >= 3 ? "text-slate-500" : "text-slate-300")}>再算大堆（每行的 {tenPart} 个）</div>
                                        <div className={"font-bold text-2xl " + (step >= 3 ? "text-sky-700" : "text-slate-300")}>
                                            {tenPart} × {b} = {step >= 3 ? pTen : '?'}
                                        </div>
                                        {step >= 3 && (
                                            <div className="text-xs text-slate-500 mt-1">
                                                {tens === 1
                                                    ? <>{tenPart} × {b} 就是 {b} 个十 = {pTen}</>
                                                    : <>先用口诀 {tens} × {b} = {tens * b}，得到 {tens * b} 个十 = {pTen}</>}
                                            </div>
                                        )}
                                    </div>
                                    <div className={"px-3 py-2.5 rounded-lg border smooth-transition " +
                                        (step >= 4 ? "bg-rose-50 border-rose-300 pop" : "bg-white border-dashed border-slate-200")}>
                                        <div className={"text-sm " + (step >= 4 ? "text-slate-500" : "text-slate-300")}>两堆合起来</div>
                                        <div className={"font-bold text-2xl " + (step >= 4 ? "text-rose-600" : "text-slate-300")}>
                                            {step >= 2 ? pOne : '?'} ＋ {step >= 3 ? pTen : '?'} = {step >= 4 ? total : '?'}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {step >= 4 && (
                                <div className="mt-4 pop">
                                    <Hint tone="emerald">
                                        <b>{a} × {b} = {total}</b>。一堆点，拆成两堆分开数，再加起来，个数一个也没多、一个也没少 ——
                                        所以拆开算的结果和整块数出来的一样。
                                    </Hint>
                                </div>
                            )}
                        </Card>
                    </div>

                    {step === 0 ? (
                        <Hint tone="sky">
                            {b} × {a} 这样的口诀我们没背过，一个一个数又太慢。
                            想一想：每行的 {a} 个，能不能<b>先凑出整十</b>，剩下的几个另算？点"下一步"看看。
                        </Hint>
                    ) : (
                        <>
                            <Hint tone="sky">
                                <b>为什么要拆？</b>因为 {a} × {b} 我们没背过口诀，但拆开以后的 {ones} × {b} 和 {tenPart} × {b} 都会算：
                                一个用口诀，一个是整十数口算。<b>把不会的变成两个会的</b>，这就是多位数乘法的全部秘密。
                            </Hint>
                            <Hint tone="amber">
                                <b>只拆一个因数：</b>{b} 是"份数"，一直没动过，始终是 {b} 行。
                                拆的是"每份数"{a}，两小堆的份数都还是 {b}，所以是 {ones} × {b} 和 {tenPart} × {b}，
                                不是把 {b} 也拆开。
                            </Hint>
                        </>
                    )}

                    <StepBar step={step} maxStep={MAX} labels={labels}
                        onReset={() => setStep(0)} onNext={() => setStep(s => Math.min(MAX, s + 1))} />
                </div>
            );
        };

        /* ============ 3. 面积模型：理解含义与分拆 ============ */

        const AreaTab = () => {
            const [a, setA] = useState(23);
            const [b, setB] = useState(14);
            const [split, setSplit] = useState(true);

            const aT = Math.floor(a / 10) * 10, aO = a % 10;
            const bT = Math.floor(b / 10) * 10, bO = b % 10;

            const parts = [
                { r: aT, c: bT, color: 'bg-indigo-200 border-indigo-400', text: 'text-indigo-800' },
                { r: aO, c: bT, color: 'bg-sky-200 border-sky-400', text: 'text-sky-800' },
                { r: aT, c: bO, color: 'bg-emerald-200 border-emerald-400', text: 'text-emerald-800' },
                { r: aO, c: bO, color: 'bg-amber-200 border-amber-400', text: 'text-amber-800' },
            ].filter(p => p.r > 0 && p.c > 0);

            // 用比例控制矩形宽高，最小给一点宽度以免看不见
            const W = 360, H = 260;
            const colW = (v) => Math.max(28, (v / b) * W);
            const rowH = (v) => Math.max(28, (v / a) * H);

            return (
                <div className="fade-in space-y-5">
                    <Card>
                        <div className="flex flex-wrap gap-5 items-center justify-center">
                            <NumberInput label="每份数" value={a} min={11} max={99} onChange={setA} />
                            <span className="text-2xl font-bold text-slate-400">×</span>
                            <NumberInput label="份数" value={b} min={2} max={99} onChange={setB} color="emerald" />
                            <button onClick={() => setSplit(s => !s)}
                                className="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg font-semibold text-slate-700 smooth-transition">
                                {split ? '合并成整块' : '按数位拆开'}
                            </button>
                        </div>
                    </Card>

                    <Card>
                        <h3 className="font-bold text-slate-800 mb-1 text-center">{a} × {b} 的面积模型</h3>
                        <p className="text-slate-500 text-sm text-center mb-4">长方形的面积就是"{a} 个 {b}"，把边长按数位拆开，大长方形就分成几小块。</p>

                        <div className="flex justify-center overflow-x-auto pb-2">
                            <div className="inline-block">
                                {/* 顶部列标签 */}
                                <div className="flex ml-14">
                                    {split
                                        ? [bT, bO].filter(v => v > 0).map((v, i) => (
                                            <div key={i} style={{ width: colW(v) }} className="text-center font-bold text-slate-600 text-sm pb-1">{v}</div>
                                        ))
                                        : <div style={{ width: W }} className="text-center font-bold text-slate-600 text-sm pb-1">{b}</div>}
                                </div>

                                <div className="flex">
                                    {/* 左侧行标签 */}
                                    <div className="w-14 flex flex-col justify-center">
                                        {split
                                            ? [aT, aO].filter(v => v > 0).map((v, i) => (
                                                <div key={i} style={{ height: rowH(v) }} className="flex items-center justify-end pr-2 font-bold text-slate-600 text-sm">{v}</div>
                                            ))
                                            : <div style={{ height: H }} className="flex items-center justify-end pr-2 font-bold text-slate-600 text-sm">{a}</div>}
                                    </div>

                                    {/* 矩形本体 */}
                                    <div>
                                        {split
                                            ? [aT, aO].filter(v => v > 0).map((rv, ri) => (
                                                <div key={ri} className="flex">
                                                    {[bT, bO].filter(v => v > 0).map((cv, ci) => {
                                                        const p = parts.find(x => x.r === rv && x.c === cv);
                                                        return (
                                                            <div key={ci}
                                                                style={{ width: colW(cv), height: rowH(rv) }}
                                                                className={"border-2 flex flex-col items-center justify-center smooth-transition " + p.color}>
                                                                <div className={"text-xs " + p.text}>{rv}×{cv}</div>
                                                                <div className={"font-bold " + p.text}>{rv * cv}</div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            ))
                                            : (
                                                <div style={{ width: W, height: H }}
                                                    className="border-2 border-indigo-400 bg-indigo-200 flex flex-col items-center justify-center smooth-transition">
                                                    <div className="text-indigo-800">{a} × {b}</div>
                                                    <div className="text-3xl font-bold text-indigo-800">{a * b}</div>
                                                </div>
                                            )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </Card>

                    {split && (
                        <Card>
                            <h3 className="font-bold text-slate-800 mb-3">拆开算，再合起来</h3>
                            <div className="col-grid text-lg space-y-1.5">
                                {parts.map((p, i) => (
                                    <div key={i} className="flex items-center gap-2">
                                        <span className={"inline-block w-4 h-4 rounded border-2 " + p.color} />
                                        <span className="text-slate-700">{p.r} × {p.c} = <b className={p.text}>{p.r * p.c}</b></span>
                                    </div>
                                ))}
                                <div className="border-t pt-2 mt-2 text-slate-800">
                                    合计：{parts.map(p => p.r * p.c).join(' + ')} = <b className="text-rose-600 text-2xl">{a * b}</b>
                                </div>
                            </div>
                            <div className="mt-4">
                                <Hint tone="emerald">
                                    这就是<b>乘法分配律</b>：({aT}{aO > 0 ? ' + ' + aO : ''}) × ({bT}{bO > 0 ? ' + ' + bO : ''})，
                                    每一小块都要算，一块都不能漏。竖式的每一层部分积，就是这里的小块合并起来。
                                </Hint>
                            </div>
                        </Card>
                    )}
                </div>
            );
        };

        /* ============ 4. 多位数 × 一位数 竖式 ============ */

        const buildOneDigitSteps = (a, b) => {
            const digits = String(a).split('').reverse().map(Number); // 个位起
            const steps = [];
            let carry = 0;
            const partial = [];  // 每位写下的数字（个位起）
            const carries = [];  // 每位产生的进位
            digits.forEach((d, i) => {
                const prod = d * b + carry;
                const write = prod % 10;
                const newCarry = Math.floor(prod / 10);
                steps.push({
                    place: i, digit: d, carryIn: carry, prod, write, carryOut: newCarry,
                    snapshotWrite: [...partial, write],
                    snapshotCarry: [...carries, newCarry],
                });
                partial.push(write);
                carries.push(newCarry);
                carry = newCarry;
            });
            if (carry > 0) {
                steps.push({
                    place: digits.length, digit: null, carryIn: carry, prod: carry, write: carry, carryOut: 0,
                    finalCarry: true,
                    snapshotWrite: [...partial, carry],
                    snapshotCarry: [...carries],
                });
            }
            return steps;
        };

        const placeName = (p) => ['个位', '十位', '百位', '千位', '万位'][p] || `第${p + 1}位`;

        const OneDigitTab = () => {
            const [a, setA] = useState(238);
            const [b, setB] = useState(6);
            const [step, setStep] = useState(0);

            const steps = useMemo(() => buildOneDigitSteps(a, b), [a, b]);
            const total = a * b;
            const width = String(total).length;

            // step 0 = 只列竖式；step k (1..steps.length) = 完成第 k 位
            const done = Math.min(step, steps.length);
            const cur = done > 0 ? steps[done - 1] : null;

            const writtenDigits = cur ? cur.snapshotWrite : [];
            const resultText = writtenDigits.length
                ? writtenDigits.slice().reverse().join('')
                : '';

            const carryMarks = cur ? cur.snapshotCarry : [];

            const labels = ['列竖式：相同数位对齐，一位数写在个位下面',
                ...steps.map(s => s.finalCarry
                    ? `最后的进位 ${s.carryIn} 直接写在${placeName(s.place)}`
                    : `${b} × ${placeName(s.place)}上的 ${s.digit} = ${s.digit * b}${s.carryIn ? `，加上进位 ${s.carryIn} 得 ${s.prod}` : ''}，${placeName(s.place)}写 ${s.write}${s.carryOut ? `，向前进 ${s.carryOut}` : ''}`)];

            const randomize = () => {
                const na = 102 + Math.floor(Math.random() * 897);
                const nb = 2 + Math.floor(Math.random() * 8);
                setA(na); setB(nb); setStep(0);
            };

            return (
                <div className="fade-in space-y-5">
                    <Card>
                        <div className="flex flex-wrap gap-5 items-center justify-center">
                            <NumberInput label="多位数" value={a} min={10} max={9999} onChange={v => { setA(v); setStep(0); }} />
                            <span className="text-2xl font-bold text-slate-400">×</span>
                            <NumberInput label="一位数" value={b} min={2} max={9} onChange={v => { setB(v); setStep(0); }} color="emerald" />
                            <button onClick={randomize}
                                className="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg font-semibold text-slate-700 smooth-transition">换一题</button>
                        </div>
                    </Card>

                    <div className="grid md:grid-cols-2 gap-5">
                        <Card>
                            <h3 className="font-bold text-slate-800 mb-4 text-center">竖式</h3>
                            <div className="col-grid text-3xl leading-snug text-slate-800 flex justify-center">
                                <div>
                                    {/* 进位标记行 */}
                                    <div className="h-6 text-base whitespace-nowrap">
                                        <span className="cell">&nbsp;</span>
                                        {Array.from({ length: width }).map((_, i) => {
                                            const place = width - 1 - i;
                                            // 进位标在"下一位"的上方
                                            const c = carryMarks[place - 1];
                                            return <span key={i} className="cell text-rose-500 text-sm align-top">{c ? c : ' '}</span>;
                                        })}
                                    </div>
                                    <DigitRow text={a} width={width} highlight={cur && !cur.finalCarry ? [cur.place] : []} />
                                    <div className="border-b-2 border-slate-700 pb-1">
                                        <DigitRow text={b} width={width} prefix="×" highlight={cur ? [0] : []} />
                                    </div>
                                    <div className="pt-1 font-bold text-rose-600 min-h-[2.5rem]">
                                        {resultText
                                            ? <DigitRow text={resultText} width={width} />
                                            : <span className="text-slate-300 pl-4">?</span>}
                                    </div>
                                </div>
                            </div>
                        </Card>

                        <Card>
                            <h3 className="font-bold text-slate-800 mb-4 text-center">每一步在算什么</h3>
                            <div className="space-y-2">
                                {steps.map((s, i) => {
                                    const active = i === done - 1;
                                    const shown = i < done;
                                    return (
                                        <div key={i}
                                            className={"px-3 py-2 rounded-lg border smooth-transition text-sm " +
                                                (active ? "bg-rose-50 border-rose-300 pop"
                                                    : shown ? "bg-slate-50 border-slate-200 text-slate-600"
                                                        : "bg-white border-dashed border-slate-200 text-slate-300")}>
                                            {s.finalCarry
                                                ? <span>进位 {s.carryIn} 落到{placeName(s.place)}</span>
                                                : <span>
                                                    {b} × {s.digit}（{placeName(s.place)}）= {s.digit * b}
                                                    {s.carryIn > 0 && <> ＋ 进位 {s.carryIn} = {s.prod}</>}
                                                    ，写 <b className="text-rose-600">{s.write}</b>
                                                    {s.carryOut > 0 && <>，进 <b className="text-rose-600">{s.carryOut}</b></>}
                                                </span>}
                                        </div>
                                    );
                                })}
                                {done === steps.length && (
                                    <div className="px-3 py-2 rounded-lg bg-emerald-50 border border-emerald-300 text-emerald-800 font-bold text-center pop">
                                        {a} × {b} = {total}
                                    </div>
                                )}
                            </div>
                        </Card>
                    </div>

                    <Hint tone="amber">
                        <b>关键：</b>一位数要和多位数的<b>每一位</b>都相乘，从个位算起。
                        满十就向前一位进位，进上来的数要<b>加</b>在下一步的积上，不是乘上去。
                    </Hint>

                    <StepBar step={step} maxStep={steps.length} labels={labels}
                        onReset={() => setStep(0)} onNext={() => setStep(s => Math.min(steps.length, s + 1))} />
                </div>
            );
        };

        /* ============ 5. 两位数 × 两位数 竖式（部分积） ============ */

        const TwoDigitTab = () => {
            const [a, setA] = useState(24);
            const [b, setB] = useState(37);
            const [step, setStep] = useState(0);

            const bO = b % 10;
            const bT = Math.floor(b / 10);
            const p1 = a * bO;          // 个位部分积
            const p2 = a * bT;          // 十位部分积（写时左移一位）
            const total = a * b;
            const width = String(total).length + 1;

            // 0 列式 / 1 个位部分积 / 2 十位部分积 / 3 对位说明 / 4 相加得结果
            const labels = [
                '列竖式：两位数的相同数位对齐',
                `第一层：用第二个因数的个位 ${bO} 去乘 ${a}，得 ${p1}，末位对齐个位`,
                `第二层：用十位上的 ${bT} 去乘 ${a}，得 ${p2}，末位要对齐十位`,
                `想清楚为什么左移：十位上的 ${bT} 其实是 ${bT * 10}，${a} × ${bT * 10} = ${p2 * 10}`,
                `把两层部分积相加：${p1} + ${p2 * 10} = ${total}`,
            ];

            const randomize = () => {
                const na = 12 + Math.floor(Math.random() * 87);
                const nb = 12 + Math.floor(Math.random() * 87);
                setA(na); setB(nb); setStep(0);
            };

            return (
                <div className="fade-in space-y-5">
                    <Card>
                        <div className="flex flex-wrap gap-5 items-center justify-center">
                            <NumberInput label="因数一" value={a} min={10} max={99} onChange={v => { setA(v); setStep(0); }} />
                            <span className="text-2xl font-bold text-slate-400">×</span>
                            <NumberInput label="因数二" value={b} min={10} max={99} onChange={v => { setB(v); setStep(0); }} color="emerald" />
                            <button onClick={randomize}
                                className="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg font-semibold text-slate-700 smooth-transition">换一题</button>
                        </div>
                    </Card>

                    <div className="grid md:grid-cols-2 gap-5">
                        <Card>
                            <h3 className="font-bold text-slate-800 mb-4 text-center">竖式</h3>
                            <div className="col-grid text-3xl leading-snug text-slate-800 flex justify-center">
                                <div>
                                    <DigitRow text={a} width={width} highlight={step >= 1 ? [0, 1] : []} className="text-slate-800" />
                                    <div className="border-b-2 border-slate-700 pb-1">
                                        <DigitRow text={b} width={width} prefix="×"
                                            highlight={step === 1 ? [0] : step >= 2 ? [1] : []} />
                                    </div>

                                    {/* 第一层部分积 */}
                                    <div className={"pt-1 " + (step >= 1 ? "" : "opacity-0")}>
                                        <DigitRow text={p1} width={width} className={step === 1 ? "text-rose-600 font-bold pop" : "text-sky-600"} />
                                    </div>

                                    {/* 第二层部分积：整体左移一位 = 右侧补一个空格 */}
                                    <div className={"border-b-2 border-slate-700 pb-1 " + (step >= 2 ? "" : "opacity-0")}>
                                        <DigitRow text={String(p2) + ' '} width={width}
                                            className={step === 2 || step === 3 ? "text-rose-600 font-bold pop" : "text-emerald-600"} />
                                    </div>

                                    <div className="pt-1 font-bold text-rose-600 min-h-[2.5rem]">
                                        {step >= 4
                                            ? <DigitRow text={total} width={width} className="pop" />
                                            : <span className="text-slate-300 pl-6">?</span>}
                                    </div>
                                </div>
                            </div>

                            {step === 3 && (
                                <div className="mt-4">
                                    <Hint tone="rose">
                                        第二层末位空出的那一格不是随手空的：它代表这一层算的是<b>{bT} 个十</b>乘 {a}，
                                        结果 {p2 * 10} 的个位本来就是 0，所以 {p2} 的末位要落在<b>十位</b>上。
                                    </Hint>
                                </div>
                            )}
                        </Card>

                        <Card>
                            <h3 className="font-bold text-slate-800 mb-4 text-center">两层部分积的来历</h3>
                            <div className="space-y-3">
                                <div className={"px-3 py-2.5 rounded-lg border smooth-transition " +
                                    (step >= 1 ? "bg-sky-50 border-sky-300" : "bg-white border-dashed border-slate-200 text-slate-300")}>
                                    <div className="text-sm text-slate-500">第一层（个位 {bO}）</div>
                                    <div className="text-lg text-slate-800 col-grid">{a} × {bO} = <b className="text-sky-700">{p1}</b></div>
                                </div>
                                <div className={"px-3 py-2.5 rounded-lg border smooth-transition " +
                                    (step >= 2 ? "bg-emerald-50 border-emerald-300" : "bg-white border-dashed border-slate-200 text-slate-300")}>
                                    <div className="text-sm text-slate-500">第二层（十位 {bT}，实际是 {bT * 10}）</div>
                                    <div className="text-lg text-slate-800 col-grid">{a} × {bT * 10} = <b className="text-emerald-700">{p2 * 10}</b></div>
                                    <div className="text-xs text-slate-500 mt-1">竖式里只写 {p2}，靠左移一位表示末尾那个 0</div>
                                </div>
                                <div className={"px-3 py-2.5 rounded-lg border smooth-transition " +
                                    (step >= 4 ? "bg-rose-50 border-rose-300" : "bg-white border-dashed border-slate-200 text-slate-300")}>
                                    <div className="text-sm text-slate-500">相加</div>
                                    <div className="text-lg text-slate-800 col-grid">{p1} + {p2 * 10} = <b className="text-rose-600">{total}</b></div>
                                </div>
                            </div>

                            {/* 与面积模型呼应 */}
                            <div className="mt-4 text-sm text-slate-500 leading-relaxed">
                                对照"面积模型"标签页：第一层是右边窄条，第二层是左边宽条，合起来才是整块面积。
                            </div>
                        </Card>
                    </div>

                    <Hint tone="amber">
                        <b>最常见的错误</b>就是第二层忘记左移一位，把 {p2} 的末位也对到个位上，
                        结果算成 {p1 + p2}。写之前先问自己：这一层是几个十？
                    </Hint>

                    <StepBar step={step} maxStep={4} labels={labels} color="emerald"
                        onReset={() => setStep(0)} onNext={() => setStep(s => Math.min(4, s + 1))} />
                </div>
            );
        };

        /* ============ 6. 末尾有 0 的简便竖式 ============ */

        const ZeroTab = () => {
            const [a, setA] = useState(120);
            const [b, setB] = useState(40);

            const strip = (n) => {
                const s = String(n);
                const m = s.match(/0+$/);
                const z = m ? m[0].length : 0;
                return { core: Number(s.slice(0, s.length - z)) || 0, zeros: z };
            };
            const A = strip(a), B = strip(b);
            const coreProduct = A.core * B.core;
            const totalZeros = A.zeros + B.zeros;
            const total = a * b;
            const width = String(total).length + 1;

            return (
                <div className="fade-in space-y-5">
                    <Card>
                        <div className="flex flex-wrap gap-5 items-center justify-center">
                            <NumberInput label="因数一" value={a} min={10} max={9990} onChange={setA} />
                            <span className="text-2xl font-bold text-slate-400">×</span>
                            <NumberInput label="因数二" value={b} min={10} max={990} onChange={setB} color="emerald" />
                            <button onClick={() => { setA([120, 250, 480, 306, 1200][Math.floor(Math.random() * 5)]); setB([40, 30, 50, 20, 60][Math.floor(Math.random() * 5)]); }}
                                className="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg font-semibold text-slate-700 smooth-transition">换一题</button>
                        </div>
                    </Card>

                    {totalZeros === 0 ? (
                        <Hint tone="amber">这两个因数末尾都没有 0，用不上简便写法。把因数改成 120、40 这样末尾带 0 的数试试。</Hint>
                    ) : (
                        <>
                            <div className="grid md:grid-cols-2 gap-5">
                                <Card>
                                    <h3 className="font-bold text-slate-800 mb-4 text-center">简便竖式：0 先不参与计算</h3>
                                    <div className="col-grid text-3xl leading-snug flex justify-center">
                                        <div>
                                            <div className="whitespace-nowrap">
                                                <span className="cell">&nbsp;</span>
                                                <span className="text-slate-800">{A.core}</span>
                                                <span className="text-rose-400">{'0'.repeat(A.zeros)}</span>
                                            </div>
                                            <div className="border-b-2 border-slate-700 pb-1 whitespace-nowrap">
                                                <span className="cell text-slate-400">×</span>
                                                <span className="text-slate-800">{B.core}</span>
                                                <span className="text-rose-400">{'0'.repeat(B.zeros)}</span>
                                            </div>
                                            <div className="pt-1 whitespace-nowrap font-bold">
                                                <span className="cell">&nbsp;</span>
                                                <span className="text-rose-600">{coreProduct}</span>
                                                <span className="text-rose-400">{'0'.repeat(totalZeros)}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <p className="text-center text-sm text-slate-500 mt-3">
                                        淡红色的 0 只是"跟着落下来"，不参与乘。
                                    </p>
                                </Card>

                                <Card>
                                    <h3 className="font-bold text-slate-800 mb-4 text-center">道理</h3>
                                    <div className="col-grid text-lg text-slate-700 space-y-2">
                                        <div>{a} × {b}</div>
                                        <div>= ({A.core} × {Math.pow(10, A.zeros)}) × ({B.core} × {Math.pow(10, B.zeros)})</div>
                                        <div>= ({A.core} × {B.core}) × {Math.pow(10, totalZeros)}</div>
                                        <div>= {coreProduct} × {Math.pow(10, totalZeros)}</div>
                                        <div className="text-2xl font-bold text-rose-600 pt-1">= {total}</div>
                                    </div>
                                    <div className="mt-4">
                                        <Hint tone="emerald">
                                            用的是<b>乘法交换律和结合律</b>：先把两个因数末尾的 0 提出来，
                                            算完 {A.core} × {B.core} = {coreProduct} 后，再补上 {totalZeros} 个 0。
                                        </Hint>
                                    </div>
                                </Card>
                            </div>

                            <Hint tone="rose">
                                <b>陷阱：</b>如果 {A.core} × {B.core} 的积本身末尾就有 0（比如 5 × 4 = 20），
                                这个 0 是<b>算出来的</b>，要和后面补的 {totalZeros} 个 0 一起写，千万别把它当成补的那部分而少写。
                                本题积是 {coreProduct}，再补 {totalZeros} 个 0，一共 {total}。
                            </Hint>
                        </>
                    )}
                </div>
            );
        };

        /* ============ 7. 闯关练习 ============ */

        const genQuestion = (level) => {
            const rnd = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
            if (level === 0) {          // 口算：整十整百
                const a = rnd(2, 9);
                const z = rnd(1, 2);
                const b = rnd(2, 9) * Math.pow(10, z);
                return { a, b, kind: '口算' };
            }
            if (level === 1) {          // 多位数 × 一位数
                return { a: rnd(102, 999), b: rnd(2, 9), kind: '两三位数×一位数' };
            }
            if (level === 2) {          // 两位数 × 两位数
                return { a: rnd(12, 99), b: rnd(12, 99), kind: '两位数×两位数' };
            }
            // 末尾有 0
            return { a: rnd(2, 9) * 10 * rnd(1, 9), b: rnd(2, 9) * 10, kind: '末尾有0' };
        };

        const LEVELS = ['整十整百口算', '多位数 × 一位数', '两位数 × 两位数', '因数末尾有 0'];

        const PracticeTab = () => {
            const [level, setLevel] = useState(1);
            const [q, setQ] = useState(() => genQuestion(1));
            const [input, setInput] = useState('');
            const [checked, setChecked] = useState(false);
            const [score, setScore] = useState({ right: 0, total: 0 });

            useEffect(() => { setQ(genQuestion(level)); setInput(''); setChecked(false); }, [level]);

            const answer = q.a * q.b;
            const ok = Number(input) === answer;

            const submit = () => {
                if (input === '' || checked) return;
                setChecked(true);
                setScore(s => ({ right: s.right + (Number(input) === answer ? 1 : 0), total: s.total + 1 }));
            };

            const next = () => { setQ(genQuestion(level)); setInput(''); setChecked(false); };

            // 错时给出的针对性提示
            const diagnose = () => {
                const wrong = Number(input);
                if (level === 2) {
                    const forgotShift = q.a * (q.b % 10) + q.a * Math.floor(q.b / 10);
                    if (wrong === forgotShift) return '第二层部分积忘记左移一位了 —— 十位上的数乘出来是"几个十"。';
                }
                if (level === 0 || level === 3) {
                    const s = String(wrong), t = String(answer);
                    if (s.replace(/0+$/, '') === t.replace(/0+$/, '')) return '数字算对了，末尾 0 的个数数错了，再数一遍两个因数末尾一共几个 0。';
                }
                return '再检查一遍：是不是漏乘了某一位，或者进位忘记加上去了？';
            };

            return (
                <div className="fade-in space-y-5">
                    <Card>
                        <div className="flex flex-wrap gap-2 justify-center">
                            {LEVELS.map((l, i) => (
                                <button key={i} onClick={() => setLevel(i)}
                                    className={"px-4 py-2 rounded-full font-semibold text-sm smooth-transition " +
                                        (level === i ? "bg-indigo-500 text-white shadow" : "bg-slate-100 text-slate-600 hover:bg-slate-200")}>
                                    {l}
                                </button>
                            ))}
                        </div>
                    </Card>

                    <Card className="text-center">
                        <div className="text-sm text-slate-400 mb-2">{q.kind}</div>
                        <div className="text-5xl font-bold text-slate-800 col-grid mb-6">
                            {q.a} × {q.b} =
                        </div>
                        <input type="number" value={input} autoFocus
                            onChange={e => setInput(e.target.value)}
                            onKeyDown={e => { if (e.key === 'Enter') { checked ? next() : submit(); } }}
                            disabled={checked}
                            className={"w-48 text-center text-3xl border-2 rounded-lg p-2 col-grid smooth-transition " +
                                (checked ? (ok ? "border-emerald-400 bg-emerald-50 text-emerald-700" : "border-rose-400 bg-rose-50 text-rose-700")
                                    : "border-indigo-300")} />

                        <div className="mt-5 flex gap-3 justify-center">
                            {!checked
                                ? <button onClick={submit} disabled={input === ''}
                                    className="px-8 py-2.5 rounded-lg font-semibold text-white bg-indigo-500 hover:bg-indigo-600 disabled:opacity-40 smooth-transition">检查</button>
                                : <button onClick={next}
                                    className="px-8 py-2.5 rounded-lg font-semibold text-white bg-emerald-500 hover:bg-emerald-600 smooth-transition">下一题</button>}
                        </div>

                        {checked && (
                            <div className="mt-5 pop">
                                {ok
                                    ? <Hint tone="emerald"><b>答对了！</b> {q.a} × {q.b} = {answer}</Hint>
                                    : <Hint tone="rose">
                                        <b>正确答案是 {answer}。</b> {diagnose()}
                                    </Hint>}
                            </div>
                        )}

                        <div className="mt-5 text-slate-500 text-sm">
                            已做 {score.total} 题，答对 <b className="text-emerald-600">{score.right}</b> 题
                            {score.total > 0 && <>（正确率 {Math.round(score.right / score.total * 100)}%）</>}
                        </div>
                    </Card>
                </div>
            );
        };

        /* ============ 主框架 ============ */

        const TABS = [
            { id: 'oral', name: '① 整十整百口算', comp: OralTab },
            { id: 'decompose', name: '② 分解运算·拆成两堆', comp: DecomposeTab },
            { id: 'area', name: '③ 面积模型·理解含义', comp: AreaTab },
            { id: 'one', name: '④ 多位数×一位数', comp: OneDigitTab },
            { id: 'two', name: '⑤ 两位数×两位数', comp: TwoDigitTab },
            { id: 'zero', name: '⑥ 末尾有0的简算', comp: ZeroTab },
            { id: 'practice', name: '⑦ 闯关练习', comp: PracticeTab },
        ];

        const App = () => {
            const [tab, setTab] = useState('oral');
            const Active = TABS.find(t => t.id === tab).comp;

            return (
                <div className="min-h-screen py-8 px-4">
                    <header className="relative max-w-5xl mx-auto text-center mb-8 px-12">
                        <a href="/" aria-label="返回主页" title="返回主页" className="absolute left-0 top-0 inline-flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-500 shadow-sm transition hover:border-blue-200 hover:bg-blue-50 hover:text-blue-600">
                            <svg className="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                                <polyline points="9 22 9 12 15 12 15 22" />
                            </svg>
                        </a>
                        <h1 className="text-3xl font-bold text-slate-800">多位数乘法竖式实验室</h1>
                        <p className="text-slate-500 mt-1">从口算迁移到拆分与面积模型，再到竖式每一层部分积，把"为什么这样写"讲清楚</p>
                    </header>

                    <div className="max-w-5xl mx-auto flex flex-wrap justify-center gap-2 mb-8">
                        {TABS.map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)}
                                className={"px-4 py-2.5 rounded-full font-semibold text-sm smooth-transition " +
                                    (tab === t.id ? "bg-indigo-500 text-white shadow" : "bg-white text-slate-600 hover:bg-slate-100")}>
                                {t.name}
                            </button>
                        ))}
                    </div>

                    <div className="max-w-5xl mx-auto">
                        <Active />
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <div class="site-copyright" style="box-sizing: border-box; width: 100%; padding: 24px 16px; text-align: center; color: #94a3b8; font: 13px/1.6 system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">©孙维刚教育研究院 小宇老师 版权所有</div>
</body>
</html>
