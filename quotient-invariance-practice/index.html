<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="商不变计算精细分类练习题库，91道原题按知识点、整数或小数、题型三维筛选。">
    <title>商不变计算·精细分类练习 | Math101</title>
    <style>
        :root {
            --ink: #172033;
            --muted: #667085;
            --line: #dfe6ef;
            --paper: #fff;
            --bg: #f5f7f8;
            --green: #137a5b;
            --green-dark: #0d6047;
            --green-soft: #eaf7f1;
            --amber: #d97706;
            --blue: #3157d5;
            --shadow: 0 17px 44px rgba(28, 62, 51, .10);
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background:
                radial-gradient(circle at 8% 0%, rgba(33, 150, 111, .14), transparent 29rem),
                radial-gradient(circle at 95% 10%, rgba(245, 158, 11, .10), transparent 25rem),
                var(--bg);
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
        }
        button, input, select { font: inherit; }
        button { cursor: pointer; }
        [hidden] { display: none !important; }
        .page { width: min(1180px, calc(100% - 30px)); margin: 0 auto; padding: 22px 0 40px; }

        .hero {
            position: relative;
            overflow: hidden;
            border-radius: 26px;
            padding: 30px clamp(22px, 5vw, 54px);
            color: #fff;
            background: linear-gradient(128deg, #173f91 0%, #3157d5 48%, #7c3aed 112%);
            box-shadow: var(--shadow);
        }
        .hero::before, .hero::after { position: absolute; color: rgba(255,255,255,.10); pointer-events: none; font-weight: 950; }
        .hero::before { content: "×"; right: 128px; top: -42px; font-size: 190px; }
        .hero::after { content: "÷"; right: 20px; bottom: -72px; font-size: 150px; }
        .home { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 7px; color: rgba(255,255,255,.88); text-decoration: none; font-size: 14px; font-weight: 850; }
        .home:hover { color: #fff; }
        .eyebrow { position: relative; z-index: 1; margin: 28px 0 8px; font-size: 13px; font-weight: 900; letter-spacing: .12em; opacity: .82; }
        h1 { position: relative; z-index: 1; margin: 0; font-size: clamp(30px, 5vw, 48px); line-height: 1.13; letter-spacing: -.03em; }
        .hero-copy { position: relative; z-index: 1; max-width: 760px; margin: 12px 0 0; color: rgba(255,255,255,.84); font-size: 15px; line-height: 1.75; }
        .hero-stats { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
        .hero-stat { min-width: 112px; padding: 10px 14px; border: 1px solid rgba(255,255,255,.25); border-radius: 14px; background: rgba(255,255,255,.12); backdrop-filter: blur(5px); }
        .hero-stat strong { display: block; font-size: 22px; line-height: 1; }
        .hero-stat span { display: block; margin-top: 5px; color: rgba(255,255,255,.76); font-size: 12px; font-weight: 750; }

        .category-nav {
            position: sticky;
            z-index: 20;
            top: 0;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-top: 16px;
            padding: 9px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: rgba(255,255,255,.94);
            box-shadow: 0 8px 24px rgba(36,51,86,.08);
            backdrop-filter: blur(10px);
            scrollbar-width: none;
        }
        .category-nav::-webkit-scrollbar { display: none; }
        .category-btn { flex: 0 0 auto; min-width: 112px; border: 0; border-radius: 11px; padding: 9px 13px; color: #526078; background: transparent; font-weight: 900; transition: .18s ease; }
        .category-btn small { display: block; margin-top: 2px; font-size: 11px; font-weight: 750; opacity: .68; }
        .category-btn:hover { background: #f1f6f3; }
        .category-btn.active { color: #fff; background: var(--green); box-shadow: 0 7px 16px rgba(49,87,213,.24); }

        .toolbar { display: grid; grid-template-columns: minmax(210px, 1fr) auto auto auto auto auto; gap: 10px; align-items: center; margin: 14px 0; }
        .search-wrap { position: relative; }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #8490a5; pointer-events: none; }
        .search { width: 100%; min-height: 46px; border: 1px solid var(--line); border-radius: 13px; padding: 9px 14px 9px 42px; color: var(--ink); background: #fff; outline: none; box-shadow: 0 4px 14px rgba(36,51,86,.05); }
        .search:focus { border-color: #80c8af; box-shadow: 0 0 0 4px rgba(19,122,91,.10); }
        .filter-select { min-height: 46px; border: 1px solid var(--line); border-radius: 13px; padding: 0 34px 0 13px; color: #40506a; background: #fff; font-weight: 850; outline: none; box-shadow: 0 4px 14px rgba(36,51,86,.05); }
        .filter-select:focus { border-color: #80a8dd; box-shadow: 0 0 0 4px rgba(49,87,213,.10); }
        .tool-btn { min-height: 46px; border: 1px solid var(--line); border-radius: 13px; padding: 0 16px; color: #40506a; background: #fff; font-weight: 900; box-shadow: 0 4px 14px rgba(36,51,86,.05); }
        .tool-btn:hover { border-color: #9fcdbd; color: var(--green); }
        .tool-btn.primary { color: #fff; border-color: var(--green); background: var(--green); }
        .tool-btn.primary:hover { background: var(--green-dark); }

        .notice { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 14px; padding: 12px 15px; border: 1px solid #bfe2d4; border-radius: 13px; color: #315c4d; background: var(--green-soft); font-size: 13px; line-height: 1.6; }
        .notice strong { color: var(--green-dark); }
        .result-line { min-height: 20px; margin: 0 2px 8px; color: var(--muted); font-size: 13px; font-weight: 850; }
        .empty-state { display: none; padding: 52px 20px; border: 1px dashed #cbd5e1; border-radius: 18px; color: var(--muted); background: #fff; text-align: center; }

        .single-nav { display: grid; grid-template-columns: auto minmax(150px, 1fr) auto; align-items: center; gap: 12px; margin-bottom: 18px; padding: 11px; border: 1px solid var(--line); border-radius: 15px; background: #fff; box-shadow: 0 5px 18px rgba(36,51,86,.055); }
        .nav-btn { min-height: 42px; border: 1px solid #d5deea; border-radius: 11px; padding: 0 16px; color: #40506a; background: #f8fafc; font-weight: 900; }
        .nav-btn:hover:not(:disabled) { color: var(--green); border-color: #9fcdbd; background: #f2faf6; }
        .nav-btn:disabled { color: #aab3c0; cursor: not-allowed; opacity: .62; }
        .progress-box { text-align: center; }
        .progress-box strong { display: block; color: var(--green-dark); font-size: 16px; }
        .progress-box span { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; font-weight: 750; }

        .question-section { --section-color: var(--green); scroll-margin-top: 95px; }
        .section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; margin: 0 2px 12px; }
        .section-title { display: flex; align-items: center; gap: 12px; }
        .section-icon { width: 43px; height: 43px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 13px; color: #fff; background: var(--section-color); font-size: 20px; font-weight: 950; box-shadow: 0 8px 18px color-mix(in srgb, var(--section-color) 24%, transparent); }
        .section-title h2 { margin: 0; font-size: 23px; }
        .section-title p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
        .source-number { color: var(--muted); font-size: 13px; font-weight: 850; white-space: nowrap; }

        .question-card { position: relative; overflow: hidden; min-height: 260px; border: 1px solid var(--line); border-radius: 20px; padding: 24px 24px 22px 82px; background: var(--paper); box-shadow: 0 8px 26px rgba(36,51,86,.07); outline: none; }
        .question-card.random-focus { border-color: #64af94; box-shadow: 0 0 0 4px rgba(19,122,91,.12), 0 18px 38px rgba(36,51,86,.12); animation: lift .42s ease; }
        @keyframes lift { from { transform: translateY(8px); } to { transform: none; } }
        .question-number { position: absolute; left: 21px; top: 22px; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; color: var(--section-color); background: color-mix(in srgb, var(--section-color) 11%, white); font-size: 14px; font-weight: 950; }
        .question-prompt { font-size: 18px; line-height: 1.85; font-weight: 670; word-break: break-word; }
        .formula-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; margin: 14px 0; }
        .formula-grid span { padding: 9px 11px; border: 1px solid #dfe6ef; border-radius: 9px; background: #f8fafc; font-variant-numeric: tabular-nums; }

        .media-gallery { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 16px; }
        .question-media { display: block; max-width: min(100%, 620px); max-height: 370px; width: auto; height: auto; padding: 8px; border: 1px solid #e0e7ef; border-radius: 12px; background: #fff; object-fit: contain; }
        .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin-top: 18px; }
        .choice { min-height: 45px; border: 1px solid #dce3ee; border-radius: 12px; padding: 10px 13px; color: #43506a; background: #f8fafc; text-align: left; font-weight: 760; transition: .15s ease; }
        .choice:hover { color: var(--green-dark); border-color: #9fcdbd; background: #f2faf6; }
        .choice.selected { color: var(--green-dark); border-color: #58a78a; background: var(--green-soft); box-shadow: inset 0 0 0 1px #58a78a; }
        .choice.image-choice { display: grid; grid-template-columns: 30px 1fr; align-items: center; gap: 8px; min-height: 112px; }
        .choice-letter { font-size: 18px; font-weight: 950; }
        .choice img { display: block; max-width: 100%; max-height: 105px; margin: auto; object-fit: contain; }

        .number-grid-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px; }
        .mark-btn { border: 1px solid #d5deea; border-radius: 9px; padding: 8px 11px; color: #536078; background: #fff; font-size: 12px; font-weight: 850; }
        .mark-btn.active { color: #fff; border-color: var(--green); background: var(--green); }
        .number-grid { display: grid; grid-template-columns: repeat(10, minmax(35px, 1fr)); width: min(720px, 100%); margin-top: 10px; border-top: 1px solid #cbd5e1; border-left: 1px solid #cbd5e1; }
        .num-cell { position: relative; aspect-ratio: 1.2; min-height: 38px; border: 0; border-right: 1px solid #cbd5e1; border-bottom: 1px solid #cbd5e1; color: #334155; background: #fff; font-weight: 800; }
        .num-cell:hover { background: #f8fafc; }
        .num-cell.mark-five::after { content: ""; position: absolute; inset: 5px; border: 2px solid #e05276; border-radius: 50%; pointer-events: none; }
        .num-cell.mark-two::before { content: ""; position: absolute; inset: 3px; border: 2px solid #3775d5; pointer-events: none; }

        .answer-tools { display: flex; align-items: center; justify-content: flex-end; gap: 7px; margin-top: 28px; }
        .answer-toggle { min-height: 26px; border: 0; padding: 2px 4px; color: #9aa4b3; background: transparent; font-size: 11px; font-weight: 700; text-decoration: underline; text-decoration-color: #c9d0d9; text-underline-offset: 3px; opacity: .78; }
        .answer-toggle:hover { color: #667085; background: transparent; opacity: 1; }
        .answer-tip { color: #b0b8c4; font-size: 10.5px; font-weight: 650; }
        .answer-panel { margin-top: 12px; padding: 16px 18px; border: 1px solid #aed8c8; border-radius: 13px; color: #234e3f; background: #effaf5; line-height: 1.75; }
        .answer-panel.warning { border-color: #f2c16e; color: #7a4a08; background: #fff8e9; }
        .answer-label { display: block; margin-bottom: 5px; color: var(--green-dark); font-size: 12px; font-weight: 950; letter-spacing: .08em; }
        .answer-panel.warning .answer-label { color: #9a5b05; }
        .answer-content { font-size: 16px; font-weight: 780; }
        .explanation-block { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(35,78,63,.14); }
        .explanation-content { color: #46584f; font-size: 14px; font-weight: 580; line-height: 1.8; white-space: pre-line; }
        .answer-panel.warning .explanation-block { border-top-color: rgba(122,74,8,.16); }
        .answer-panel.warning .explanation-content { color: #76531f; }

        .overview-modal { width: min(1000px, calc(100% - 28px)); max-height: min(86vh, 880px); margin: auto; padding: 0; overflow: hidden; border: 0; border-radius: 22px; color: var(--ink); background: #f7f9fc; box-shadow: 0 28px 80px rgba(15,23,42,.28); }
        .overview-modal::backdrop { background: rgba(20,29,48,.56); backdrop-filter: blur(4px); }
        .overview-head { position: sticky; z-index: 2; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 19px 22px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.97); }
        .overview-head h2 { margin: 0; font-size: 22px; }
        .overview-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
        .close-overview { flex: 0 0 auto; width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 11px; color: #5b677b; background: #fff; font-size: 22px; line-height: 1; }
        .close-overview:hover { color: var(--green); border-color: #9fcdbd; }
        .overview-body { max-height: calc(min(86vh, 880px) - 80px); overflow-y: auto; padding: 20px 22px 26px; }
        .overview-group + .overview-group { margin-top: 24px; }
        .overview-group-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 2px 10px; }
        .overview-group-title h3 { margin: 0; font-size: 17px; }
        .overview-group-title span { color: var(--muted); font-size: 12px; font-weight: 800; }
        .overview-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
        .overview-item { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 11px; align-items: start; min-height: 78px; border: 1px solid #dfe6ef; border-radius: 13px; padding: 11px 12px; color: var(--ink); background: #fff; text-align: left; box-shadow: 0 3px 10px rgba(36,51,86,.035); }
        .overview-item:hover, .overview-item.current { color: var(--green-dark); border-color: #88c1ad; background: #f4fbf8; }
        .overview-number { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 11px; color: var(--green); background: var(--green-soft); font-size: 13px; font-weight: 950; }
        .overview-preview { display: -webkit-box; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 2; color: #445169; font-size: 13px; font-weight: 700; line-height: 1.55; }
        .overview-item:hover .overview-preview, .overview-item.current .overview-preview { color: var(--green-dark); }
        footer { padding: 30px 16px 0; color: #94a3b8; text-align: center; font-size: 13px; line-height: 1.7; }

        @media (max-width: 760px) {
            .page { width: min(100% - 20px, 1180px); padding-top: 10px; }
            .hero { border-radius: 20px; padding: 24px 20px; }
            .hero::before { right: 68px; font-size: 145px; }
            .hero::after { right: -5px; font-size: 115px; }
            .eyebrow { margin-top: 22px; }
            .toolbar { grid-template-columns: 1fr 1fr; }
            .search-wrap { grid-column: 1 / -1; }
            .filter-select { width: 100%; }
            .tool-btn { padding: 0 9px; }
            #printBtn { grid-column: 1 / -1; }
            .single-nav { grid-template-columns: 1fr 1fr; }
            .progress-box { grid-column: 1 / -1; grid-row: 1; }
            .nav-btn { width: 100%; }
            .section-head { align-items: flex-start; }
            .question-card { padding: 72px 16px 19px; }
            .question-number { left: 16px; top: 16px; }
            .question-prompt { font-size: 16px; }
            .choices, .formula-grid { grid-template-columns: 1fr; }
            .number-grid { grid-template-columns: repeat(10, minmax(27px, 1fr)); }
            .num-cell { min-height: 33px; font-size: 12px; }
            .answer-tools { align-items: center; flex-direction: row; }
            .overview-modal { width: calc(100% - 16px); max-height: 92vh; border-radius: 17px; }
            .overview-head { padding: 15px 16px; }
            .overview-body { max-height: calc(92vh - 74px); padding: 16px; }
            .overview-grid { grid-template-columns: 1fr; }
        }

        @media print {
            @page { size: A4; margin: 14mm; }
            body { background: #fff; }
            .page { width: 100%; padding: 0; }
            .hero { color: #111827; border-radius: 0; padding: 0 0 14px; background: #fff; box-shadow: none; }
            .hero::before, .hero::after, .home, .hero-copy, .hero-stats, .category-nav, .toolbar, .notice, .result-line, .single-nav, footer { display: none !important; }
            .eyebrow { margin: 0 0 4px; color: #64748b; }
            h1 { font-size: 25px; }
            .section-icon { color: #111827; border: 1px solid #94a3b8; background: #fff; box-shadow: none; }
            .question-card { min-height: 0; break-inside: avoid; border: 1px solid #b8c1ce; border-radius: 8px; padding: 15px 14px 15px 62px; box-shadow: none; }
            .question-number { left: 13px; top: 13px; color: #111827; border: 1px solid #b8c1ce; background: #fff; }
            .question-prompt { font-size: 14px; }
            .choice { min-height: 32px; padding: 5px 9px; background: #fff; }
            .answer-tools { display: none; }
        }
        .bank-filters { margin: 12px 0; }
        .bank-filters summary { cursor: pointer; font-weight: 700; padding: 8px 0; }
        @media print { .bank-filters { display:none; } }
    </style>
    <link rel="stylesheet" href="../ipad-touch-adapter.css">
    <script src="../ipad-touch-adapter.js" defer></script>
    <script src="questions.js"></script>
    <script src="../lesson-practice.js" defer></script>
    <script src="../practice-integer.js" defer></script>
    <script src="../practice-models.js" defer></script>
    <script src="../practice-sources.js" defer></script>
</head>
<body>
<div class="page">
    <header class="hero">
        <a class="home" href="/" aria-label="返回工具主页">← 返回工具主页</a>
        <h1>商不变的规律练习</h1>
    </header>

    <details class="bank-filters"><summary>按知识点筛选</summary>
    <nav class="category-nav" id="categoryNav" aria-label="知识点分类"></nav>
    </details>

    <div class="toolbar">
        <label class="search-wrap"><span class="search-icon" aria-hidden="true">⌕</span><input class="search" id="searchInput" type="search" placeholder="搜索题目，如：余数、小数点、简便计算……" aria-label="搜索题目"></label>
        <select class="filter-select" id="domainFilter" aria-label="按数域筛选"><option value="all">全部数域</option><option value="integer">整数题</option><option value="decimal">小数题</option></select>
        <select class="filter-select" id="typeFilter" aria-label="按题型筛选"><option value="all">全部题型</option><option value="选择题">选择题</option><option value="填空题">填空题</option><option value="计算题">计算题</option></select>
        <button class="tool-btn primary" id="randomBtn" type="button">随机抽一题</button>
        <button class="tool-btn" id="browseBtn" type="button">浏览全部问题</button>
        <button class="tool-btn" id="printBtn" type="button">打印当前题目</button>
    </div>

    <div class="result-line" id="resultLine" aria-live="polite"></div>
    <div class="empty-state" id="emptyState">没有找到匹配的题目，请换个关键词试试。</div>

    <div class="single-nav" id="singleNav" aria-label="单题切换">
        <button class="nav-btn" id="prevBtn" type="button">← 上一题</button>
        <div class="progress-box"><strong id="progressText">1 / 91</strong><span id="progressHint"></span></div>
        <button class="nav-btn" id="nextBtn" type="button">下一题 →</button>
    </div>

    <main>
        <section class="question-section" id="questionSection">
            <div class="section-head">
                <div class="section-title"><span class="section-icon" id="sectionIcon">÷</span><div><h2 id="sectionTitle"></h2><p id="sectionDescription">按主要考查知识点分类</p></div></div>
                <span class="source-number" id="sourceNumber"></span>
            </div>
            <article class="question-card" id="questionCard" tabindex="-1">
                <span class="question-number" id="questionNumber"></span>
                <div class="question-prompt" id="questionPrompt"></div>
                <div class="media-gallery" id="mediaGallery" hidden></div>
                <div class="choices" id="choices" hidden></div>
                <div id="specialArea"></div>
                <div class="answer-tools"><button class="answer-toggle" id="answerToggle" type="button" aria-expanded="false">查看答案</button></div>
                <div class="answer-panel" id="answerPanel" hidden>
                    <span class="answer-label">参考答案</span>
                    <div class="answer-content" id="answerContent"></div>
                    <div class="explanation-block" id="explanationBlock" hidden><span class="answer-label">解析</span><div class="explanation-content" id="explanationContent"></div></div>
                </div>
            </article>
        </section>
    </main>

    <footer>题目与答案整理自《商不变计算》文档 · 按知识点、数域和题型精细分类<br>©孙维刚教育研究院 小宇老师 版权所有</footer>
</div>

<dialog class="overview-modal" id="overviewDialog" aria-labelledby="overviewTitle">
    <div class="overview-head"><div><h2 id="overviewTitle">浏览全部问题</h2><p>按主要知识点浏览91道文档原题，点击任意题目进入单题模式。</p></div><button class="close-overview" id="closeOverview" type="button" aria-label="关闭全部问题">×</button></div>
    <div class="overview-body" id="overviewBody"></div>
</dialog>

<script>
    (() => {
        const categories = window.QUOTIENT_INVARIANCE_CATEGORIES || [];
        const domains = window.QUOTIENT_INVARIANCE_DOMAINS || [];
        const questions = window.QUOTIENT_INVARIANCE_QUESTIONS || [];
        const explanations = window.QUOTIENT_INVARIANCE_EXPLANATIONS || {};
        const categoryMap = new Map(categories.map(category => [category.id, category]));
        const domainMap = new Map(domains.map(domain => [domain.id, domain]));
        const sectionColors = { invariance: "#3157d5", "dividend-change": "#0f8b8d", "divisor-change": "#d97706", "combined-change": "#7c3aed", remainder: "#d9466f", "decimal-shift": "#2563eb", simplify: "#137a5b", "operation-change": "#b45309", patterns: "#475569", calculation: "#0e7490" };
        const categoryNav = document.getElementById("categoryNav");
        const searchInput = document.getElementById("searchInput");
        const domainFilter = document.getElementById("domainFilter");
        const typeFilter = document.getElementById("typeFilter");
        const resultLine = document.getElementById("resultLine");
        const emptyState = document.getElementById("emptyState");
        const singleNav = document.getElementById("singleNav");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const progressText = document.getElementById("progressText");
        const progressHint = document.getElementById("progressHint");
        const questionSection = document.getElementById("questionSection");
        const questionCard = document.getElementById("questionCard");
        const questionNumber = document.getElementById("questionNumber");
        const questionPrompt = document.getElementById("questionPrompt");
        const mediaGallery = document.getElementById("mediaGallery");
        const choicesBox = document.getElementById("choices");
        const specialArea = document.getElementById("specialArea");
        const sectionIcon = document.getElementById("sectionIcon");
        const sectionTitle = document.getElementById("sectionTitle");
        const sectionDescription = document.getElementById("sectionDescription");
        const sourceNumber = document.getElementById("sourceNumber");
        const answerToggle = document.getElementById("answerToggle");
        const answerPanel = document.getElementById("answerPanel");
        const answerContent = document.getElementById("answerContent");
        const explanationBlock = document.getElementById("explanationBlock");
        const explanationContent = document.getElementById("explanationContent");
        const overviewDialog = document.getElementById("overviewDialog");
        const overviewBody = document.getElementById("overviewBody");
        let activeCategory = "all";
        let filteredQuestions = questions;
        let currentIndex = 0;

        function stripHtml(value) {
            const holder = document.createElement("div");
            holder.innerHTML = String(value || "");
            return holder.textContent || "";
        }

        function normalize(value) {
            return String(value || "").toLocaleLowerCase("zh-CN").replace(/\s+/g, "");
        }

        function renderCategoryNav() {
            const all = [{ id: "all", short: "全部知识点", count: questions.length }, ...categories.map(category => ({ ...category, count: questions.filter(question => question.category === category.id).length }))];
            all.forEach(category => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = `category-btn${category.id === "all" ? " active" : ""}`;
                button.dataset.category = category.id;
                const label = document.createTextNode(category.short);
                const count = document.createElement("small");
                count.textContent = `${category.count}题`;
                button.append(label, count);
                button.addEventListener("click", () => {
                    activeCategory = category.id;
                    [...categoryNav.children].forEach(item => item.classList.toggle("active", item === button));
                    applyFilters();
                    questionSection.scrollIntoView({ behavior: "smooth", block: "start" });
                });
                categoryNav.appendChild(button);
            });
        }

        function renderMedia(question) {
            mediaGallery.replaceChildren();
            (question.media || []).forEach((src, index) => {
                const img = document.createElement("img");
                img.className = "question-media";
                img.src = src;
                img.alt = `原题第${question.id}题题图${question.media.length > 1 ? index + 1 : ""}`;
                mediaGallery.appendChild(img);
            });
            mediaGallery.hidden = !mediaGallery.children.length;
        }

        function renderChoices(question) {
            choicesBox.replaceChildren();
            (question.choices || []).forEach(choiceData => {
                const choice = document.createElement("button");
                choice.type = "button";
                choice.className = "choice";
                choice.setAttribute("aria-pressed", "false");
                if (typeof choiceData === "string") {
                    choice.textContent = choiceData;
                } else {
                    choice.classList.add("image-choice");
                    const label = document.createElement("span");
                    label.className = "choice-letter";
                    label.textContent = `${choiceData.label}．`;
                    const img = document.createElement("img");
                    img.src = choiceData.image;
                    img.alt = `${choiceData.label}选项队列图`;
                    choice.append(label, img);
                }
                choice.addEventListener("click", () => {
                    const selected = choice.classList.contains("selected");
                    [...choicesBox.children].forEach(item => { item.classList.remove("selected"); item.setAttribute("aria-pressed", "false"); });
                    if (!selected) { choice.classList.add("selected"); choice.setAttribute("aria-pressed", "true"); }
                });
                choicesBox.appendChild(choice);
            });
            choicesBox.hidden = !choicesBox.children.length;
        }

        function renderNumberGrid() {
            specialArea.replaceChildren();
            let mode = "five";
            const tools = document.createElement("div");
            tools.className = "number-grid-tools";
            const modes = [{ id: "five", label: "圈5的倍数" }, { id: "two", label: "框2的倍数" }, { id: "erase", label: "擦除标记" }];
            const modeButtons = modes.map(item => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = `mark-btn${item.id === mode ? " active" : ""}`;
                button.textContent = item.label;
                button.addEventListener("click", () => { mode = item.id; modeButtons.forEach(entry => entry.classList.toggle("active", entry === button)); });
                tools.appendChild(button);
                return button;
            });
            const grid = document.createElement("div");
            grid.className = "number-grid";
            for (let number = 0; number < 100; number += 1) {
                const cell = document.createElement("button");
                cell.type = "button";
                cell.className = "num-cell";
                cell.textContent = number;
                cell.setAttribute("aria-label", `${number}，点击添加当前标记`);
                cell.addEventListener("click", () => {
                    if (mode === "erase") cell.classList.remove("mark-five", "mark-two");
                    else cell.classList.toggle(mode === "five" ? "mark-five" : "mark-two");
                });
                grid.appendChild(cell);
            }
            specialArea.append(tools, grid);
        }

        function hideAnswer() {
            answerPanel.hidden = true;
            answerToggle.textContent = "查看答案";
            answerToggle.setAttribute("aria-expanded", "false");
        }

        function renderCurrent(shouldFocus = false) {
            questionCard.classList.remove("random-focus");
            if (!filteredQuestions.length) {
                emptyState.style.display = "block";
                singleNav.hidden = true;
                questionSection.hidden = true;
                resultLine.textContent = "没有找到匹配的题目";
                return;
            }
            currentIndex = Math.max(0, Math.min(currentIndex, filteredQuestions.length - 1));
            const question = filteredQuestions[currentIndex];
            const category = categoryMap.get(question.category);
            const domain = domainMap.get(question.domain);
            const color = sectionColors[question.category] || "#137a5b";
            questionSection.hidden = false;
            questionSection.style.setProperty("--section-color", color);
            emptyState.style.display = "none";
            singleNav.hidden = false;
            sectionIcon.textContent = category.icon;
            sectionTitle.textContent = category.name;
            sectionDescription.textContent = `${category.description} · ${domain.name} · ${question.type}`;
            sourceNumber.textContent = `${domain.name} · ${question.type} · 原题第${question.id}题`;
            questionNumber.textContent = String(question.id).padStart(2, "0");
            questionPrompt.innerHTML = question.prompt;
            renderMedia(question);
            renderChoices(question);
            specialArea.replaceChildren();
            if (question.special === "number-grid") renderNumberGrid();
            answerContent.innerHTML = question.answer;
            const explanation = explanations[question.id] || "";
            explanationContent.textContent = explanation;
            explanationBlock.hidden = !explanation;
            answerPanel.classList.toggle("warning", Boolean(question.answerWarning));
            hideAnswer();
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === filteredQuestions.length - 1;
            progressText.textContent = `${currentIndex + 1} / ${filteredQuestions.length}`;
            progressHint.textContent = filteredQuestions.length === 1 ? "当前筛选仅 1 题" : "";
            resultLine.textContent = `筛选结果：${filteredQuestions.length} 题`;
            if (shouldFocus) {
                questionCard.classList.add("random-focus");
                questionCard.scrollIntoView({ behavior: "smooth", block: "center" });
                window.setTimeout(() => questionCard.focus({ preventScroll: true }), 420);
            }
        }

        function applyFilters() {
            const term = normalize(searchInput.value);
            filteredQuestions = questions.filter(question => {
                const categoryMatch = activeCategory === "all" || question.category === activeCategory;
                const domainMatch = domainFilter.value === "all" || question.domain === domainFilter.value;
                const typeMatch = typeFilter.value === "all" || question.type === typeFilter.value;
                const searchable = `${stripHtml(question.prompt)} ${(question.choices || []).map(choice => typeof choice === "string" ? choice : choice.label).join(" ")}`;
                return categoryMatch && domainMatch && typeMatch && (!term || normalize(searchable).includes(term));
            });
            currentIndex = 0;
            renderCurrent();
        }

        function closeOverviewDialog() {
            if (typeof overviewDialog.close === "function" && overviewDialog.open) overviewDialog.close();
            else overviewDialog.removeAttribute("open");
        }

        function selectQuestion(question) {
            activeCategory = "all";
            searchInput.value = "";
            domainFilter.value = "all";
            typeFilter.value = "all";
            [...categoryNav.children].forEach(button => button.classList.toggle("active", button.dataset.category === "all"));
            filteredQuestions = questions;
            currentIndex = questions.findIndex(item => item.id === question.id);
            closeOverviewDialog();
            window.setTimeout(() => renderCurrent(true), 0);
        }

        function buildOverview() {
            categories.forEach(category => {
                const categoryQuestions = questions.filter(question => question.category === category.id);
                const group = document.createElement("section");
                group.className = "overview-group";
                const titleRow = document.createElement("div");
                titleRow.className = "overview-group-title";
                const title = document.createElement("h3");
                title.textContent = category.name;
                const count = document.createElement("span");
                count.textContent = `${categoryQuestions.length}题`;
                titleRow.append(title, count);
                const grid = document.createElement("div");
                grid.className = "overview-grid";
                categoryQuestions.forEach(question => {
                    const item = document.createElement("button");
                    item.type = "button";
                    item.className = "overview-item";
                    item.dataset.questionId = question.id;
                    item.setAttribute("aria-label", `选择原题第${question.id}题`);
                    const number = document.createElement("span");
                    number.className = "overview-number";
                    number.textContent = String(question.id).padStart(2, "0");
                    const preview = document.createElement("span");
                    preview.className = "overview-preview";
                    preview.textContent = stripHtml(question.prompt).trim();
                    item.append(number, preview);
                    item.addEventListener("click", () => selectQuestion(question));
                    grid.appendChild(item);
                });
                group.append(titleRow, grid);
                overviewBody.appendChild(group);
            });
        }

        searchInput.addEventListener("input", applyFilters);
        domainFilter.addEventListener("change", applyFilters);
        typeFilter.addEventListener("change", applyFilters);
        prevBtn.addEventListener("click", () => { if (currentIndex > 0) { currentIndex -= 1; renderCurrent(true); } });
        nextBtn.addEventListener("click", () => { if (currentIndex < filteredQuestions.length - 1) { currentIndex += 1; renderCurrent(true); } });
        document.getElementById("randomBtn").addEventListener("click", () => { if (filteredQuestions.length) { currentIndex = Math.floor(Math.random() * filteredQuestions.length); renderCurrent(true); } });
        document.getElementById("printBtn").addEventListener("click", () => window.print());
        answerToggle.addEventListener("click", () => {
            const willShow = answerPanel.hidden;
            answerPanel.hidden = !willShow;
            answerToggle.textContent = willShow ? "收起答案" : "查看答案";
            answerToggle.setAttribute("aria-expanded", String(willShow));
        });
        document.getElementById("browseBtn").addEventListener("click", () => {
            const currentQuestion = filteredQuestions[currentIndex];
            overviewBody.querySelectorAll(".overview-item").forEach(item => item.classList.toggle("current", currentQuestion && Number(item.dataset.questionId) === currentQuestion.id));
            if (typeof overviewDialog.showModal === "function") overviewDialog.showModal();
            else overviewDialog.setAttribute("open", "");
        });
        document.getElementById("closeOverview").addEventListener("click", closeOverviewDialog);
        overviewDialog.addEventListener("click", event => {
            const rect = overviewDialog.getBoundingClientRect();
            const inside = event.clientX >= rect.left && event.clientX <= rect.right && event.clientY >= rect.top && event.clientY <= rect.bottom;
            if (!inside) closeOverviewDialog();
        });

        renderCategoryNav();
        buildOverview();
        renderCurrent();
    })();
</script>
</body>
</html>
