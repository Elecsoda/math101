<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#15243a">
    <title>比与比例探索实验室 | Math101</title>
    <script src="../vendor/react.production.min.js"></script>
    <script src="../vendor/react-dom.production.min.js"></script>
    <script src="../vendor/babel.min.js"></script>
    <style>
        :root {
            --ink: #17243a;
            --muted: #667085;
            --paper: #fffdf8;
            --line: #dfe5ec;
            --blue: #2677e8;
            --blue-soft: #eaf3ff;
            --coral: #f2654a;
            --coral-soft: #fff0eb;
            --mint: #0f9f83;
            --mint-soft: #e6f8f3;
            --yellow: #f4b63e;
            --yellow-soft: #fff7dc;
            --purple: #7656cf;
            --purple-soft: #f0ecff;
            --shadow: 0 12px 30px rgba(27, 39, 60, .08);
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            min-width: 320px;
            background:
                radial-gradient(circle at 15% 12%, rgba(38,119,232,.08), transparent 27rem),
                radial-gradient(circle at 90% 26%, rgba(242,101,74,.08), transparent 24rem),
                #f5f7fa;
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        button, input, select { font: inherit; }
        button { color: inherit; }
        a { color: inherit; }

        .app-shell { min-height: 100vh; }
        .hero {
            position: relative;
            overflow: hidden;
            padding: 24px max(22px, calc((100vw - 1240px) / 2)) 22px;
            background: #15243a;
            color: #fff;
        }
        .hero::before, .hero::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            opacity: .16;
            pointer-events: none;
        }
        .hero::before { width: 290px; height: 290px; right: -70px; top: -170px; background: #55a7ff; }
        .hero::after { width: 180px; height: 180px; left: 7%; bottom: -140px; background: #ff8c70; }
        .hero-top, .hero-main { position: relative; z-index: 1; }
        .hero-top { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
        .brand { display: inline-flex; align-items: center; gap: 10px; color: #dbe8f8; font-size: 14px; font-weight: 700; }
        .brand-mark {
            display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px;
            background: #fff; color: var(--ink); font-family: Georgia, serif; font-size: 19px;
            transform: rotate(-3deg);
        }
        .home-link, .outline-button {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            min-height: 40px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.22);
            border-radius: 12px; background: rgba(255,255,255,.08); color: #fff;
            text-decoration: none; font-size: 14px; font-weight: 700; cursor: pointer;
            transition: .2s ease;
        }
        .home-link:hover, .outline-button:hover { background: rgba(255,255,255,.15); transform: translateY(-1px); }
        .hero-main { display: flex; align-items: flex-end; justify-content: space-between; gap: 35px; margin-top: 31px; }
        .eyebrow { margin: 0 0 8px; color: #9fc8fb; font-size: 13px; font-weight: 800; letter-spacing: .12em; }
        h1 { margin: 0; font-size: clamp(30px, 4vw, 52px); line-height: 1.1; letter-spacing: -.04em; }
        .hero-copy { max-width: 700px; margin: 12px 0 0; color: #cbd7e7; font-size: 16px; line-height: 1.7; }
        .hero-badge {
            flex: 0 0 auto; display: flex; align-items: center; gap: 13px; padding: 15px 17px;
            border: 1px solid rgba(255,255,255,.14); border-radius: 17px; background: rgba(255,255,255,.07);
        }
        .hero-badge strong { display: block; font-size: 23px; color: #fff; }
        .hero-badge span { display: block; margin-top: 2px; color: #aebed1; font-size: 12px; }
        .ratio-glyph { display: flex; gap: 5px; align-items: center; }
        .ratio-glyph i { width: 15px; height: 15px; border-radius: 5px; background: #ff8064; }
        .ratio-glyph i:nth-child(n+3) { background: #62aaff; }

        .lesson-nav-wrap {
            position: sticky; top: 0; z-index: 30; padding: 12px 18px;
            background: rgba(245,247,250,.9); border-bottom: 1px solid rgba(215,221,229,.9); backdrop-filter: blur(14px);
        }
        .lesson-nav { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; }
        .nav-button {
            position: relative; display: flex; align-items: center; justify-content: center; gap: 8px;
            min-height: 46px; padding: 8px 10px; border: 1px solid transparent; border-radius: 13px;
            background: transparent; color: #687386; font-size: 13px; font-weight: 800; cursor: pointer; transition: .2s ease;
        }
        .nav-button:hover { background: #fff; color: var(--ink); }
        .nav-button.active { background: #fff; border-color: #dbe2ea; color: var(--ink); box-shadow: 0 5px 15px rgba(25,40,65,.07); }
        .nav-index { display: grid; place-items: center; width: 23px; height: 23px; border-radius: 8px; background: #e8edf3; color: #6a7482; font-size: 11px; }
        .nav-button.active .nav-index { background: var(--blue); color: #fff; }

        .main { width: min(1240px, calc(100% - 36px)); margin: 28px auto 0; padding-bottom: 42px; }
        .module { animation: enter .35s ease both; }
        @keyframes enter { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
        .module-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
        .module-kicker { margin: 0 0 5px; color: var(--blue); font-size: 12px; font-weight: 900; letter-spacing: .12em; }
        h2 { margin: 0; font-size: clamp(25px, 3vw, 34px); letter-spacing: -.025em; }
        .module-desc { max-width: 650px; margin: 7px 0 0; color: var(--muted); line-height: 1.65; }
        .goal-chip { flex: 0 0 auto; padding: 9px 13px; border-radius: 999px; background: var(--yellow-soft); color: #8a5d00; font-size: 12px; font-weight: 800; }

        .card { background: rgba(255,255,255,.96); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); }
        .card-pad { padding: 24px; }
        .grid-2 { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(300px, .85fr); gap: 18px; }
        .grid-even { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
        .stack { display: grid; gap: 18px; }
        .card-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
        .card-title { margin: 0; font-size: 18px; }
        .tiny-label { color: #8390a2; font-size: 11px; font-weight: 800; letter-spacing: .08em; }
        .pill { padding: 6px 10px; border-radius: 999px; background: #f0f3f7; color: #687588; font-size: 12px; font-weight: 800; }
        .pill.blue { background: var(--blue-soft); color: #165eb7; }
        .pill.green { background: var(--mint-soft); color: #087461; }
        .pill.coral { background: var(--coral-soft); color: #be422d; }

        .segmented { display: inline-flex; padding: 4px; border-radius: 12px; background: #eef2f6; }
        .segmented button { border: 0; border-radius: 9px; background: transparent; padding: 7px 11px; color: #697487; font-size: 12px; font-weight: 800; cursor: pointer; }
        .segmented button.active { background: #fff; color: var(--ink); box-shadow: 0 2px 7px rgba(28,40,58,.08); }
        .slider-list { display: grid; gap: 13px; padding: 16px; background: #f7f9fb; border-radius: 16px; }
        .slider-row { display: grid; grid-template-columns: 92px 1fr 38px; align-items: center; gap: 12px; }
        .slider-row label { display: flex; align-items: center; gap: 7px; color: #596579; font-size: 13px; font-weight: 800; }
        .dot { width: 10px; height: 10px; border-radius: 4px; background: var(--coral); }
        .dot.blue { background: var(--blue); }
        input[type="range"] { width: 100%; accent-color: var(--blue); }
        .slider-value { display: grid; place-items: center; height: 32px; border-radius: 10px; background: #fff; border: 1px solid var(--line); font-weight: 900; }

        .object-stage { min-height: 280px; display: grid; align-content: center; gap: 18px; padding: 22px; border-radius: 18px; background: #f8fafc; border: 1px dashed #cfd7e2; }
        .object-row { display: grid; grid-template-columns: 84px 1fr; gap: 14px; align-items: center; }
        .object-label { color: #596579; font-size: 13px; font-weight: 800; text-align: right; }
        .objects { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; min-height: 42px; }
        .object {
            width: 33px; height: 33px; border-radius: 10px; background: var(--coral);
            border: 2px solid rgba(255,255,255,.85); box-shadow: 0 3px 0 #d94f38;
            animation: pop .22s ease both;
        }
        .object.blue { background: var(--blue); box-shadow: 0 3px 0 #155eb9; }
        .object.yellow { background: var(--yellow); box-shadow: 0 3px 0 #ca8c18; }
        @keyframes pop { from { transform: scale(.75); opacity: .2; } to { transform: scale(1); opacity: 1; } }
        .stage-caption { margin: 3px 0 0; color: #7a8698; font-size: 12px; text-align: center; }
        .big-ratio { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 20px; }
        .ratio-num { display: grid; place-items: center; min-width: 66px; height: 66px; padding: 0 12px; border-radius: 19px; color: #fff; background: var(--coral); font-size: 31px; font-weight: 900; }
        .ratio-num.blue { background: var(--blue); }
        .colon { color: #8a95a5; font: 900 36px Georgia, serif; }
        .term-labels { display: flex; justify-content: center; gap: 36px; margin-top: -10px; color: #728096; font-size: 12px; font-weight: 800; }
        .meaning-cards { display: grid; gap: 10px; margin-top: 18px; }
        .meaning-card { padding: 15px; border: 1px solid var(--line); border-radius: 15px; background: #fff; }
        .meaning-card strong { color: var(--ink); }
        .meaning-card p { margin: 4px 0 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
        .callout { padding: 16px 17px; border-radius: 16px; background: var(--yellow-soft); color: #74500c; font-size: 14px; line-height: 1.65; }
        .callout.blue { background: var(--blue-soft); color: #164f91; }
        .callout.green { background: var(--mint-soft); color: #096554; }
        .callout.coral { background: var(--coral-soft); color: #99402e; }

        .expression-chain { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: stretch; gap: 12px; margin: 22px 0; }
        .expression-card { min-height: 140px; display: grid; place-items: center; align-content: center; gap: 8px; padding: 18px; border-radius: 18px; border: 1px solid var(--line); background: #fff; }
        .expression-card.ratio { border-top: 5px solid var(--coral); }
        .expression-card.division { border-top: 5px solid var(--blue); }
        .expression-card.fraction { border-top: 5px solid var(--purple); }
        .expression-name { color: #748196; font-size: 12px; font-weight: 900; letter-spacing: .08em; }
        .expression { color: var(--ink); font-size: clamp(25px, 3vw, 38px); font-weight: 900; }
        .equals { align-self: center; color: #9aa4b1; font-size: 31px; font-weight: 900; }
        .fraction { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1; }
        .fraction span:first-child { min-width: 1.15em; padding: 0 .18em .11em; border-bottom: 2px solid currentColor; text-align: center; }
        .fraction span:last-child { padding-top: .11em; }
        .value-banner { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 20px; border-radius: 18px; background: var(--ink); color: #fff; }
        .value-banner p { margin: 4px 0 0; color: #b9c6d7; font-size: 13px; }
        .value-number { font-size: 28px; font-weight: 900; color: #82c0ff; }
        .concept-table { width: 100%; border-collapse: collapse; }
        .concept-table th, .concept-table td { padding: 14px; border-bottom: 1px solid var(--line); text-align: left; font-size: 13px; line-height: 1.55; }
        .concept-table th { color: #748195; font-size: 11px; letter-spacing: .06em; }
        .concept-table td:first-child { font-weight: 900; color: var(--ink); }
        .concept-table tr:last-child td { border-bottom: 0; }

        .factor-control { display: flex; align-items: center; gap: 12px; }
        .factor-buttons { display: flex; flex-wrap: wrap; gap: 7px; }
        .factor-button { min-width: 40px; height: 38px; border: 1px solid var(--line); border-radius: 11px; background: #fff; font-weight: 900; cursor: pointer; }
        .factor-button.active { border-color: var(--blue); background: var(--blue); color: #fff; }
        .equivalent-visual { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
        .recipe { padding: 15px; border: 1px solid var(--line); border-radius: 16px; background: #fff; }
        .recipe.active { border-color: #9fc8fb; background: var(--blue-soft); }
        .recipe-title { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 900; }
        .recipe-dots { display: flex; gap: 5px; margin-top: 12px; flex-wrap: wrap; }
        .mini-dot { width: 20px; height: 20px; border-radius: 6px; background: var(--coral); }
        .mini-dot.blue { background: var(--blue); }
        .step-equation { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 12px; min-height: 105px; margin-top: 18px; padding: 18px; border-radius: 18px; background: #f7f9fb; font-size: clamp(19px, 2.5vw, 29px); font-weight: 900; }
        .step-arrow { color: #9ba5b3; }
        .example-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
        .example-tab { padding: 9px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: #637084; font-size: 13px; font-weight: 800; cursor: pointer; }
        .example-tab.active { color: #fff; border-color: var(--ink); background: var(--ink); }
        .solution-steps { counter-reset: steps; display: grid; gap: 10px; }
        .solution-step { position: relative; padding: 14px 14px 14px 50px; border-radius: 14px; background: #f7f9fb; color: #586477; line-height: 1.55; }
        .solution-step::before { counter-increment: steps; content: counter(steps); position: absolute; left: 13px; top: 12px; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 9px; background: #fff; border: 1px solid var(--line); color: var(--ink); font-size: 12px; font-weight: 900; }
        .solution-answer { padding: 16px; border-radius: 14px; background: var(--mint-soft); color: #08705e; font-weight: 900; text-align: center; }

        .proportion-form { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr; gap: 8px; align-items: center; }
        .number-input { width: 100%; min-width: 0; height: 54px; border: 1.5px solid #cfd7e2; border-radius: 14px; background: #fff; color: var(--ink); text-align: center; font-size: 22px; font-weight: 900; outline: none; }
        .number-input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(38,119,232,.1); }
        .symbol { color: #8792a2; font-size: 24px; font-weight: 900; }
        .proportion-result { margin-top: 15px; padding: 15px; border-radius: 14px; text-align: center; font-weight: 900; }
        .proportion-result.yes { background: var(--mint-soft); color: #08705e; }
        .proportion-result.no { background: var(--coral-soft); color: #aa3d2a; }
        .cross-products { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin-top: 12px; }
        .cross-card { padding: 14px; border-radius: 14px; background: #f7f9fb; text-align: center; }
        .cross-card small { display: block; color: #7a8698; margin-bottom: 5px; }
        .cross-card b { font-size: 20px; }
        .term-map { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
        .term-box { padding: 12px 7px; border-radius: 13px; text-align: center; background: #f7f9fb; font-size: 13px; font-weight: 900; }
        .term-box.outer { color: #a94331; background: var(--coral-soft); }
        .term-box.inner { color: #185fae; background: var(--blue-soft); }
        .x-demo { display: grid; gap: 13px; }
        .x-equation { padding: 21px; border-radius: 16px; background: var(--ink); color: #fff; text-align: center; font-size: 27px; font-weight: 900; }
        .primary-button, .secondary-button {
            border: 0; min-height: 44px; padding: 10px 17px; border-radius: 13px; background: var(--blue); color: #fff;
            font-weight: 900; cursor: pointer; transition: .18s ease;
        }
        .primary-button:hover, .secondary-button:hover { filter: brightness(.96); transform: translateY(-1px); }
        .secondary-button { background: #edf1f5; color: var(--ink); }

        .application-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-bottom: 18px; }
        .application-tab { padding: 13px; border: 1px solid var(--line); border-radius: 14px; background: #fff; text-align: left; cursor: pointer; }
        .application-tab span { display: block; color: #8390a1; font-size: 11px; font-weight: 900; }
        .application-tab b { display: block; margin-top: 3px; font-size: 15px; }
        .application-tab.active { border-color: var(--blue); background: var(--blue-soft); }
        .relationship-stage { min-height: 250px; padding: 20px; border-radius: 18px; background: #f8fafc; }
        .relationship-head { display: flex; align-items: center; justify-content: space-between; gap: 13px; }
        .type-badge { padding: 8px 12px; border-radius: 999px; font-size: 13px; font-weight: 900; }
        .type-badge.direct { background: var(--blue-soft); color: #155dac; }
        .type-badge.inverse { background: var(--purple-soft); color: #5d42ac; }
        .type-badge.none { background: var(--yellow-soft); color: #79540d; }
        .bar-chart { height: 145px; display: flex; align-items: end; gap: 13px; padding-top: 20px; border-bottom: 2px solid #d9e0e8; }
        .bar-column { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .bar { width: min(48px, 80%); min-height: 8px; border-radius: 9px 9px 2px 2px; background: var(--blue); transition: height .25s ease; }
        .bar-column:nth-child(2n) .bar { background: #65a9fb; }
        .bar-label { color: #738095; font-size: 11px; }
        .rule-line { margin: 13px 0 0; color: #5c687a; font-size: 13px; line-height: 1.55; }
        .application-calculator { display: grid; gap: 15px; }
        .field-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; }
        .field label { display: block; margin-bottom: 6px; color: #6c788b; font-size: 12px; font-weight: 800; }
        .field input, .field select { width: 100%; height: 46px; border: 1px solid #cfd7e2; border-radius: 12px; background: #fff; padding: 0 11px; outline: none; }
        .field input:focus, .field select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(38,119,232,.09); }
        .distribution-bar { display: flex; height: 58px; overflow: hidden; border-radius: 15px; background: #e8edf2; }
        .distribution-part { display: grid; place-items: center; min-width: 0; color: #fff; font-size: 13px; font-weight: 900; transition: width .25s ease; }
        .distribution-part:first-child { background: var(--coral); }
        .distribution-part:last-child { background: var(--blue); }
        .application-answer { padding: 17px; border: 1px solid #bce6db; border-radius: 15px; background: var(--mint-soft); color: #086d5b; line-height: 1.65; }
        .checklist { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .check-item { display: flex; gap: 10px; padding: 13px; border: 1px solid var(--line); border-radius: 14px; background: #fff; color: #5e697b; font-size: 13px; line-height: 1.5; }
        .check-icon { flex: 0 0 auto; display: grid; place-items: center; width: 25px; height: 25px; border-radius: 8px; background: var(--mint-soft); color: var(--mint); font-weight: 900; }

        .practice-layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 18px; }
        .practice-side { padding: 22px; }
        .score-ring { display: grid; place-items: center; width: 116px; height: 116px; margin: 11px auto 20px; border-radius: 50%; background: conic-gradient(var(--blue) var(--progress), #e8edf3 0); }
        .score-ring-inner { display: grid; place-items: center; width: 88px; height: 88px; border-radius: 50%; background: #fff; }
        .score-ring strong { font-size: 27px; }
        .score-ring small { color: #8792a2; }
        .practice-dots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
        .practice-dot { height: 32px; display: grid; place-items: center; border-radius: 9px; background: #edf1f5; color: #7e8999; font-size: 11px; font-weight: 900; }
        .practice-dot.current { outline: 2px solid var(--blue); outline-offset: 2px; }
        .practice-dot.right { background: var(--mint-soft); color: #08705e; }
        .practice-dot.wrong { background: var(--coral-soft); color: #aa3d2a; }
        .practice-card { min-height: 430px; padding: 30px; }
        .question-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .question-number { color: #7b8799; font-size: 12px; font-weight: 900; letter-spacing: .08em; }
        .question-title { margin: 24px 0; font-size: clamp(22px, 3vw, 30px); line-height: 1.45; }
        .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 11px; }
        .option { min-height: 58px; padding: 13px 16px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; text-align: left; font-weight: 800; cursor: pointer; }
        .option:hover:not(:disabled) { border-color: #94bdf0; background: #f5f9ff; }
        .option.selected { border-color: var(--blue); background: var(--blue-soft); color: #165daa; }
        .option.correct { border-color: #60bfa8; background: var(--mint-soft); color: #08705e; }
        .option.wrong { border-color: #f3a190; background: var(--coral-soft); color: #aa3d2a; }
        .answer-input { display: flex; gap: 10px; }
        .answer-input input { flex: 1; min-width: 0; height: 54px; border: 1.5px solid #cfd7e2; border-radius: 14px; padding: 0 15px; font-size: 18px; font-weight: 800; outline: none; }
        .answer-input input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(38,119,232,.1); }
        .feedback { margin-top: 18px; padding: 15px 17px; border-radius: 14px; line-height: 1.6; }
        .feedback.right { background: var(--mint-soft); color: #086b59; }
        .feedback.wrong { background: var(--coral-soft); color: #9d3f2d; }
        .question-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
        .finished { min-height: 360px; display: grid; place-items: center; align-content: center; text-align: center; }
        .finished-icon { display: grid; place-items: center; width: 88px; height: 88px; border-radius: 27px; background: var(--yellow-soft); font-size: 42px; transform: rotate(-4deg); }
        .finished h3 { margin: 18px 0 7px; font-size: 28px; }
        .finished p { max-width: 480px; color: var(--muted); line-height: 1.7; }

        .bottom-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 22px; }
        footer { padding: 26px 18px 36px; color: #8b96a5; font-size: 12px; text-align: center; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

        @media (max-width: 900px) {
            .hero-main { align-items: flex-start; }
            .hero-badge { display: none; }
            .lesson-nav { display: flex; overflow-x: auto; padding-bottom: 2px; justify-content: flex-start; }
            .nav-button { flex: 0 0 auto; padding-inline: 13px; }
            .grid-2, .grid-even, .practice-layout { grid-template-columns: 1fr; }
            .grid-3 { grid-template-columns: 1fr 1fr; }
            .practice-side { display: grid; grid-template-columns: 130px 1fr; align-items: center; }
            .score-ring { margin: 0; }
            .expression-chain { grid-template-columns: 1fr; }
            .equals { justify-self: center; line-height: .7; }
            .expression-card { min-height: 110px; }
        }
        @media (max-width: 640px) {
            .hero { padding: 18px 18px 22px; }
            .brand span { display: none; }
            .hero-main { margin-top: 24px; }
            .hero-copy { font-size: 14px; }
            .lesson-nav-wrap { padding: 9px 12px; }
            .main { width: min(100% - 22px, 1240px); margin-top: 20px; }
            .module-head { display: block; }
            .goal-chip { display: inline-block; margin-top: 12px; }
            .card-pad, .practice-card { padding: 18px; }
            .grid-3, .field-grid, .checklist { grid-template-columns: 1fr; }
            .object-stage { min-height: 240px; padding: 16px 11px; }
            .object-row { grid-template-columns: 67px 1fr; gap: 9px; }
            .object { width: 27px; height: 27px; border-radius: 8px; }
            .slider-row { grid-template-columns: 78px 1fr 34px; gap: 8px; }
            .equivalent-visual { grid-template-columns: 1fr; }
            .recipe:nth-child(3) { display: none; }
            .proportion-form { grid-template-columns: 1fr auto 1fr; }
            .proportion-form .eq { grid-column: 1 / -1; text-align: center; line-height: .5; }
            .term-map { grid-template-columns: repeat(2, 1fr); }
            .cross-products { grid-template-columns: 1fr; }
            .application-tabs { grid-template-columns: 1fr; }
            .options { grid-template-columns: 1fr; }
            .practice-side { grid-template-columns: 105px 1fr; padding: 16px; }
            .score-ring { width: 94px; height: 94px; }
            .score-ring-inner { width: 71px; height: 71px; }
            .practice-card { min-height: 470px; }
            .answer-input { flex-direction: column; }
            .bottom-nav { flex-direction: column-reverse; }
            .bottom-nav button { width: 100%; }
        }
    </style>
    <link rel="stylesheet" href="../ipad-touch-adapter.css">
    <script src="../ipad-touch-adapter.js" defer></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useMemo, useState } = React;

        const LESSONS = [
            { id: 'meaning', short: '认识比', label: '比是什么' },
            { id: 'relation', short: '等效关系', label: '四种表达' },
            { id: 'simplify', short: '化简比', label: '基本性质' },
            { id: 'proportion', short: '认识比例', label: '比例性质' },
            { id: 'application', short: '教材应用', label: '常见考点' },
            { id: 'practice', short: '简单练习', label: '闯关检验' }
        ];

        const gcd = (x, y) => {
            x = Math.abs(Math.round(Number(x) || 0));
            y = Math.abs(Math.round(Number(y) || 0));
            while (y) [x, y] = [y, x % y];
            return x || 1;
        };
        const neat = value => Number.isInteger(value) ? String(value) : Number(value.toFixed(4)).toString();
        const decimalText = (a, b) => {
            const value = a / b;
            return Number.isInteger(value) ? String(value) : value.toFixed(3).replace(/0+$/, '').replace(/\.$/, '');
        };
        const Fraction = ({ n, d }) => <span className="fraction" aria-label={`${d}分之${n}`}><span>{n}</span><span>{d}</span></span>;

        function ModuleHead({ index, title, desc, goal }) {
            return <div className="module-head">
                <div>
                    <p className="module-kicker">第 {index} 站 · 探索任务</p>
                    <h2>{title}</h2>
                    <p className="module-desc">{desc}</p>
                </div>
                <span className="goal-chip">本节目标 · {goal}</span>
            </div>;
        }

        const ObjectDots = ({ count, tone = '' }) => (
            <div className="objects" aria-label={`${count}个物体`}>
                {Array.from({ length: count }, (_, i) => <i className={`object ${tone}`} style={{ animationDelay: `${i * .025}s` }} key={i}></i>)}
            </div>
        );

        function MeaningLab() {
            const [a, setA] = useState(4);
            const [b, setB] = useState(6);
            const [mode, setMode] = useState('part');
            const divisor = gcd(a, b);
            const left = a / divisor, right = b / divisor;
            const second = mode === 'part' ? b : a + b;
            const secondLabel = mode === 'part' ? '蓝色方块' : '全部方块';
            const secondDivisor = gcd(a, second);
            return <section className="module">
                <ModuleHead index="1" title="先用眼睛看懂“比”" desc="比不是在问“相差多少”，而是在问两个数量之间有怎样的倍数关系。拖动数量，观察表达怎样一起变化。" goal="会读、会写、会说含义" />
                <div className="grid-2">
                    <div className="card card-pad">
                        <div className="card-title-row">
                            <div><span className="tiny-label">可操作模型</span><h3 className="card-title">两队方块比一比</h3></div>
                            <div className="segmented" aria-label="比较方式">
                                <button className={mode === 'part' ? 'active' : ''} onClick={() => setMode('part')}>部分 : 部分</button>
                                <button className={mode === 'whole' ? 'active' : ''} onClick={() => setMode('whole')}>部分 : 整体</button>
                            </div>
                        </div>
                        <div className="object-stage">
                            <div className="object-row"><div className="object-label">红色方块<br />{a} 个</div><ObjectDots count={a} /></div>
                            <div className="object-row"><div className="object-label">蓝色方块<br />{b} 个</div><ObjectDots count={b} tone="blue" /></div>
                            <p className="stage-caption">每个方块一样大，才能直接比较个数。</p>
                        </div>
                        <div className="slider-list" style={{ marginTop: 16 }}>
                            <div className="slider-row"><label><i className="dot"></i>红色数量</label><input aria-label="红色数量" type="range" min="1" max="12" value={a} onChange={e => setA(+e.target.value)} /><span className="slider-value">{a}</span></div>
                            <div className="slider-row"><label><i className="dot blue"></i>蓝色数量</label><input aria-label="蓝色数量" type="range" min="1" max="12" value={b} onChange={e => setB(+e.target.value)} /><span className="slider-value">{b}</span></div>
                        </div>
                    </div>
                    <div className="stack">
                        <div className="card card-pad">
                            <div className="card-title-row"><h3 className="card-title">把看到的关系写下来</h3><span className="pill coral">读作 {a} 比 {second}</span></div>
                            <div className="big-ratio"><span className="ratio-num">{a}</span><span className="colon">:</span><span className="ratio-num blue">{second}</span></div>
                            <div className="term-labels"><span>前项</span><span>比号</span><span>后项</span></div>
                            <div className="meaning-cards">
                                <div className="meaning-card"><strong>它在比较什么？</strong><p>红色方块数量与{secondLabel}数量的比是 <b>{a}:{second}</b>。</p></div>
                                <div className="meaning-card"><strong>它表示几倍？</strong><p>红色数量是{secondLabel}的 <b>{a} ÷ {second} = {decimalText(a, second)}</b> 倍。</p></div>
                                <div className="meaning-card"><strong>最简整数比</strong><p>{a}:{second} = <b>{a / secondDivisor}:{second / secondDivisor}</b>{secondDivisor > 1 ? `（同时除以 ${secondDivisor}）` : '（已经最简）'}</p></div>
                            </div>
                        </div>
                        <div className="callout">
                            <b>辨一辨：</b>“红比蓝多 {Math.abs(a - b)} 个”是在比较<b>差</b>；“红与蓝的比是 {a}:{b}”是在比较<b>倍数关系</b>。问题不同，表达也不同。
                        </div>
                    </div>
                </div>
                <div className="grid-3" style={{ marginTop: 18 }}>
                    <div className="meaning-card"><strong>顺序不能随便换</strong><p>红与蓝是 {a}:{b}，蓝与红是 {b}:{a}。前后交换，含义就变了。</p></div>
                    <div className="meaning-card"><strong>既能比同类量</strong><p>4 个红球与 6 个蓝球，单位相同，可以比较并化简。</p></div>
                    <div className="meaning-card"><strong>也能比不同类量</strong><p>路程与时间的比会得到速度；这时比值通常带单位。</p></div>
                </div>
            </section>;
        }

        function RelationLab() {
            const [a, setA] = useState(3);
            const [b, setB] = useState(5);
            return <section className="module">
                <ModuleHead index="2" title="同一个数，四种熟悉的样子" desc="比、除法、分数在数值上可以互相改写；它们长得不同、各自表达的重点也不同。" goal="会互化，能说清区别" />
                <div className="card card-pad">
                    <div className="card-title-row">
                        <div><span className="tiny-label">等效关系</span><h3 className="card-title">改变前项、后项，三种写法同步变化</h3></div>
                        <span className="pill blue">后项不能为 0</span>
                    </div>
                    <div className="slider-list">
                        <div className="slider-row"><label><i className="dot"></i>前项 a</label><input aria-label="前项" type="range" min="1" max="12" value={a} onChange={e => setA(+e.target.value)} /><span className="slider-value">{a}</span></div>
                        <div className="slider-row"><label><i className="dot blue"></i>后项 b</label><input aria-label="后项" type="range" min="1" max="12" value={b} onChange={e => setB(+e.target.value)} /><span className="slider-value">{b}</span></div>
                    </div>
                    <div className="expression-chain">
                        <div className="expression-card ratio"><span className="expression-name">比</span><span className="expression">{a} : {b}</span><small>两个量的关系</small></div>
                        <span className="equals">=</span>
                        <div className="expression-card division"><span className="expression-name">除法</span><span className="expression">{a} ÷ {b}</span><small>一种运算</small></div>
                        <span className="equals">=</span>
                        <div className="expression-card fraction"><span className="expression-name">分数</span><span className="expression"><Fraction n={a} d={b} /></span><small>一个数</small></div>
                    </div>
                    <div className="value-banner">
                        <div><b>它们的值都叫这个比的“比值”</b><p>比值可以写成分数、小数或整数。</p></div>
                        <span className="value-number">{decimalText(a, b)}</span>
                    </div>
                </div>
                <div className="grid-even" style={{ marginTop: 18 }}>
                    <div className="card card-pad">
                        <h3 className="card-title" style={{ marginBottom: 12 }}>名称一一对应</h3>
                        <table className="concept-table">
                            <thead><tr><th>表达</th><th>前一个数</th><th>符号</th><th>后一个数</th><th>结果</th></tr></thead>
                            <tbody>
                                <tr><td>比</td><td>前项</td><td>:</td><td>后项</td><td>比值</td></tr>
                                <tr><td>除法</td><td>被除数</td><td>÷</td><td>除数</td><td>商</td></tr>
                                <tr><td>分数</td><td>分子</td><td>—</td><td>分母</td><td>分数值</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div className="stack">
                        <div className="callout blue"><b>相同点：</b>a:b = a÷b = <Fraction n="a" d="b" />，三者数值相等，且 b ≠ 0。</div>
                        <div className="callout coral"><b>不同点：</b>比强调两个量的关系；除法强调计算过程；分数本身就是一个数。写答案时要看题目在问什么。</div>
                        <div className="callout green"><b>比和比值别混：</b>3:5 是一个<b>比</b>；<Fraction n="3" d="5" /> 或 0.6 是它的<b>比值</b>。</div>
                    </div>
                </div>
            </section>;
        }

        const SIMPLIFY_CASES = [
            { label: '整数比', source: '18 : 24', steps: ['前后项都是整数。', '18 和 24 的最大公因数是 6。', '前项、后项同时除以 6。'], equation: '18 : 24 = 3 : 4', answer: '3 : 4' },
            { label: '小数比', source: '0.6 : 1.5', steps: ['先同时乘 10，去掉小数点。', '得到 6 : 15。', '再同时除以最大公因数 3。'], equation: '0.6 : 1.5 = 6 : 15 = 2 : 5', answer: '2 : 5' },
            { label: '分数比', source: '2/3 : 3/4', steps: ['分母 3 和 4 的最小公倍数是 12。', '前后项同时乘 12，化成整数比。', '得到 8 : 9，已经互质。'], equation: '2/3 : 3/4 = 8 : 9', answer: '8 : 9' },
            { label: '不同单位', source: '80 cm : 1.2 m', steps: ['先统一单位：1.2 m = 120 cm。', '得到 80 : 120。', '前后项同时除以 40。'], equation: '80 cm : 1.2 m = 80 : 120 = 2 : 3', answer: '2 : 3' }
        ];

        function SimplifyLab() {
            const [factor, setFactor] = useState(1);
            const [example, setExample] = useState(0);
            const c = SIMPLIFY_CASES[example];
            return <section className="module">
                <ModuleHead index="3" title="比的基本性质与化简" desc="前项和后项同时乘或除以同一个不为 0 的数，比值不变。它是化简比、判断等值比的核心。" goal="会化成最简整数比" />
                <div className="grid-even">
                    <div className="card card-pad">
                        <div className="card-title-row"><div><span className="tiny-label">基本性质</span><h3 className="card-title">同一杯配方，放大几倍都一样浓</h3></div><span className="pill blue">基准 2 : 3</span></div>
                        <div className="factor-control">
                            <span style={{ color: '#667085', fontSize: 13, fontWeight: 800 }}>同时乘</span>
                            <div className="factor-buttons">{[1,2,3,4].map(x => <button key={x} onClick={() => setFactor(x)} className={`factor-button ${factor === x ? 'active' : ''}`}>×{x}</button>)}</div>
                        </div>
                        <div className="equivalent-visual">
                            {[1,2,3].map(x => <div className={`recipe ${factor === x ? 'active' : ''}`} key={x} onClick={() => setFactor(x)}>
                                <div className="recipe-title"><span>{x} 杯配方</span><b>{2*x}:{3*x}</b></div>
                                <div className="recipe-dots">{Array.from({length:2*x},(_,i)=><i className="mini-dot" key={`r${i}`}></i>)}{Array.from({length:3*x},(_,i)=><i className="mini-dot blue" key={`b${i}`}></i>)}</div>
                            </div>)}
                        </div>
                        <div className="step-equation"><span>2 : 3</span><span className="step-arrow">同时乘 {factor}</span><span>=</span><span>{2*factor} : {3*factor}</span></div>
                        <div className="callout green" style={{ marginTop: 15 }}>数量都变成原来的 {factor} 倍，但红蓝配方的<b>浓淡没有变</b>，所以比值不变。</div>
                    </div>
                    <div className="card card-pad">
                        <div className="card-title-row"><div><span className="tiny-label">化简工具箱</span><h3 className="card-title">四类常见题</h3></div><span className="pill">最简整数比</span></div>
                        <div className="example-tabs">{SIMPLIFY_CASES.map((x,i)=><button key={x.label} className={`example-tab ${example===i?'active':''}`} onClick={()=>setExample(i)}>{x.label}</button>)}</div>
                        <div className="big-ratio" style={{ background: '#f7f9fb', borderRadius: 17, fontSize: 24, fontWeight: 900 }}>{c.source}</div>
                        <div className="solution-steps" style={{ marginTop: 16 }}>{c.steps.map(step=><div className="solution-step" key={step}>{step}</div>)}</div>
                        <div className="step-equation" style={{ minHeight: 75 }}>{c.equation}</div>
                        <div className="solution-answer">最简整数比：{c.answer}</div>
                    </div>
                </div>
                <div className="callout" style={{ marginTop: 18 }}><b>易错提醒：</b>化简比的结果仍然是一个<b>比</b>，一般写成 a:b；求比值的结果是一个<b>数</b>。不同单位的同类量相比，必须先统一单位。</div>
            </section>;
        }

        function ProportionLab() {
            const [values, setValues] = useState([2,3,4,6]);
            const [showX, setShowX] = useState(false);
            const setValue = (i, value) => setValues(values.map((v,j)=>j===i ? Math.max(1, Math.min(30, Number(value)||1)) : v));
            const [a,b,c,d] = values;
            const left = a*d, right = b*c, valid = left === right;
            return <section className="module">
                <ModuleHead index="4" title="两个相等的比，组成比例" desc="比例是一条等式。判断四个数能否组成比例，既可以比较比值，也可以用“两个外项的积等于两个内项的积”。" goal="会判断比例、会解比例" />
                <div className="grid-2">
                    <div className="card card-pad">
                        <div className="card-title-row"><div><span className="tiny-label">比例探测器</span><h3 className="card-title">改动四个数，等式还成立吗？</h3></div><span className={`pill ${valid?'green':'coral'}`}>{valid?'比例成立':'比例不成立'}</span></div>
                        <div className="proportion-form">
                            <input className="number-input" aria-label="第一个数" type="number" value={a} onChange={e=>setValue(0,e.target.value)} />
                            <span className="symbol">:</span>
                            <input className="number-input" aria-label="第二个数" type="number" value={b} onChange={e=>setValue(1,e.target.value)} />
                            <span className="symbol eq">=</span>
                            <input className="number-input" aria-label="第三个数" type="number" value={c} onChange={e=>setValue(2,e.target.value)} />
                            <span className="symbol">:</span>
                            <input className="number-input" aria-label="第四个数" type="number" value={d} onChange={e=>setValue(3,e.target.value)} />
                        </div>
                        <div className="term-map">
                            <div className="term-box outer">外项 {a}</div><div className="term-box inner">内项 {b}</div><div className="term-box inner">内项 {c}</div><div className="term-box outer">外项 {d}</div>
                        </div>
                        <div className="cross-products">
                            <div className="cross-card"><small>外项积</small><b>{a} × {d} = {left}</b></div>
                            <span className="equals">{valid?'=':'≠'}</span>
                            <div className="cross-card"><small>内项积</small><b>{b} × {c} = {right}</b></div>
                        </div>
                        <div className={`proportion-result ${valid?'yes':'no'}`}>{valid ? `${a}:${b} 和 ${c}:${d} 的比值相等，组成比例。` : `两个积不相等，不能组成比例。`}</div>
                        <button className="secondary-button" style={{ marginTop: 12, width: '100%' }} onClick={()=>setValues([2,3,4,6])}>恢复经典例子 2:3 = 4:6</button>
                    </div>
                    <div className="stack">
                        <div className="card card-pad">
                            <div className="card-title-row"><div><span className="tiny-label">解比例</span><h3 className="card-title">3 : 5 = x : 20</h3></div><button className="primary-button" onClick={()=>setShowX(!showX)}>{showX?'收起步骤':'演示步骤'}</button></div>
                            <div className="x-demo">
                                <div className="x-equation">3 : 5 = x : 20</div>
                                {showX ? <div className="solution-steps">
                                    <div className="solution-step">根据比例的基本性质：两个外项的积等于两个内项的积。</div>
                                    <div className="solution-step">3 × 20 = 5x，所以 60 = 5x。</div>
                                    <div className="solution-step">等式两边同时除以 5，得到 x = 12。</div>
                                    <div className="solution-answer">检验：3:5 = 12:20 = 0.6 ✓</div>
                                </div> : <div className="callout blue">先找外项与内项，再交叉相乘。点击“演示步骤”揭晓。</div>}
                            </div>
                        </div>
                        <div className="callout"><b>一句话记忆：</b>“比”是两个数相除；“比例”是两个比相等。<b>2:3</b> 是比，<b>2:3=4:6</b> 才是比例。</div>
                    </div>
                </div>
            </section>;
        }

        const RELATION_CASES = [
            { id:'direct', tag:'正比例', title:'数量与总价', desc:'单价固定为 3 元，数量扩大几倍，总价也扩大相同倍数。', x:[1,2,3,4,5], y:[3,6,9,12,15], rule:'总价 ÷ 数量 = 单价（一定），所以成正比例。' },
            { id:'inverse', tag:'反比例', title:'人数与天数', desc:'工作总量固定为 24 人·天，人数越多，完成天数越少。', x:[1,2,3,4,6], y:[24,12,8,6,4], rule:'人数 × 天数 = 工作总量（一定），所以成反比例。' },
            { id:'none', tag:'不成比例', title:'年龄与身高', desc:'年龄增加时身高通常会变化，但没有固定比值或固定乘积。', x:[1,2,3,4,5], y:[5,7,8,9,9.5], rule:'比值不固定、乘积也不固定，所以不成比例。' }
        ];

        function ApplicationLab() {
            const [relation, setRelation] = useState(0);
            const [tool, setTool] = useState('distribution');
            const [total, setTotal] = useState(60);
            const [r1, setR1] = useState(2);
            const [r2, setR2] = useState(3);
            const [mapCm, setMapCm] = useState(3);
            const [scale, setScale] = useState(100000);
            const c = RELATION_CASES[relation];
            const maxY = Math.max(...c.y);
            const firstShare = total * r1 / (r1+r2), secondShare = total * r2 / (r1+r2);
            const actualKm = mapCm * scale / 100000;
            return <section className="module">
                <ModuleHead index="5" title="教材常见考点，一次串起来" desc="在基础概念之后，还要会辨认正反比例，并能解决按比分配、比例尺等常见生活问题。" goal="会辨关系、能解决基础应用" />
                <div className="grid-even">
                    <div className="card card-pad">
                        <div className="card-title-row"><div><span className="tiny-label">关系辨析</span><h3 className="card-title">正比例、反比例，还是不成比例？</h3></div><span className={`type-badge ${c.id}`}>{c.tag}</span></div>
                        <div className="application-tabs">{RELATION_CASES.map((x,i)=><button className={`application-tab ${relation===i?'active':''}`} key={x.id} onClick={()=>setRelation(i)}><span>情境 {i+1}</span><b>{x.title}</b></button>)}</div>
                        <div className="relationship-stage">
                            <div className="relationship-head"><b>{c.desc}</b></div>
                            <div className="bar-chart">{c.y.map((y,i)=><div className="bar-column" key={i}><b style={{fontSize:11}}>{y}</b><div className="bar" style={{height:`${Math.max(9,y/maxY*98)}px`}}></div><span className="bar-label">{c.x[i]}</span></div>)}</div>
                            <p className="rule-line"><b>判断依据：</b>{c.rule}</p>
                        </div>
                    </div>
                    <div className="card card-pad">
                        <div className="card-title-row"><div><span className="tiny-label">应用小工具</span><h3 className="card-title">把比例用进生活</h3></div><span className="pill green">即时计算</span></div>
                        <div className="segmented" style={{ marginBottom: 18 }}><button className={tool==='distribution'?'active':''} onClick={()=>setTool('distribution')}>按比分配</button><button className={tool==='scale'?'active':''} onClick={()=>setTool('scale')}>比例尺</button></div>
                        {tool === 'distribution' ? <div className="application-calculator">
                            <div className="field-grid">
                                <div className="field"><label>总量</label><input type="number" min="1" value={total} onChange={e=>setTotal(Math.max(1,+e.target.value||1))} /></div>
                                <div className="field"><label>第一份比</label><input type="number" min="1" value={r1} onChange={e=>setR1(Math.max(1,+e.target.value||1))} /></div>
                                <div className="field"><label>第二份比</label><input type="number" min="1" value={r2} onChange={e=>setR2(Math.max(1,+e.target.value||1))} /></div>
                            </div>
                            <div className="distribution-bar"><div className="distribution-part" style={{width:`${r1/(r1+r2)*100}%`}}>{r1} 份</div><div className="distribution-part" style={{width:`${r2/(r1+r2)*100}%`}}>{r2} 份</div></div>
                            <div className="solution-steps">
                                <div className="solution-step">总份数：{r1} + {r2} = {r1+r2} 份。</div>
                                <div className="solution-step">每份：{total} ÷ {r1+r2} = {neat(total/(r1+r2))}。</div>
                            </div>
                            <div className="application-answer">第一部分：{neat(firstShare)}；第二部分：{neat(secondShare)}。两部分相加仍是 {total}。</div>
                        </div> : <div className="application-calculator">
                            <div className="field-grid" style={{gridTemplateColumns:'1fr 1fr'}}>
                                <div className="field"><label>图上距离（厘米）</label><input type="number" min=".1" step=".1" value={mapCm} onChange={e=>setMapCm(Math.max(.1,+e.target.value||.1))} /></div>
                                <div className="field"><label>比例尺 1 : n</label><select value={scale} onChange={e=>setScale(+e.target.value)}><option value="10000">1 : 10 000</option><option value="100000">1 : 100 000</option><option value="500000">1 : 500 000</option><option value="1000000">1 : 1 000 000</option></select></div>
                            </div>
                            <div className="callout blue"><b>比例尺 = 图上距离 : 实际距离</b><br />单位必须统一，它是一个比，通常不带单位。</div>
                            <div className="solution-steps"><div className="solution-step">实际距离 = {mapCm} × {scale} = {neat(mapCm*scale)} 厘米。</div><div className="solution-step">厘米换算成千米，要除以 100 000。</div></div>
                            <div className="application-answer">实际距离是 <b>{neat(actualKm)} 千米</b>。</div>
                        </div>}
                    </div>
                </div>
                <div className="card card-pad" style={{ marginTop: 18 }}>
                    <div className="card-title-row"><h3 className="card-title">教材知识清单</h3><span className="pill">六年级核心</span></div>
                    <div className="checklist">
                        {['比的意义、读写、前项、后项和比值','比与除法、分数的联系和区别','比的基本性质与化简比','比例的意义、内项外项和基本性质','解比例与按比分配','正比例、反比例、比例尺和图形放缩'].map(x=><div className="check-item" key={x}><span className="check-icon">✓</span><span>{x}</span></div>)}
                    </div>
                </div>
            </section>;
        }

        const QUESTIONS = [
            { type:'choice', tag:'比的意义', q:'红球有 4 个，蓝球有 6 个。红球与蓝球数量的比是？', options:['4 : 6','6 : 4','4 + 6','6 - 4'], answer:'4 : 6', explain:'题目先说红球、再说蓝球，所以顺序是 4:6。' },
            { type:'choice', tag:'比与比值', q:'下面哪一个是 3 : 5 的比值？', options:['3 : 5','5 : 3','0.6','1.6'], answer:'0.6', explain:'3:5 的比值就是 3÷5=0.6。' },
            { type:'input', tag:'化简比', q:'把 18 : 24 化成最简整数比。（用 a:b 的形式填写）', answer:'3:4', normalize:'ratio', explain:'18 和 24 同时除以最大公因数 6，得到 3:4。' },
            { type:'input', tag:'等值比', q:'2 : 3 = 8 : x，x 是多少？', answer:'12', normalize:'number', explain:'前项 2 变成 8，乘了 4；后项也乘 4，所以 x=12。' },
            { type:'choice', tag:'比例判断', q:'下面哪一组能组成比例？', options:['2:3 = 4:5','3:4 = 6:8','1:2 = 3:5','4:6 = 8:10'], answer:'3:4 = 6:8', explain:'3×8=24，4×6=24，外项积等于内项积。' },
            { type:'input', tag:'解比例', q:'解比例：3 : 5 = x : 20，x = ?', answer:'12', normalize:'number', explain:'3×20=5x，所以 60=5x，x=12。' },
            { type:'input', tag:'按比分配', q:'把 50 按 2 : 3 分配，较小的一份是多少？', answer:'20', normalize:'number', explain:'共 5 份，每份 50÷5=10，较小的一份是 10×2=20。' },
            { type:'choice', tag:'正反比例', q:'总路程一定，速度与行驶时间成什么关系？', options:['正比例','反比例','不成比例','无法判断'], answer:'反比例', explain:'速度×时间=路程（一定），所以速度与时间成反比例。' },
            { type:'choice', tag:'基本性质', q:'把 5 : 7 的前项和后项同时乘 3，新比是？', options:['15:21','8:10','15:7','5:21'], answer:'15:21', explain:'前项、后项同时乘 3，比值不变：5:7=15:21。' },
            { type:'input', tag:'比例尺', q:'比例尺是 1:100000，图上 2 厘米表示实际多少千米？', answer:'2', normalize:'number', explain:'2×100000=200000 厘米，也就是 2 千米。' }
        ];

        function PracticeLab() {
            const [index, setIndex] = useState(0);
            const [answers, setAnswers] = useState(Array(QUESTIONS.length).fill(null));
            const [draft, setDraft] = useState('');
            const [checked, setChecked] = useState(false);
            const [finished, setFinished] = useState(false);
            const q = QUESTIONS[index];
            const correctCount = answers.filter(Boolean).length;
            const normalize = (value, type) => {
                const s = String(value).trim().replace(/：/g,':').replace(/\s+/g,'');
                if (type === 'ratio') return s;
                if (type === 'number') return neat(Number(s));
                return s;
            };
            const isCorrect = checked && normalize(draft, q.normalize) === normalize(q.answer, q.normalize);
            const submit = () => {
                if (!draft || checked) return;
                const right = normalize(draft, q.normalize) === normalize(q.answer, q.normalize);
                const next = [...answers]; next[index] = right; setAnswers(next); setChecked(true);
            };
            const next = () => {
                if (index === QUESTIONS.length - 1) { setFinished(true); return; }
                setIndex(index+1); setDraft(''); setChecked(false);
            };
            const restart = () => { setIndex(0); setAnswers(Array(QUESTIONS.length).fill(null)); setDraft(''); setChecked(false); setFinished(false); };
            const progress = finished ? 100 : (index / QUESTIONS.length * 100);
            return <section className="module">
                <ModuleHead index="6" title="简单练习：把知识变成自己的" desc="共 10 道基础题，覆盖读写、化简、比例、应用。每答一题马上看到解释。" goal="正确率达到 80%" />
                <div className="practice-layout">
                    <aside className="card practice-side">
                        <div className="score-ring" style={{'--progress':`${progress}%`}}><div className="score-ring-inner"><strong>{correctCount}</strong><small>答对</small></div></div>
                        <div>
                            <h3 className="card-title" style={{ marginBottom: 12 }}>闯关进度</h3>
                            <div className="practice-dots">{QUESTIONS.map((_,i)=><span key={i} className={`practice-dot ${i===index&&!finished?'current':''} ${answers[i]===true?'right':answers[i]===false?'wrong':''}`}>{i+1}</span>)}</div>
                            <p style={{ color:'#7a8698', fontSize:12, lineHeight:1.6, marginBottom:0 }}>绿色表示答对，红色表示需要回看解析。</p>
                        </div>
                    </aside>
                    <div className="card practice-card">
                        {finished ? <div className="finished">
                            <div className="finished-icon">{correctCount >= 8 ? '🏆' : correctCount >= 6 ? '🌱' : '🧭'}</div>
                            <h3>完成练习，答对 {correctCount} / {QUESTIONS.length}</h3>
                            <p>{correctCount >= 8 ? '很棒！你已经掌握了比与比例的核心知识。' : '已经走完全程。建议回到前面的演示，把红色题点对应的知识再操作一次。'}</p>
                            <button className="primary-button" onClick={restart}>重新练习</button>
                        </div> : <>
                            <div className="question-meta"><span className="question-number">第 {index+1} / {QUESTIONS.length} 题</span><span className="pill blue">{q.tag}</span></div>
                            <h3 className="question-title">{q.q}</h3>
                            {q.type === 'choice' ? <div className="options">{q.options.map(option=>{
                                const state = checked ? (option===q.answer?'correct':option===draft?'wrong':'') : option===draft?'selected':'';
                                return <button disabled={checked} key={option} className={`option ${state}`} onClick={()=>setDraft(option)}>{option}</button>;
                            })}</div> : <div className="answer-input"><input disabled={checked} autoComplete="off" placeholder="在这里填写答案" value={draft} onChange={e=>setDraft(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')submit();}} /><button className="primary-button" onClick={submit}>检查答案</button></div>}
                            {checked && <div className={`feedback ${isCorrect?'right':'wrong'}`}><b>{isCorrect?'回答正确！':'再想一想。'}</b> {q.explain}</div>}
                            <div className="question-actions">
                                {!checked && q.type==='choice' && <button className="primary-button" disabled={!draft} style={{opacity:draft?1:.45}} onClick={submit}>检查答案</button>}
                                {checked && <button className="primary-button" onClick={next}>{index===QUESTIONS.length-1?'查看成绩':'下一题 →'}</button>}
                            </div>
                        </>}
                    </div>
                </div>
            </section>;
        }

        function App() {
            const [active, setActive] = useState(0);
            const components = [<MeaningLab />, <RelationLab />, <SimplifyLab />, <ProportionLab />, <ApplicationLab />, <PracticeLab />];
            const go = next => { setActive(next); window.scrollTo({ top: 0, behavior: 'smooth' }); };
            return <div className="app-shell">
                <header className="hero">
                    <div className="hero-top">
                        <div className="brand"><span className="brand-mark">∶</span><span>Math101 · 小学数学探索工具</span></div>
                        <a href="../" className="home-link" aria-label="返回工具首页">← 返回首页</a>
                    </div>
                    <div className="hero-main">
                        <div>
                            <p className="eyebrow">RATIO & PROPORTION LAB</p>
                            <h1>比与比例探索实验室</h1>
                            <p className="hero-copy">从几颗方块开始，看见两个数量的关系；再把比、除法、分数、比例连成一张清楚的知识地图。</p>
                        </div>
                        <div className="hero-badge"><div className="ratio-glyph"><i></i><i></i><i></i><i></i><i></i></div><div><strong>2 : 3</strong><span>看见关系 · 理解本质</span></div></div>
                    </div>
                </header>
                <div className="lesson-nav-wrap">
                    <nav className="lesson-nav" aria-label="课程导航">{LESSONS.map((item,i)=><button key={item.id} onClick={()=>go(i)} className={`nav-button ${active===i?'active':''}`}><span className="nav-index">{i+1}</span><span>{item.short}</span></button>)}</nav>
                </div>
                <main className="main">
                    {components[active]}
                    <div className="bottom-nav">
                        <button className="secondary-button" style={{visibility:active===0?'hidden':'visible'}} onClick={()=>go(active-1)}>← 上一站</button>
                        {active < LESSONS.length-1 && <button className="primary-button" onClick={()=>go(active+1)}>下一站：{LESSONS[active+1].label} →</button>}
                    </div>
                </main>
                <footer>©孙维刚教育研究院 小宇老师 版权所有 · 比与比例探索实验室</footer>
            </div>;
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
