<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>图形密铺 | Math101</title>
    <link rel="stylesheet" href="../ipad-touch-adapter.css">
    <style>
        :root {
            --ink: #172033; --muted: #667085; --line: #d9e2f0; --paper: #fff;
            --blue: #4f46e5; --cyan: #0891b2; --green: #059669; --amber: #d97706; --red: #dc2626;
            --shadow: 0 18px 45px rgba(30, 41, 59, .11);
        }
        * { box-sizing: border-box; }
        html { -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; min-height: 100vh; color: var(--ink);
            font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
            background:
                radial-gradient(circle at 12% 0, #dbeafe 0, transparent 25rem),
                radial-gradient(circle at 92% 14%, #fce7f3 0, transparent 22rem), #f5f7fb;
        }
        button, input { font: inherit; }
        button { cursor: pointer; -webkit-user-select: none; user-select: none; }
        .page { width: min(1120px, 100%); margin: 0 auto; padding: 20px; }
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
        .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .brand-icon {
            width: 48px; height: 48px; flex: 0 0 auto; border-radius: 15px; color: #fff;
            display: grid; place-items: center; font-size: 25px; font-weight: 900;
            background: linear-gradient(135deg, #4f46e5, #0891b2); box-shadow: 0 10px 24px #4f46e548;
        }
        h1 { margin: 0; font-size: clamp(22px, 3.5vw, 31px); }
        .sub { margin: 3px 0 0; color: var(--muted); font-size: 13px; font-weight: 700; }
        .home, .small-btn, .tool-btn {
            min-height: 42px; border: 1px solid var(--line); border-radius: 12px; padding: 8px 13px;
            background: #fff; color: #344054; font-weight: 850; text-decoration: none;
            display: inline-flex; align-items: center; justify-content: center; gap: 5px;
            box-shadow: 0 3px 9px rgba(15, 23, 42, .05);
        }
        .small-btn:hover, .tool-btn:hover, .home:hover { border-color: #818cf8; color: #4338ca; }
        .small-btn.primary, .tool-btn.primary { color: #fff; background: var(--blue); border-color: var(--blue); }
        .small-btn.danger { color: var(--red); }
        .tabs {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; padding: 6px;
            border: 1px solid var(--line); border-radius: 17px; background: rgba(255,255,255,.92); margin-bottom: 14px;
        }
        .tab {
            min-height: 46px; border: 0; border-radius: 12px; color: var(--muted); background: transparent;
            font-size: 15px; font-weight: 900;
        }
        .tab.active { color: #fff; background: var(--blue); box-shadow: 0 8px 18px #4f46e544; }
        .panel {
            background: rgba(255,255,255,.96); border: 1px solid #e2e8f0; border-radius: 20px;
            box-shadow: var(--shadow); padding: 20px;
        }
        .view { display: none; animation: show .2s ease; }
        .view.active { display: block; }
        @keyframes show { from { opacity: 0; transform: translateY(5px); } }
        .view-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
        h2 { margin: 0; font-size: clamp(18px, 2.8vw, 23px); }
        .mini-tip { color: var(--muted); font-size: 13px; font-weight: 750; white-space: nowrap; }
        .chips, .steps, .toolbar, .colors { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
        .chips { margin-bottom: 12px; }
        .chip, .step {
            min-height: 40px; border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px;
            background: #f8fafc; color: #475467; font-weight: 850;
        }
        .chip.active, .step.active { color: #fff; border-color: var(--blue); background: var(--blue); }
        .stage {
            position: relative; border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
            background-color: #fbfdff;
            background-image: linear-gradient(#e9eef6 1px, transparent 1px), linear-gradient(90deg,#e9eef6 1px,transparent 1px);
            background-size: 24px 24px;
        }
        .stage svg { width: 100%; height: auto; min-height: 300px; display: block; touch-action: none; }
        .result {
            position: absolute; right: 12px; top: 12px; min-width: 104px; min-height: 42px;
            border-radius: 999px; padding: 8px 14px; display: flex; align-items: center; justify-content: center;
            gap: 6px; font-weight: 950; color: #065f46; background: #ecfdf5e8; border: 2px solid #6ee7b7;
            backdrop-filter: blur(5px); pointer-events: none;
        }
        .result.warn { color: #92400e; background: #fffbebe8; border-color: #fcd34d; }
        .result.bad { color: #991b1b; background: #fff1f2e8; border-color: #fda4af; }
        .underbar { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .formula {
            min-height: 42px; border-radius: 12px; padding: 9px 15px; display: inline-flex; align-items: center;
            background: #eef2ff; color: #3730a3; font-size: 16px; font-weight: 950;
        }
        .drag-dot { cursor: grab; filter: drop-shadow(0 3px 5px rgba(15,23,42,.2)); }
        .drag-dot:active { cursor: grabbing; }
        .board-layout { display: grid; grid-template-columns: 174px minmax(0, 1fr); gap: 12px; }
        .tray { border: 1px solid var(--line); background: #f8fafc; border-radius: 16px; padding: 11px; }
        .tray-title { margin: 0 0 8px; color: var(--muted); font-size: 12px; font-weight: 850; }
        .shape-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }
        .shape-btn {
            min-height: 64px; border: 2px solid transparent; border-radius: 13px; background: #fff;
            color: #344054; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 3px;
            font-size: 12px; font-weight: 850; box-shadow: 0 3px 8px rgba(15,23,42,.05);
        }
        .shape-btn svg { width: 31px; height: 31px; pointer-events: none; }
        .shape-btn.active { border-color: var(--blue); color: #4338ca; background: #eef2ff; }
        .palette-title { margin: 12px 0 7px; color: var(--muted); font-size: 12px; font-weight: 850; }
        .color-btn { width: 32px; height: 32px; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 0 1px #cbd5e1; padding: 0; }
        .color-btn.active { box-shadow: 0 0 0 3px #312e81; transform: scale(.92); }
        .board-main { min-width: 0; }
        .toolbar { margin-bottom: 9px; }
        .tool-btn { min-height: 39px; padding: 7px 11px; font-size: 13px; }
        .toggle-on { background: #ecfdf5; border-color: #6ee7b7; color: #047857; }
        .board-stage svg { min-height: 430px; cursor: crosshair; }
        .tile { cursor: grab; touch-action: none; }
        .tile:active { cursor: grabbing; }
        .board-footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 9px; }
        .board-status { color: var(--muted); font-size: 13px; font-weight: 800; }
        .board-status.overlap { color: var(--red); }
        .kbd { border: 1px solid var(--line); background: #f8fafc; padding: 2px 6px; border-radius: 6px; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
        @media (max-width: 760px) {
            .page { padding: 12px; }
            .topbar { align-items: flex-start; }
            .home { min-height: 40px; padding: 7px 10px; font-size: 13px; }
            .tabs { grid-template-columns: repeat(5, minmax(72px, 1fr)); overflow-x: auto; }
            .tab { font-size: 14px; }
            .panel { padding: 13px; }
            .board-layout { grid-template-columns: 1fr; }
            .tray { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; }
            .tray-title, .palette-title { margin: 0; }
            .shape-grid { grid-template-columns: repeat(6, minmax(62px, 1fr)); overflow-x: auto; grid-column: 1 / -1; }
            .colors { flex-wrap: nowrap; }
            .shape-btn { min-height: 58px; }
            .board-stage svg { min-height: 390px; }
            .mini-tip { display: none; }
        }
        @media (max-width: 470px) {
            .brand-icon { width: 42px; height: 42px; }
            .sub { font-size: 12px; }
            .tabs { margin-bottom: 10px; }
            .view-head { margin-bottom: 9px; }
            .chip, .step { min-height: 38px; padding: 6px 11px; font-size: 13px; }
            .result { top: 8px; right: 8px; min-width: 86px; min-height: 38px; font-size: 13px; }
            .tool-btn { flex: 1 0 auto; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    </style>
</head>
<body>
<div class="page">
    <header class="topbar">
        <div class="brand">
            <div class="brand-icon" aria-hidden="true">▧</div>
            <div><h1>图形密铺</h1><p class="sub">不留空 · 不重叠</p></div>
        </div>
        <a class="home" href="/">⌂ 首页</a>
    </header>

    <nav class="tabs" aria-label="学习步骤">
        <button class="tab active" data-view="find">发现</button>
        <button class="tab" data-view="corner">围一点</button>
        <button class="tab" data-view="triangle">三角形</button>
        <button class="tab" data-view="quad">四边形</button>
        <button class="tab" data-view="board">画板</button>
    </nav>

    <main class="panel">
        <section class="view active" id="view-find">
            <div class="view-head"><h2>谁能铺满？</h2><span class="mini-tip">点一个图形</span></div>
            <div class="chips" id="findShapes">
                <button class="chip active" data-shape="triangle">三角形</button>
                <button class="chip" data-shape="square">正方形</button>
                <button class="chip" data-shape="pentagon">正五边形</button>
                <button class="chip" data-shape="hexagon">正六边形</button>
                <button class="chip" data-shape="circle">圆</button>
                <button class="chip" data-shape="mix">混合</button>
            </div>
            <div class="stage">
                <svg id="findSvg" viewBox="0 0 900 450" role="img" aria-label="密铺演示图"></svg>
                <div class="result" id="findResult">✓ 铺满</div>
            </div>
            <div class="underbar"><button class="small-btn" id="findShuffle">🎨 换色</button><button class="small-btn primary" id="findNext">下一个 ›</button></div>
        </section>

        <section class="view" id="view-corner">
            <div class="view-head"><h2>围住一个点</h2><span class="mini-tip">拖动“几块”</span></div>
            <div class="chips" id="cornerShapes">
                <button class="chip active" data-sides="3">三角形</button>
                <button class="chip" data-sides="4">正方形</button>
                <button class="chip" data-sides="5">正五边形</button>
                <button class="chip" data-sides="6">正六边形</button>
            </div>
            <div class="stage">
                <svg id="cornerSvg" viewBox="0 0 900 450" role="img" aria-label="图形围绕一点"></svg>
                <div class="result warn" id="cornerResult">还差</div>
            </div>
            <div class="underbar">
                <button class="small-btn" id="cornerMinus" aria-label="减少一块">－</button>
                <label class="formula">几块&nbsp;<input id="cornerCount" type="range" min="1" max="7" value="6" aria-label="图形块数"></label>
                <button class="small-btn" id="cornerPlus" aria-label="增加一块">＋</button>
                <div class="formula" id="cornerFormula">60° × 6 = 360°</div>
            </div>
        </section>

        <section class="view" id="view-triangle">
            <div class="view-head"><h2>三角形：转半圈</h2><span class="mini-tip">拖动彩色圆点</span></div>
            <div class="steps" data-demo="triangle">
                <button class="step active" data-step="1">1 一块</button>
                <button class="step" data-step="2">2 转半圈</button>
                <button class="step" data-step="3">3 铺开</button>
            </div>
            <div class="stage"><svg id="triangleSvg" viewBox="0 0 900 450" role="img" aria-label="任意三角形密铺演示"></svg></div>
            <div class="underbar"><div class="formula" id="triangleFormula">拖动三个点</div></div>
        </section>

        <section class="view" id="view-quad">
            <div class="view-head"><h2>四边形：四个角</h2><span class="mini-tip">拖动彩色圆点</span></div>
            <div class="steps" data-demo="quad">
                <button class="step active" data-step="1">1 一块</button>
                <button class="step" data-step="2">2 围一点</button>
                <button class="step" data-step="3">3 铺开</button>
            </div>
            <div class="stage"><svg id="quadSvg" viewBox="0 0 900 450" role="img" aria-label="任意四边形密铺演示"></svg></div>
            <div class="underbar"><div class="formula" id="quadFormula">四个角相加 = 360°</div></div>
        </section>

        <section class="view" id="view-board">
            <div class="view-head"><h2>密铺画板</h2><span class="mini-tip">选图形 · 放一块 · 拖动</span></div>
            <div class="board-layout">
                <aside class="tray">
                    <p class="tray-title">选图形</p>
                    <div class="shape-grid" id="boardShapes">
                        <button class="shape-btn active" data-shape="triangle"><svg viewBox="0 0 40 40"><polygon points="20,4 37,35 3,35" fill="#fb7185"/></svg><span>三角形</span></button>
                        <button class="shape-btn" data-shape="square"><svg viewBox="0 0 40 40"><rect x="5" y="5" width="30" height="30" rx="2" fill="#60a5fa"/></svg><span>正方形</span></button>
                        <button class="shape-btn" data-shape="diamond"><svg viewBox="0 0 40 40"><polygon points="9,7 37,7 31,33 3,33" fill="#fbbf24"/></svg><span>四边形</span></button>
                        <button class="shape-btn" data-shape="hexagon"><svg viewBox="0 0 40 40"><polygon points="10,4 30,4 39,20 30,36 10,36 1,20" fill="#34d399"/></svg><span>正六边形</span></button>
                        <button class="shape-btn" data-shape="pentagon"><svg viewBox="0 0 40 40"><polygon points="20,3 38,16 31,37 9,37 2,16" fill="#a78bfa"/></svg><span>正五边形</span></button>
                        <button class="shape-btn" data-shape="circle"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#22d3ee"/></svg><span>圆</span></button>
                    </div>
                    <p class="palette-title">换颜色</p>
                    <div class="colors" id="boardColors" aria-label="颜色">
                        <button class="color-btn active" data-color="#fb7185" style="background:#fb7185" aria-label="红色"></button>
                        <button class="color-btn" data-color="#60a5fa" style="background:#60a5fa" aria-label="蓝色"></button>
                        <button class="color-btn" data-color="#34d399" style="background:#34d399" aria-label="绿色"></button>
                        <button class="color-btn" data-color="#fbbf24" style="background:#fbbf24" aria-label="黄色"></button>
                        <button class="color-btn" data-color="#a78bfa" style="background:#a78bfa" aria-label="紫色"></button>
                    </div>
                </aside>
                <div class="board-main">
                    <div class="toolbar">
                        <button class="tool-btn primary" id="addTile">＋ 放一块</button>
                        <button class="tool-btn" id="autoFill">▦ 试着铺</button>
                        <button class="tool-btn" id="rotateLeft" aria-label="向左旋转">↶</button>
                        <button class="tool-btn" id="rotateRight" aria-label="向右旋转">↷</button>
                        <button class="tool-btn" id="duplicateTile" aria-label="复制">⧉</button>
                        <button class="tool-btn" id="deleteTile" aria-label="删除">⌫</button>
                        <button class="tool-btn toggle-on" id="snapToggle">⊞ 对齐</button>
                        <button class="tool-btn" id="undoBoard">↩</button>
                        <button class="tool-btn danger" id="clearBoard">清空</button>
                        <button class="tool-btn" id="saveBoard">保存</button>
                    </div>
                    <div class="stage board-stage">
                        <svg id="boardSvg" viewBox="0 0 900 520" role="application" aria-label="可拖动的密铺画板">
                            <defs><clipPath id="boardClip"><rect width="900" height="520" rx="14"/></clipPath></defs>
                            <g id="boardTiles" clip-path="url(#boardClip)"></g>
                        </svg>
                    </div>
                    <div class="board-footer"><span class="board-status" id="boardStatus">点图形，再放一块</span><span class="board-status"><span class="kbd">拖</span> 移动</span></div>
                </div>
            </div>
        </section>
    </main>
</div>

<script>
(() => {
    "use strict";

    const NS = "http://www.w3.org/2000/svg";
    const colors = ["#fb7185", "#60a5fa", "#34d399", "#fbbf24", "#a78bfa", "#22d3ee"];
    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
    const rad = degree => degree * Math.PI / 180;
    const svgEl = (tag, attrs = {}, parent) => {
        const node = document.createElementNS(NS, tag);
        Object.entries(attrs).forEach(([key, value]) => {
            if (key === "text") node.textContent = value;
            else node.setAttribute(key, value);
        });
        if (parent) parent.appendChild(node);
        return node;
    };
    const wipe = node => { while (node.firstChild) node.removeChild(node.firstChild); };
    const pointString = points => points.map(p => `${p[0].toFixed(2)},${p[1].toFixed(2)}`).join(" ");
    const polygon = (parent, points, fill, extra = {}) => svgEl("polygon", {
        points: pointString(points), fill, stroke: "#ffffff", "stroke-width": 2, "stroke-linejoin": "round", ...extra
    }, parent);
    const svgPoint = (svg, event) => {
        const p = svg.createSVGPoint();
        p.x = event.clientX; p.y = event.clientY;
        return p.matrixTransform(svg.getScreenCTM().inverse());
    };
    const regular = (n, cx, cy, radius, rotation = -90) => Array.from({ length: n }, (_, i) => {
        const a = rad(rotation + i * 360 / n);
        return [cx + radius * Math.cos(a), cy + radius * Math.sin(a)];
    });
    const centroid = points => [
        points.reduce((sum, p) => sum + p[0], 0) / points.length,
        points.reduce((sum, p) => sum + p[1], 0) / points.length
    ];
    const rotatePoint = (point, center, degree) => {
        const a = rad(degree), dx = point[0] - center[0], dy = point[1] - center[1];
        return [center[0] + dx * Math.cos(a) - dy * Math.sin(a), center[1] + dx * Math.sin(a) + dy * Math.cos(a)];
    };
    const setResult = (node, kind, text) => {
        node.className = `result${kind ? ` ${kind}` : ""}`;
        node.textContent = text;
    };

    // 页签
    $$(".tab").forEach(button => button.addEventListener("click", () => {
        $$(".tab").forEach(item => item.classList.toggle("active", item === button));
        $$(".view").forEach(view => view.classList.toggle("active", view.id === `view-${button.dataset.view}`));
        if (button.dataset.view === "board") renderBoard();
    }));

    // 发现：可以和不可以密铺的直观对比
    const findSvg = $("#findSvg");
    const findResult = $("#findResult");
    const findOrder = ["triangle", "square", "pentagon", "hexagon", "circle", "mix"];
    let findShape = "triangle";
    let colorShift = 0;

    function drawFind() {
        wipe(findSvg);
        const defs = svgEl("defs", {}, findSvg);
        const clip = svgEl("clipPath", { id: "findClip" }, defs);
        svgEl("rect", { x: 0, y: 0, width: 900, height: 450, rx: 14 }, clip);
        const group = svgEl("g", { "clip-path": "url(#findClip)" }, findSvg);
        svgEl("rect", { width: 900, height: 450, fill: "#f8fbff" }, group);
        const pick = index => colors[(index + colorShift) % colors.length];

        if (findShape === "triangle") {
            const side = 82, h = side * Math.sqrt(3) / 2;
            for (let row = -1; row < 8; row++) for (let col = -2; col < 13; col++) {
                const x = col * side + (row % 2 ? side / 2 : 0), y = row * h;
                polygon(group, [[x,y],[x+side,y],[x+side/2,y+h]], pick(row + col + 30));
                polygon(group, [[x+side,y],[x+side*1.5,y+h],[x+side/2,y+h]], pick(row + col + 31));
            }
            setResult(findResult, "", "✓ 铺满");
        } else if (findShape === "square") {
            const side = 76;
            for (let row = -1; row < 7; row++) for (let col = -1; col < 13; col++) {
                const x = col * side, y = row * side;
                polygon(group, [[x,y],[x+side,y],[x+side,y+side],[x,y+side]], pick(row + col + 20));
            }
            setResult(findResult, "", "✓ 铺满");
        } else if (findShape === "hexagon") {
            const radius = 48, dy = Math.sqrt(3) * radius;
            for (let col = -1; col < 14; col++) for (let row = -2; row < 8; row++) {
                const x = col * 1.5 * radius, y = row * dy + (col % 2 ? dy / 2 : 0);
                polygon(group, regular(6, x, y, radius, 0), pick(row + col + 20));
            }
            setResult(findResult, "", "✓ 铺满");
        } else if (findShape === "pentagon") {
            const radius = 48;
            for (let row = 0; row < 6; row++) for (let col = 0; col < 11; col++) {
                const x = 45 + col * 87 + (row % 2 ? 43 : 0), y = 42 + row * 82;
                polygon(group, regular(5, x, y, radius), pick(row + col));
            }
            setResult(findResult, "warn", "◇ 有空隙");
        } else if (findShape === "circle") {
            const radius = 39;
            for (let row = 0; row < 6; row++) for (let col = 0; col < 12; col++) {
                svgEl("circle", { cx: 42 + col * 80, cy: 40 + row * 80, r: radius, fill: pick(row + col), stroke: "#fff", "stroke-width": 2 }, group);
            }
            setResult(findResult, "warn", "◇ 有空隙");
        } else {
            const side = 78;
            for (let row = -1; row < 7; row++) for (let col = -1; col < 13; col++) {
                const x = col * side, y = row * side;
                if ((row + col) % 3 === 0) {
                    polygon(group, [[x,y],[x+side,y],[x+side,y+side],[x,y+side]], pick(row + col + 15));
                } else {
                    polygon(group, [[x,y],[x+side,y],[x,y+side]], pick(row + col + 17));
                    polygon(group, [[x+side,y],[x+side,y+side],[x,y+side]], pick(row + col + 18));
                }
            }

    }
    function polygonsOverlap(a, b) {
